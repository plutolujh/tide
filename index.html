irectly powering AI chips installed on the vessel.\n\nRather than transmitting renewable energy to land-based facilities, Panthalassa's approach tra","content_zh":"# 硅谷押注海洋人工智能数据中心\n包括帕兰提尔联合创始人彼得·蒂尔在内的硅谷投资方，已向初创企业潘塔莱萨累计投资约2亿美元，该公司是全波浪能供电浮动AI数据中心理念的先行者。最新一轮1.4亿美元融资将助力潘塔莱萨在俄勒冈州波特兰市附近建成试点制造工厂，同时加快在公海部署波浪能计算节点的进程。\n该技术用到的巨型浮动结构外观类似大型钢球，水面下方延伸出垂直管状构件。当波浪带动浮动装置晃动时，水流会被挤压顺着管道向上流入压力蓄水池。释放的水流会带动涡轮发电机运转，产出的可再生电力直接为安装在平台上的AI芯片供电。\n潘塔莱萨的方案无需将可再生能源传输到陆基设施，其","source":"ars","created_at":"2026-05-06T00:17:45.05389+00:00","original_url":"https://arstechnica.com/ai/2026/05/silicon-valley-bets-on-floating-ai-data-centers-powered-by-ocean-waves/","categories":{"title":"tech","sort_order":0}},{"id":"fd4a5a9e-153a-493d-a1ae-cb97a0beed9f","title":"OpenAI president forced to read his personal diary entries to jury → OpenAI总裁被迫向陪审团朗读个人日记","title_en":"OpenAI president forced to read his personal diary entries to jury","title_zh":"OpenAI总裁被迫向陪审团朗读个人日记","content_en":"OpenAI president Greg Brockman has been testifying in a high-profile trial where Elon Musk alleges that OpenAI abandoned its nonprofit mission to instead focus on personally enriching leaders like Brockman and Sam Altman. Brockman has been forced to read personal journal entries aloud in court, describing the experience as \"very painful.\" The journal entries, which span from 2015 when OpenAI was founded to 2023 when Brockman and Altman were briefly ousted, were submitted as evidence by OpenAI in October but became public when unsealed in January. Musk's legal team argues the diaries show the moment OpenAI leaders decided to abandon their nonprofit mission, with Brockman explicitly discussing stealing a charity from Musk and hoping to earn a billion dollars for his contributions. Brockman claims the entries reflect a stream of consciousness and include notes representing other people's viewpoints, making them difficult to interpret out of context. The trial is being livestreamed on YouT","content_zh":"OpenAI总裁格雷格·布罗克曼日前正在一场备受瞩目的庭审中作证，埃隆·马斯克在该案中指控OpenAI背弃了自身的非营利使命，转而专注于为布罗克曼、萨姆·奥尔特曼等高管谋取私利。\n布罗克曼被迫当庭大声朗读个人日记条目，称这段经历“非常痛苦”。这些日记的时间跨度从2015年OpenAI成立起，至2023年布罗克曼与奥尔特曼被短暂罢免为止，由OpenAI于10月作为证据提交，1月解封后对外公开。\n马斯克的法律团队主张，这些日记记录了OpenAI领导层决定放弃非营利使命的关键节点，其中布罗克曼明确提及要从马斯克手中窃取这家慈善机构，还希望凭借自身贡献赚得10亿美元。布罗克曼则声称，这些条目属于意识流记录，其中部分内容记载的是他人的观点，脱离语境很难解读。\n本次庭审正在YouTube上直播。","source":"ars","created_at":"2026-05-06T00:15:56.303166+00:00","original_url":"https://arstechnica.com/tech-policy/2026/05/openai-president-explains-to-jury-why-his-diary-entries-sound-greedy/","categories":{"title":"tech","sort_order":0}},{"id":"91ed1d9e-d37d-4fd2-aaff-42eaa76fdb57","title":"Google Home&#8217;s Gemini AI can handle more complicated requests → Google Home 的 Gemini AI 可以处理更复杂的请求","title_en":"Google Home&#8217;s Gemini AI can handle more complicated requests","title_zh":"Google Home 的 Gemini AI 可以处理更复杂的请求","content_en":"Summary\n\nGoogle has announced a significant upgrade to its Google Home smart home assistant, integrating the Gemini 3.1 AI model to enhance the device's capabilities. According to a report from The Verge published on May 5, 2026, this upgrade represents a major advancement in how users can interact with their smart home devices through voice commands. The key improvement is that Gemini 3.1 enables Google's smart home assistant to process and handle multiple requests within a single voice command, rather than requiring users to issue separate commands for each action. This enhancement addresses a longstanding limitation in voice-activated home automation, where users previously had to break down complex tasks into individual instructions. The upgrade reflects Google's ongoing efforts to make its artificial intelligence more capable of understanding and executing nuanced, multi-step requests, similar to how a human assistant would comprehend and carry out several tasks when given a com","content_zh":"摘要\n\n谷歌宣布对其Google Home智能家居助手进行重大升级，整合了Gemini 3.1 AI模型以增强设备的功能。据The Verge于2026年5月5日发布的一篇报道，这次升级代表了用户通过语音命令与智能家居设备交互方式的重大进步。关键的改进在于Gemini 3.1使谷歌的智能家居助手能够在一个语音命令中处理和处理多个请求，而不再要求用户为每个操作发出单独的指令。这一增强解决了语音激活家庭自动化领域长期存在的一个局限，用户此前必须将复杂任务分解为单独的指令。这次升级反映了谷歌持续的努力，使其人工智能能够更好地理解和执行细微的多步骤请求，就像人类助手理解和执行多个任务一样。","source":"verge","created_at":"2026-05-06T00:14:03.222581+00:00","original_url":"https://www.theverge.com/tech/924755/google-home-gemini-3-1-upgrade","categories":{"title":"tech","sort_order":0}},{"id":"cfa59242-36c5-4a96-a3b3-e2cc0fabc82f","title":"Lucid Motors doesn&#8217;t know how many EVs it will build this year → Lucid汽车公司尚不清楚今年将生产多少辆电动汽车。","title_en":"Lucid Motors doesn&#8217;t know how many EVs it will build this year","title_zh":"Lucid汽车公司尚不清楚今年将生产多少辆电动汽车。","content_en":"Lucid Motors announced that it has withdrawn its full‑year production guidance, acknowledging that it currently cannot forecast exactly how many electric vehicles it will manufacture in 2026. The company says it is dealing with a growing inventory of unsold cars and a firm‑wide effort to cut costs, which have created enough uncertainty that executives are unable to provide a reliable target for vehicle output. The decision marks a notable shift for the EV maker, which had previously offered specific production forecasts to investors and analysts. Lucid’s leadership indicated that it will focus on aligning manufacturing capacity with market demand and improving operational efficiency before issuing new guidance. The move reflects broader challenges in the electric‑vehicle sector, where rising inventory levels and slower‑than‑expected sales have pressured several manufacturers to reassess their production plans. Investors reacted with caution, as the lack of a clear production outlook ra","content_zh":"Lucid汽车宣布已撤回全年产量指引，承认目前无法准确预测2026年的电动汽车产量。该公司表示，当前正应对未售车辆库存不断攀升、全公司范围推进成本削减的状况，由此产生的不确定性过高，高管无法给出可靠的车辆产量目标。\n这一决定标志着这家电动汽车制造商的重大转向，此前该公司一贯向投资者和分析师提供具体的产量预期。Lucid管理层表示，在发布新的指引之前，公司将重点调整产能以匹配市场需求，提升运营效率。\n此举也反映出电动汽车行业面临的普遍挑战：库存水平走高、销售增速不及预期已迫使多家制造商重新评估生产计划。投资者反应谨慎，因为缺乏清晰的产量前景。","source":"tc","created_at":"2026-05-06T00:10:35.834327+00:00","original_url":"https://techcrunch.com/2026/05/05/lucid-motors-doesnt-know-how-many-evs-it-will-build-this-year/","categories":{"title":"tech","sort_order":0}},{"id":"a8abb8c3-84ce-48e6-8b97-d50ec117d4bc","title":"Altara secures $7M to bridge the data gap that&#8217;s slowing down physical sciences → 阿尔塔拉获得700万美元融资，用于填补当前拖慢物理科学发展进程的数据缺口。","title_en":"Altara secures $7M to bridge the data gap that&#8217;s slowing down physical sciences","title_zh":"阿尔塔拉获得700万美元融资，用于填补当前拖慢物理科学发展进程的数据缺口。","content_en":"Altara has secured $7 million in funding to address a significant data gap that has been impeding progress in the physical sciences. The startup is developing artificial intelligence technology specifically designed to help diagnose failures and accelerate research and development efforts by consolidating data that is currently fragmented across various spreadsheets and legacy systems. This data fragmentation represents a major bottleneck for scientific advancement, as researchers and engineers spend considerable time trying to access, reconcile, and make sense of information stored in disparate formats and platforms. By unifying these data silos, Altara's AI solution aims to provide a more cohesive and accessible view of scientific data, enabling faster identification of problems and more efficient development cycles. The funding round will support the company's efforts to expand its technology platform and grow its customer base within the physical sciences sector, where the need for","content_zh":"奥特拉已获得700万美元融资，用于填补长期阻碍物理科学发展的重大数据缺口。这家初创企业正在开发专门的人工智能技术，通过整合目前分散在各类电子表格和遗留系统中的数据，辅助故障诊断，加快研发工作进度。\n数据碎片化是科学进步的主要瓶颈，研究人员和工程师需要花费大量时间访问、比对校准、梳理存放在不同格式、不同平台上的信息，才能理清其含义。通过打通这些数据孤岛，奥特拉的人工智能解决方案旨在为科学数据提供更统一、更易获取的呈现视角，从而更快发现问题，提升开发周期效率。\n本轮融资将支持该公司拓展技术平台，扩大其在物理科学领域的客户群体，该领域对","source":"tc","created_at":"2026-05-06T00:08:28.203665+00:00","original_url":"https://techcrunch.com/2026/05/05/altara-secures-7m-to-bridge-the-data-gap-thats-slowing-down-physical-sciences/","categories":{"title":"tech","sort_order":0}},{"id":"13b35352-58b1-4c2b-9364-8217ffb193fe","title":"Bumble&#8217;s paying users are slipping as it bets on an overhaul later this year → Bumble的付费用户规模正持续下滑，该公司正将宝押在今年晚些时候的一次全面改版上。","title_en":"Bumble&#8217;s paying users are slipping as it bets on an overhaul later this year","title_zh":"Bumble的付费用户规模正持续下滑，该公司正将宝押在今年晚些时候的一次全面改版上。","content_en":"Bumble's Paying Users Are Slipping as It Bets on an Overhaul Later This Year\n\nBumble, the popular dating app known for its women-first messaging approach, is facing a significant challenge as its paying user base continues to decline. The company is making a bold bet that the traditional swiping model that has dominated the online dating industry for years is now outdated and no longer effectively serves users' needs.\n\nAccording to the report, Bumble has identified a critical problem: most matches made on the platform never actually turn into real-world dates. This disconnect between virtual connections and tangible relationships represents a fundamental flaw in the current dating app experience that the company is determined to address.\n\nTo tackle this issue, Bumble is planning a comprehensive overhaul of its platform later this year. The redesign will focus on three main areas: restructuring user profiles to better showcase authentic personalities, changing the way people interact","content_zh":"Bumble的付费用户正在流失，因为它押注于今年晚些时候进行彻底改革。Bumble是一款以女性优先消息功能著称的热门约会应用，其付费用户基础持续下降，正面临重大挑战。该公司大胆押注，认为多年来主导在线约会行业的传统滑动模式已经过时，无法有效满足用户需求。\n\n据报道，Bumble发现了一个关键问题：平台上大多数配对实际上从未变成现实中的约会。虚拟连接与实际关系之间的脱节代表了当前约会应用体验的一个根本缺陷，该公司决心要解决这一问题。\n\n为了解决这一问题，Bumble计划在今年晚些时候对其平台进行全面改革。重新设计将聚焦于三个主要领域：重组用户资料以更好地展示真实个性，改变人们互动的方式","source":"tc","created_at":"2026-05-06T00:06:50.518299+00:00","original_url":"https://techcrunch.com/2026/05/05/bumbles-paying-users-are-slipping-as-it-bets-on-an-overhaul-later-this-year/","categories":{"title":"tech","sort_order":0}},{"id":"e24b5378-8977-408a-a393-5792932dda66","title":"SAP bets $1.16B on 18-month-old German AI lab and says yes to NemoClaw → SAP押注11.6亿美元投资成立仅18个月的德国人工智能实验室，并对NemoClaw表示认可","title_en":"SAP bets $1.16B on 18-month-old German AI lab and says yes to NemoClaw","title_zh":"SAP押注11.6亿美元投资成立仅18个月的德国人工智能实验室，并对NemoClaw表示认可","content_en":"SAP, Europe’s largest enterprise‑software maker, announced plans to acquire German AI startup Prior Labs and invest roughly €1 billion (about $1.16 billion) over the next four years to build an AI lab focused on structured‑data models. Founded only 18 months ago by Frank Hutter, Noah Hollmann and Sauraj Gambhir, Prior Labs specializes in tabular foundation models (TFMs) that make predictions from databases and tables—exactly the kind of data that powers SAP’s accounting, HR, procurement and expense‑management products. While the purchase price was not disclosed, sources say it was an “almost all‑cash” deal with more than half a billion dollars paid upfront to the founders. The investment is part of SAP’s strategy to defend itself against the rise of agentic AI; the company has blocked unauthorized agents such as OpenClaw, but it is endorsing Nvidia’s enterprise‑focused OpenClaw competitor, NemoClaw, through its Joule Agents platform, which already supports Nvidia’s Agent Toolkit. SAP’s","content_zh":"欧洲最大的企业软件制造商思爱普（SAP）宣布计划收购德国人工智能初创公司Prior Labs，并将在未来四年投入约10亿欧元（约合11.6亿美元）打造一所专注于结构化数据模型的人工智能实验室。\nPrior Labs成立仅18个月，由弗兰克·胡特、诺亚·霍尔曼、苏拉吉·甘比尔联合创立，主打表格基础模型（TFM），这类模型可基于数据库和表格数据生成预测，而这类数据正是驱动思爱普旗下会计、人力资源、采购、费用管理等产品运行的核心数据。\n本次收购的交易价格未对外披露，但有知情人士表示这是一笔“几乎全现金”的交易，向创始人支付的预付款就超过5亿美元。\n这笔投资是思爱普抵御智能体AI崛起冲击的战略布局的一部分：该公司已封禁了OpenClaw等未获授权的智能体，但正通过旗下Joule Agents平台支持英伟达面向企业级市场推出的OpenClaw竞品NemoClaw，目前Joule Agents平台已适配英伟达的智能体工具包（Agent Toolkit）。","source":"tc","created_at":"2026-05-06T00:05:37.982284+00:00","original_url":"https://techcrunch.com/2026/05/05/sap-bets-1-16b-on-18-month-old-german-ai-lab-and-says-yes-to-nemoclaw/","categories":{"title":"tech","sort_order":0}},{"id":"eb6244c4-116c-41b7-a0fd-9f178821a809","title":".de TLD offline due to DNSSEC? → .de 顶级域名因 DNSSEC 问题而离线？","title_en":".de TLD offline due to DNSSEC?","title_zh":".de 顶级域名因 DNSSEC 问题而离线？","content_en":"DNSSEC Debugger Analysis for nic.de Domain\n\nThis report presents the results of a DNSSEC (Domain Name System Security Extensions) analysis conducted by Verisign Labs for the domain nic.de, performed on May 5, 2026, at 23:37:43 UTC. DNSSEC is a set of security protocols designed to protect DNS (Domain Name System) from spoofing and cache poisoning attacks by adding cryptographic authentication to DNS lookups.\n\nChain of Trust Validation\n\nThe analysis confirms that the chain of trust is properly established for nic.de. Two Delegation Signer (DS) records are present and successfully integrated into the validation chain: DS record 20326 using SHA-256 algorithm and DS record 38696 also using SHA-256 algorithm. Both records are now recognized as part of the trusted chain extending from the root zone to the nic.de domain, which is essential for proper DNSSEC validation.\n\nRoot Zone DNSKEY Query and Response\n\nA query was successfully sent to d.root-servers.net (IP address 199.7.91.13) re","content_zh":"# nic.de域名DNSSEC调试器分析\n本报告呈现威瑞信实验室于2026年5月5日协调世界时23:37:43对nic.de域名开展的DNSSEC（域名系统安全扩展）分析结果。DNSSEC是一套安全协议体系，通过为DNS（域名系统）查询添加密码学认证机制，保护DNS免受欺骗和缓存投毒攻击。\n\n## 信任链验证\n分析确认nic.de的信任链已正常搭建。该域名共存在2条委派签名者（DS）记录，且均已成功纳入验证链：编号20326的DS记录采用SHA-256算法，编号38696的DS记录同样采用SHA-256算法。目前两条记录均被认定为从根区延伸至nic.de域名的可信链的组成部分，这是DNSSEC正常完成验证的必要前提。\n\n## 根区DNSKEY查询与响应\n已成功向d.root-servers.net根服务器（IP地址199.7.91.13）发送查询，re","source":"hn","created_at":"2026-05-06T00:02:57.372705+00:00","original_url":"https://dnssec-analyzer.verisignlabs.com/nic.de","categories":{"title":"tech","sort_order":0}},{"id":"b27cd45a-8b7b-49be-bc45-4d9b38a64f28","title":"Cruise ship with hantavirus outbreak to sail to Canary Islands → 暴发汉坦病毒疫情的邮轮将驶往加那利群岛","title_en":"Cruise ship with hantavirus outbreak to sail to Canary Islands","title_zh":"暴发汉坦病毒疫情的邮轮将驶往加那利群岛","content_en":"A Dutch cruise ship called the MV Hondius, currently docked in Cape Verde, has experienced a hantavirus outbreak that has resulted in three passenger deaths during its Atlantic voyage that began in Argentina approximately a month ago. Spain's health ministry announced that the vessel will sail to the Canary Islands, with officials determining which passengers require urgent evacuation. The ship's doctor, who is in serious condition, and another crew member linked to a German national who died on May 2nd, are among those scheduled for medical evacuation via hospital aircraft to the Canary Islands. The World Health Organization explained that Cape Verde lacks the medical capabilities to perform these evacuations. As of the latest WHO update, seven cases of hantavirus have been identified—two confirmed and five suspected. The confirmed cases include a Dutch woman who was among the fatalities and a 69-year-old UK national evacuated to South Africa for treatment. While hantavirus is typical","content_zh":"名为“洪都斯号”的荷兰籍邮轮目前停靠在佛得角，该船约一个月前从阿根廷出发开启大西洋航程，途中暴发汉坦病毒疫情，已造成3名乘客死亡。西班牙卫生部通报，该邮轮将驶往加那利群岛，相关官员正在研判哪些乘客需要紧急撤离。病情严重的随船医生，以及与5月2日死亡的德国籍乘客相关的另一名船员，均在计划通过医疗专机撤往加那利群岛接受救治的人员之列。世界卫生组织解释称，佛得角不具备执行此类撤离任务的医疗能力。根据世卫组织最新更新的信息，目前已发现7例汉坦病毒感染病例，其中2例确诊、5例疑似。确诊病例包括已病亡的一名荷兰女性，以及被撤离至南非接受治疗的69岁英国公民。尽管汉坦病毒通常","source":"bbc","created_at":"2026-05-05T21:55:55.805221+00:00","original_url":"https://www.bbc.com/news/articles/ce8pypvjx1ko?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"92dc1e69-b4a1-4d7d-8890-18ffebcdf37c","title":"Apple agrees to pay iPhone owners $250 million for not delivering AI Siri → 苹果公司同意因未能提供AI Siri功能向iPhone用户支付2.5亿美元","title_en":"Apple agrees to pay iPhone owners $250 million for not delivering AI Siri","title_zh":"苹果公司同意因未能提供AI Siri功能向iPhone用户支付2.5亿美元","content_en":"Summary\n\nApple has agreed to a $250 million settlement in a class-action lawsuit filed by iPhone owners who claim the company failed to deliver promised AI-powered Siri features. The settlement is intended to provide compensation to customers who purchased iPhone 16 models and the iPhone 15 Pro, alleging that Apple marketed advanced artificial intelligence capabilities for its Siri digital assistant that were never delivered or significantly delayed. The proposed settlement will allow eligible iPhone owners to receive cash back as part of the resolution. This legal action highlights growing consumer protection concerns around marketing claims for AI features in consumer technology products, particularly in the highly competitive smartphone market where artificial intelligence capabilities have become a major selling point. The case demonstrates how technology companies face increasing scrutiny over unmet promises related to AI functionality in their devices.","content_zh":"概要\n针对iPhone用户提起的集体诉讼，苹果已同意支付2.5亿美元达成和解。发起诉讼的iPhone用户称，苹果未能兑现此前承诺的人工智能驱动Siri功能。\n用户方主张，苹果曾宣传其数字助理Siri具备先进人工智能能力，但相关功能始终未上线，或是交付时间严重滞后，本次和解旨在为购买了iPhone 16系列及iPhone 15 Pro的消费者提供赔偿。根据这份拟议和解方案，符合资格的iPhone用户将可获得现金返还，作为本次纠纷的处置内容之一。\n这起诉讼凸显出，消费科技产品AI功能的营销宣传引发的消费者权益保护关切正持续上升，在竞争极为激烈的智能手机市场尤为如此——当前人工智能能力已经成为智能手机的核心卖点。该案表明，科技企业若未能兑现旗下设备的AI功能相关承诺，正面临日益严格的审查。","source":"verge","created_at":"2026-05-05T21:39:48.063039+00:00","original_url":"https://www.theverge.com/tech/924706/apple-iphone-siri-intelligence-class-action-lawsuit-settlement","categories":{"title":"tech","sort_order":0}},{"id":"80dd771b-8a38-43f8-8f85-2edf4871cb0b","title":"As crypto cools, a16zcrypto raises a $2.2B fund → 随着加密货币市场降温，a16zcrypto募集到了22亿美元基金。","title_en":"As crypto cools, a16zcrypto raises a $2.2B fund","title_zh":"随着加密货币市场降温，a16zcrypto募集到了22亿美元基金。","content_en":"As the cryptocurrency market experiences a cooldown phase, Andreessen Horowitz's crypto-focused investment arm, known as a16zcrypto, has successfully closed a new fund totaling $2.2 billion. The substantial raise comes at a time when some of the largest venture capital firms specializing in cryptocurrency have begun diversifying their portfolios to include artificial intelligence startups, reflecting a broader shift in investor priorities within the technology sector. Despite the cooling crypto market and increased competition for capital from AI-focused investments, a16zcrypto has committed to maintaining its strategic focus on blockchain and cryptocurrency ventures, signaling confidence in the long-term potential of digital assets and decentralized technologies. The fund's significant size demonstrates continued institutional confidence in the crypto sector, even as market valuations have corrected and investor enthusiasm has moderated from the peaks seen in previous years. This posi","content_zh":"随着加密货币市场经历降温阶段，Andreessen Horowitz专注于加密货币的投资部门a16zcrypto已成功关闭一只规模达22亿美元的新基金。此次大规模融资正值一些最大的加密货币专业风险投资公司开始将投资组合多元化至人工智能初创企业之际，反映出科技行业内投资者优先顺序的更广泛转变。尽管加密货币市场降温，且来自人工智能领域投资的资本竞争加剧，a16zcrypto仍承诺维持其对区块链和加密货币风险投资的战略专注，释放出对数字资产和去中心化技术长期潜力的信心。尽管市场估值已修正，投资者热情也从往年峰值有所回落，但该基金可观的规模表明机构对加密货币领域的信心依然持续。","source":"tc","created_at":"2026-05-05T21:38:54.627821+00:00","original_url":"https://techcrunch.com/2026/05/05/as-crypto-cools-a16zcrypto-raises-a-2-2b-fund/","categories":{"title":"tech","sort_order":0}},{"id":"24899264-0f25-4bce-ab46-d44a0459c8da","title":"'Nothing will bring back my son': How 10 minutes of bombing by Israel shattered lives in Lebanon → \"什么都换不回我的儿子\"：以色列10分钟轰炸如何摧毁了黎巴嫩人的生活","title_en":"'Nothing will bring back my son': How 10 minutes of bombing by Israel shattered lives in Lebanon","title_zh":"\"什么都换不回我的儿子\"：以色列10分钟轰炸如何摧毁了黎巴嫩人的生活","content_en":"A 10-minute wave of Israeli air strikes across Lebanon on 8 April 2026 killed 361 people and injured more than 1,000, according to Lebanese authorities, marking the most destructive single day of the ongoing conflict. The strikes targeted approximately 100 locations across Lebanon in just 10 minutes, with stated aims of hitting Hezbollah command centres and military infrastructure. However, the attacks caused significant civilian casualties among ordinary Lebanese citizens. In Beirut's southern suburb of Hay el Sellom, one of the hardest-hit neighborhoods, residents described a landscape of collapsed buildings, twisted metal, and rubble where a vibrant community once stood. The BBC visited the area weeks after the attack and met Mohammed, whose son Abbas was killed when his building collapsed. Mohammed emphasized that he believed everyone who died were residents rather than militants, stating he would never have risked his son's life if he thought Hezbollah fighters were present. He no","content_zh":"据黎巴嫩当局称，2026年4月8日，以色列在黎巴嫩各地发动了一波持续10分钟的空袭，造成361人死亡、逾千人受伤，标志着这场持续冲突中破坏性最强的一天。此次空袭在仅仅10分钟内瞄准了黎巴嫩约100个地点，声称目标是打击真主党指挥中心和军事基础设施。然而，这次袭击造成了大量普通黎巴嫩平民伤亡。在贝鲁特南郊海塞尔洛姆区，这个受创最严重的社区之一，居民描述了一幅曾经充满活力的社区如今只剩倒塌建筑、扭曲钢筋和瓦砾的景象。BBC在袭击发生数周后走访了该地区，见到了穆罕默德，他的儿子阿巴斯在建筑倒塌时遇难。穆罕默德强调，他相信所有遇难者都是居民而非武装人员，并表示如果他知道真主党武装人员在场，他绝不会冒儿子性命的风险。他再也","source":"bbc","created_at":"2026-05-05T21:37:35.323103+00:00","original_url":"https://www.bbc.com/news/articles/c202652vvnjo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"7214ad0e-0396-4585-afbf-1f6bf9a35c2d","title":"RFK Jr. plans to curb antidepressants, which he falsely compares to heroin → 小罗伯特·F·肯尼迪计划限制抗抑郁药物的使用，他错误地将这类药物比作海洛因。","title_en":"RFK Jr. plans to curb antidepressants, which he falsely compares to heroin","title_zh":"小罗伯特·F·肯尼迪计划限制抗抑郁药物的使用，他错误地将这类药物比作海洛因。","content_en":"Summary\n\nUS Secretary of Health and Human Services Robert F. Kennedy Jr. has announced new federal initiatives aimed at reducing antidepressant prescriptions, appearing at a Make America Healthy Again Institute event where participants claimed, without evidence, that too many Americans—particularly young people—are being overprescribed selective serotonin reuptake inhibitors (SSRIs). These medications, which include common drugs like Zoloft, Prozac, Paxil, and Lexapro, are widely used to treat depression, anxiety, and post-traumatic stress disorder. Kennedy has long attacked antidepressants with false and dangerous claims, including assertions that they make people violent, contribute to mass shootings, and are harder to quit than heroin. Mental health experts have strongly criticized these statements, with addiction specialists emphasizing that antidepressants and opioids are in \"different universes\" regarding addiction risk. While discontinuing these medications should be done grad","content_zh":"### 摘要\n美国卫生与公众服务部长小罗伯特·F·肯尼迪公布了旨在减少抗抑郁药处方的联邦新举措，他是在“让美国再次健康”研究所的一场活动上宣布的该消息，活动参与者在毫无证据的情况下声称，有太多美国人，尤其是年轻人，被过量开具选择性5-羟色胺再摄取抑制剂（SSRI）。这类药物包括左洛复、百忧解、帕罗西汀、来士普等常见药品，被广泛用于治疗抑郁症、焦虑症和创伤后应激障碍。\n肯尼迪长期以来一直用虚假且危险的言论抨击抗抑郁药，包括声称这类药物会使人变得暴力、引发大规模枪击事件，且比海洛因更难戒断。心理健康专家对这些言论提出了强烈批评，成瘾专家强调，就成瘾风险而言，抗抑郁药和阿片类药物“完全不在一个层面”。停用此类药物应当逐步……","source":"ars","created_at":"2026-05-05T21:19:27.67589+00:00","original_url":"https://arstechnica.com/health/2026/05/rfk-jr-plans-to-curb-antidepressants-which-he-falsely-compares-to-heroin/","categories":{"title":"tech","sort_order":0}},{"id":"225876b5-c5d8-4ad8-bcfc-ea7ba14e996b","title":"Widely used Daemon Tools disk app backdoored in monthlong supply-chain attack → 广泛使用的 Daemon Tools 磁盘应用程序在长达一个月的供应链攻击中被植入后门","title_en":"Widely used Daemon Tools disk app backdoored in monthlong supply-chain attack","title_zh":"广泛使用的 Daemon Tools 磁盘应用程序在长达一个月的供应链攻击中被植入后门","content_en":"Summary:\n\nA significant supply-chain attack has been discovered involving Daemon Tools, a widely popular disk imaging and virtual drive application. The compromise went undetected for approximately one month, during which users who downloaded or updated the software from official or associated channels may have installed a backdoored version of the application. Supply-chain attacks are particularly dangerous because they compromise software at its source or distribution point, meaning the malicious code is delivered through legitimate update mechanisms that users would normally trust. This attack highlights the ongoing vulnerability of software development and distribution pipelines, where threat actors target the build process, update servers, or third-party components to inject malware before software reaches end users. The backdoor could potentially allow attackers to execute arbitrary code on affected systems, exfiltrate sensitive data, establish persistent remote access, or us","content_zh":"摘要：\n\n发现了一起涉及 Daemon Tools（一款广受欢迎的磁盘映像和虚拟驱动器应用程序）的重大供应链攻击。此次入侵在约一个月时间内未被发现，在此期间，从官方或关联渠道下载或更新该软件的用户可能已安装了带有后门的应用程序版本。供应链攻击尤为危险，因为它们在软件源头或分发点进行入侵，意味着恶意代码通过用户通常信任的合法更新机制传播。此次攻击凸显了软件开发与分发流程中持续存在的漏洞，威胁行为者针对构建过程、更新服务器或第三方组件注入恶意软件，在软件到达最终用户之前就已使其受到感染。该后门可能允许攻击者在受感染系统上执行任意代码、窃取敏感数据、建立持久远程访问，或进行其他恶意操作。","source":"ars","created_at":"2026-05-05T21:16:53.045472+00:00","original_url":"https://arstechnica.com/security/2026/05/widely-used-daemon-tools-disk-app-backdoored-in-monthlong-supply-chain-attack/","categories":{"title":"tech","sort_order":0}}];

      const items = [{ code: 'all', label: '全部' }, ...filtered.map(g => ({ code: g.title, label: g.title }))];
      return '<div class="lang-toggle">' +

        ).join('') +

      const fromEmbed = window.__POSTS_DATA__ ? window.__POSTS_DATA__.find(p => p.id === id) : null;
      if (fromEmbed) return fromEmbed;
      // Fallback to network
      const response = await fetch(
        SUPABASE_URL + '/rest/v1/blog_posts?id=eq.' + id + '&select=*,categories(id,title)',
        { headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY } }
      );
      if (!response.ok) throw new Error('Failed to fetch');
      const data = await response.json();
      return data[0] || null;

    function getPostUrl(post) {
      if (post.original_url) return post.original_url;
      if (post.content) {

        if (match) return match[0];

    async function renderPost(id) {
      app.innerHTML = '<div class="loading">Loading...</div>';
      try {

        if (!post) {
          app.innerHTML = '<div class="post-detail"><div class="back-link" onclick="goTo(\'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</div><div class="error-msg">Post not found</div></div>';
          return;
        }
        const displayTitle = getDisplayTitle(post);
        const displayContent = getDisplayContent(post);
        const postUrl = getPostUrl(post);
        app.innerHTML = '<div class="post-detail"><div class="back-link" onclick="goTo(\'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</div>' + langToggleHtml(contentLang, 'setContentLang') + '<article><header class="post-header">' + (post.categories ? '<div class="post-category">' + escapeHtml(post.categories.title) + '</div>' : '') + '<h1 class="post-title">' + displayTitle + '</h1><div class="post-meta"><span>' + formatDate(post.created_at) + '</span></div></header><div class="post-body">' + (displayContent ? displayContent.split('\n').map(p => '<p>' + escapeHtml(p) + '</p>').join('') : '<p>No content available.</p>') + '</div>' + (postUrl ? '<a href="' + postUrl + '" target="_blank" class="post-url"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>Read Original</a>' : '') + '</article></div>';
      } catch (err) {
        app.innerHTML = '<div class="post-detail"><div class="back-link" onclick="goTo(\'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</div><div class="error-msg">Unable to load post</div></div>';
        console.error(err);
      }
    }

    function renderPosts(isLoadingMoreFlag) {
      if (displayedPosts.length === 0) {
        app.innerHTML = '<div class="site-header"><div class="site-meta">潮汐 Tides</div><h1 class="site-title">潮汐 <span>·</span> Tides</h1><p class="site-tagline">Stories &amp; Ideas · 故事与思想</p></div><div class="controls"><div class="toggles-row">' + groupToggleHtml(groupFilter, categories) + langToggleHtml(titleLang, 'setTitleLang') + '</div><button class="theme-toggle" onclick="toggleTheme()">Light Mode</button></div><div style="text-align:center;padding:80px 0;color:var(--text-tertiary);font-family:var(--font-mono);font-size:11px;">No posts yet</div>';
        return;
      }
      app.innerHTML = '<div class="site-header"><div class="site-meta">潮汐 Tides</div><h1 class="site-title">潮汐 <span>·</span> Tides</h1><p class="site-tagline">Stories &amp; Ideas · 故事与思想</p></div><div class="controls"><div class="toggles-row">' + groupToggleHtml(groupFilter, categories) + langToggleHtml(titleLang, 'setTitleLang') + '</div><button class="theme-toggle" onclick="toggleTheme()">Light Mode</button></div><ul class="posts-list">' + displayedPosts.map((post, i) => '<li class="post-item" style="animation-delay:' + (i * 0.07) + 's"><div class="post-link" onclick="goTo(\'/post/' + post.id + '\')"><div class="post-item-title">' + getDisplayTitle(post) + '</div><div class="post-item-meta">' + (post.categories ? '<span>' + escapeHtml(post.categories.title) + '</span>' : '') + (post.source ? '<span>' + escapeHtml(post.source.toUpperCase()) + '</span>' : '') + '<span class="dot"></span><span>' + formatDate(post.created_at) + '</span></div>' + (post.content_zh || post.content_en ? '<div class="post-item-excerpt">' + escapeHtml(getDisplayExcerpt(post).substring(0, 350)) + '</div>' : '') + '</div></li>').join('') + '</ul>' + (hasMore ? '<button class="more-btn' + (isLoadingMoreFlag ? ' loading' : '') + '" onclick="loadMore()" ' + (isLoadingMoreFlag ? 'disabled' : '') + '>' + (isLoadingMoreFlag ? 'Loading' : 'More') + '</button>' : '') + '</div>';
    }

    async function loadMore() {
      if (isLoadingMore || !hasMore) return;
      isLoadingMore = true;
      renderPosts(true);
      try {
        const url = SUPABASE_URL + '/rest/v1/blog_posts?select=*,categories(title,sort_order)&order=created_at.desc&limit=30&offset=' + currentOffset;
        const response = await fetch(url, { headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY } });
        const newPosts = await response.json();
        displayedPosts = [...displayedPosts, ...newPosts];
        hasMore = newPosts.length === 30;
        currentOffset += 30;
      } catch (err) { console.error(err); }
      isLoadingMore = false;
      renderPosts(false);
    }

    window.goTo = goTo;
    window.setTitleLang = setTitleLang;
    window.setContentLang = setContentLang;
    window.setGroupFilter = setGroupFilter;
    window.toggleTheme = toggleTheme;
    window.loadMore = loadMore;

    async function handleRoute() {
      const postId = getPostIdFromHash();
      if (postId) {
        await renderPost(postId);
      } else {
        try {
          if (categories.length === 0) {
            categories = await fetchCategories();
          }
          // Use embedded data as first page
          if (window.__POSTS_DATA__ && window.__POSTS_DATA__.length > 0) {
            let filtered = window.__POSTS_DATA__;
            if (groupFilter !== 'all') {
              filtered = filtered.filter(p => p.categories && p.categories.title === groupFilter);
            }
            displayedPosts = filtered.slice(0, 30);
            hasMore = filtered.length > 30;
          } else {
            displayedPosts = [];
            hasMore = false;
          }
          currentOffset = 30;
          renderPosts();
        } catch (err) {
          app.innerHTML = '<div class="site-header"><div class="site-meta">潮汐 Tides</div><h1 class="site-title">潮汐 <span>·</span> Tides</h1><p class="site-tagline">Stories &amp; Ideas · 故事与思想</p></div><div class="controls">' + langToggleHtml(titleLang, 'setTitleLang') + '<button class="theme-toggle" onclick="toggleTheme()">Light Mode</button></div><div class="error-msg">Unable to load posts. Please refresh.</div>';
        }
      }
    }

    window.addEventListener('hashchange', handleRoute);
    handleRoute();
  </script>
</body>
</html>
