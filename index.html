  <style>

    .site-tagline { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.08em; }

    .more-btn.loading { color: var(--text-tertiary); border-color: var(--border); cursor: default; pointer-events: none; }

    footer { margin-top: 100px; padding-top: 32px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.05em; }

    window.__POSTS_DATA__ = [{"id":"edd389b0-4ea3-426c-8cc6-3092c8c30dec","title":"Can CCTV really stop children being abused in nurseries? → 监控真的能阻止幼儿园儿童遭受虐待吗？","title_en":"Can CCTV really stop children being abused in nurseries?","title_zh":"监控真的能阻止幼儿园儿童遭受虐待吗？","content_en":"Summary:\n\nThis BBC News article examines whether mandatory CCTV installation in nurseries across England could effectively protect children from abuse and neglect, prompted by several high-profile cases of child deaths and abuse in early years settings. The piece details the tragic cases of Genevieve, a nine-month-old who died in 2022 at a Stockport nursery after being strapped face down to a beanbag and left unsupervised for over 90 minutes, and Noah Sibanda, a 14-month-old who died at a Dudley nursery after being wrapped in blankets with a nursery worker's leg pressed across his back. Both nurseries had existing CCTV systems, which subsequently helped convict the perpetrators, yet could not prevent the deaths from occurring. The UK government is now consulting experts on whether CCTV should be mandatory in all nurseries, while Scotland, Wales, and Northern Ireland leave such decisions to individual providers. Australia is currently trialling cameras in 300 childcare centres. The","content_zh":"摘要：\n\n这篇BBC新闻报道探讨了英格兰是否应在所有幼儿园强制安装闭路电视，以有效保护儿童免受虐待和忽视。这一议题的提出源于早期教育机构中多起儿童死亡和虐待事件。报道详细叙述了两起悲剧案件：2022年，9个月大的 Genevieve 在斯托克波特一家幼儿园死亡，此前她被脸朝下绑在豆袋椅上，无人看管超过90分钟；以及14个月大的 Noah Sibanda 在达德利一家幼儿园死亡，原因是工作人员用毯子将其裹住，并将腿压在其背上。这两家幼儿园当时都已安装了闭路电视系统，这些录像后来帮助定罪了肇事者，但未能阻止死亡事件的发生。英国政府目前正在咨询专家意见，探讨是否应强制所有幼儿园安装闭路电视；苏格兰、威尔士和北爱尔兰则将此类决定权交给各机构自行决定。澳大利亚目前正在300家儿童保育中心试验安装摄像头。","source":"bbc","created_at":"2026-05-07T00:32:26.96006+00:00","original_url":"https://www.bbc.com/news/articles/czx2kn4n5wxo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"c6799577-8a5b-4883-8a11-dcb1f6cf519e","title":"Israel strikes Beirut for first time since Hezbollah ceasefire → 以色列首次在真主党停火后袭击贝鲁特","title_en":"Israel strikes Beirut for first time since Hezbollah ceasefire","title_zh":"以色列首次在真主党停火后袭击贝鲁特","content_en":"Summary of Israel Strikes Beirut Article\n\nIsrael has conducted an air strike on Beirut for the first time since agreeing to a ceasefire with the Lebanese armed group Hezbollah, putting renewed pressure on a fragile peace deal that has failed to halt ongoing hostilities between the two sides. The attack targeted the city's southern suburbs, known as Dahieh, which serves as a Hezbollah stronghold. Israeli Prime Minister Benjamin Netanyahu personally approved the strike, which specifically targeted a commander from Hezbollah's elite Radwan Force. Local media reported that members of the unit were holding a meeting when the strike occurred around 20:00 local time. This marks the first military action against Dahieh since US President Donald Trump announced a ceasefire agreement between Israel and Lebanon on April 16.\n\nDespite the ceasefire deal, both Israel and Hezbollah have continued their attacks, with each side accusing the other of violations. Israel's military strikes have predomin","content_zh":"以色列空袭贝鲁特文章摘要\n\n以色列对贝鲁特发动了空袭，这是自与黎巴嫩武装组织真主党达成停火协议以来的首次，此举给一项脆弱的和平协议带来新的压力，该协议未能阻止双方持续的敌对行动。袭击针对的是城市南部郊区达希耶，该地区是真主党的据点。以色列总理本杰明·内塔尼亚胡亲自批准了这次袭击，此次袭击专门针对真主党精锐拉德万部队的一名指挥官。当地媒体报道称，袭击发生在当地时间约20:00，该部队成员正在举行会议。这是自美国总统唐纳德·特朗普4月16日宣布以色列与黎巴嫩停火协议以来首次对达希耶采取军事行动。\n\n尽管有停火协议，以色列和真主党都继续发动攻击，双方互相指责对方违反协议。以色列的军事袭击主要","source":"bbc","created_at":"2026-05-07T00:31:22.234481+00:00","original_url":"https://www.bbc.com/news/articles/crmpjjl02l2o?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"bc1ac8bc-91f6-4e3f-a410-d26cc05c4d23","title":"BYD Dahong Information Update: Expected to Debut as Early as Within May with Prices Expected in June (21 hours ago) → 比亚迪大汉信息更新 预计最快5月内完成亮相并于6月份公布价格 21小时前","title_en":"BYD Dahong Information Update: Expected to Debut as Early as Within May with Prices Expected in June (21 hours ago)","title_zh":"比亚迪大汉信息更新 预计最快5月内完成亮相并于6月份公布价格 21小时前","content_en":"BYD Da Han Information Update: Anticipated Market Launch Timeline\n\nAccording to Autohome's news report published on May 6, 2026, BYD's upcoming \"Da Han\" vehicle has received updated information. The Chinese automaker is reportedly planning to unveil the model at the earliest by the end of May, with official pricing expected to be announced in June.\n\nThis timeline suggests that BYD is accelerating its product launch schedule for the Da Han, positioning it as a significant addition to their growing portfolio of new energy vehicles. The company's proactive approach in providing early information updates indicates strong confidence in the vehicle's development progress.\n\nThe Da Han appears to be another strategic model in BYD's diverse lineup, following the company's aggressive expansion strategy in both domestic and international markets. As of the article's publication date, the report had garnered approximately 42,000 views, reflecting substantial public interest in BYD's upcoming rel","content_zh":"比亚迪“大汉”车型信息更新：预计上市时间表\n\n根据汽车之家于2026年5月6日发布的新闻报道，比亚迪即将推出的“大汉”车型获得了最新信息更新。据报道，这家中国汽车制造商计划最早于5月底亮相该车型，并有望在6月公布正式售价。\n\n这一时间表表明，比亚迪正在加快“大汉”的产品上市计划，将其定位为比亚迪不断壮大的新能源汽车产品线中的重要补充。该公司主动提前发布信息更新的做法，显示出对其车辆开发进展的强烈信心。\n\n“大汉”似乎是比亚迪多元化产品阵容中的又一款战略车型，符合该公司在国内和国际市场积极扩张的战略。截至本文发布时，该报道已获得约42,000次浏览，反映出公众对比亚迪即将推出的新车型的浓厚兴趣。","source":"autohome","created_at":"2026-05-07T00:30:15.164393+00:00","original_url":"https://www.autohome.com.cn/news/202605/1314112.html","categories":{"title":"汽车","sort_order":2}},{"id":"95ef2edb-9ced-4e9d-a8ca-e04596d3fd84","title":"Spooked by Mythos, Trump suddenly realized AI safety testing might be good → 被Mythos惊到的特朗普突然意识到，AI安全测试或许是件好事。","title_en":"Spooked by Mythos, Trump suddenly realized AI safety testing might be good","title_zh":"被Mythos惊到的特朗普突然意识到，AI安全测试或许是件好事。","content_en":"The Trump administration has reversed its stance on AI safety testing, signing voluntary agreements with Google DeepMind, Microsoft, and xAI requiring government safety checks on frontier AI models before and after release. This marks a significant shift from Trump's earlier dismissal of Biden-era safety policies as overregulation, and his subsequent rebranding of the US AI Safety Institute to the Center for AI Safety Standards and Innovation (CAISI), which deliberately removed the word \"safety\" from its name. The reversal appears prompted by Anthropic's announcement that it would not release its Claude Mythos model due to concerns about its advanced cybersecurity capabilities being exploited by bad actors. According to reports, Trump may now issue an executive order mandating pre-release government testing of advanced AI systems. CAISI Director Chris Fall emphasized that \"independent, rigorous measurement science is essential to understanding frontier AI and its national security impl","content_zh":"特朗普政府已改变其在人工智能安全测试方面的立场，与谷歌DeepMind、微软和xAI签署自愿协议，要求前沿人工智能模型在发布前后都需接受政府安全检查。\n这标志着特朗普的态度发生了重大转变：此前他曾将拜登时期的安全政策斥为过度监管，随后还将美国人工智能安全研究所更名为人工智能安全标准与创新中心（CAISI），特意将“安全”一词从名称中删去。\n此次立场反转似乎是由Anthropic的公告引发的，该公司宣布因担心旗下Claude Mythos模型的先进网络安全能力会被不法分子利用，将不会发布该模型。\n据报道，特朗普现在可能会发布一项行政命令，强制要求先进人工智能系统在发布前接受政府测试。人工智能安全标准与创新中心主任克里斯·法尔强调：“独立、严谨的测量科学对于了解前沿人工智能及其国家安全影”","source":"ars","created_at":"2026-05-07T00:22:19.248675+00:00","original_url":"https://arstechnica.com/tech-policy/2026/05/everything-that-could-go-wrong-with-trumps-ai-safety-tests-according-to-experts/","categories":{"title":"tech","sort_order":0}},{"id":"dab4f42e-d26a-44b3-bed4-024d38d89dc3","title":"Court strikes down FCC anti-discrimination rule opposed by Internet providers → 法院推翻了美国联邦通信委员会（FCC）出台的、遭互联网运营商反对的反歧视规定。","title_en":"Court strikes down FCC anti-discrimination rule opposed by Internet providers","title_zh":"法院推翻了美国联邦通信委员会（FCC）出台的、遭互联网运营商反对的反歧视规定。","content_en":"Summary\n\nA federal court has struck down an anti-discrimination rule issued by the Federal Communications Commission (FCC) that had been strongly opposed by major internet service providers. The ruling represents a significant victory for the telecommunications industry, which had challenged the regulation on various legal grounds. The FCC's rule was designed to prevent internet providers from discriminating against certain types of internet traffic or charging different rates for different types of online services and content. Industry groups argued that the regulation overstepped the commission's authority and would stifle investment in network infrastructure. The court's decision effectively invalidates the FCC's effort to impose stricter oversight of how internet providers manage traffic on their networks. This ruling marks a reversal of the agency's attempt to apply common carrier principles to broadband services, similar to those traditionally applied to telephone networks. The","content_zh":"摘要\n\n一家联邦法院驳回了联邦通信委员会(FCC)发布的一项反歧视规则，该规则曾遭到主要互联网服务提供商的强烈反对。这一裁决代表了电信行业的重大胜利，该行业此前曾以各种法律理由对这一法规提出质疑。FCC的规则旨在防止互联网提供商歧视某些类型的互联网流量，或对不同类型的在线服务和内容收取不同费率。行业组织认为，该法规超越了委员会的权限，将抑制对网络基础设施的投资。法院的裁决实际上使FCC对互联网提供商管理其网络流量实施更严格监督的努力失效。这一裁决标志着该机构试图将运营商共乘原则应用于宽带服务的一次逆转，类似于传统上应用于电话网络的原则。","source":"ars","created_at":"2026-05-07T00:20:44.760056+00:00","original_url":"https://arstechnica.com/tech-policy/2026/05/court-strikes-down-fcc-anti-discrimination-rule-opposed-by-internet-providers/","categories":{"title":"tech","sort_order":0}},{"id":"831f1a0c-fe55-4cd3-b22c-eb9c91f1505a","title":"TSMC taps wind power as AI chip demand soars, Taiwan feels energy crunch → 台积电押注风力发电应对AI芯片需求飙升 台湾感受能源压力","title_en":"TSMC taps wind power as AI chip demand soars, Taiwan feels energy crunch","title_zh":"台积电押注风力发电应对AI芯片需求飙升 台湾感受能源压力","content_en":"Summary\n\nTSMC (Taiwan Semiconductor Manufacturing Company), the world's largest contract chipmaker, is increasingly turning to wind power to meet its massive energy demands as artificial intelligence chip demand continues to surge. The company, which produces chips for major tech firms like Apple, Nvidia, and AMD, faces significant energy challenges in Taiwan, where power grid constraints have become a growing concern.\n\nThe semiconductor manufacturing process is extremely energy-intensive, and TSMC's facilities consume substantial amounts of electricity. With the rapid expansion of AI technologies and the corresponding need for advanced chips, the company's power requirements have grown substantially, putting pressure on Taiwan's energy infrastructure.\n\nTaiwan has been working to diversify its energy sources beyond nuclear power, which has been a politically sensitive topic on the island. Wind power, particularly offshore wind farms, has emerged as a promising renewable energy source","content_zh":"摘要\n作为全球最大的芯片代工企业，台积电（台湾积体电路制造公司）在人工智能芯片需求持续飙升的背景下，正越来越多地转向风力发电，以满足自身庞大的能源需求。该公司为苹果、英伟达、超微半导体等头部科技企业供应芯片，目前在台湾面临严峻的能源挑战，当地的电网约束问题正引发越来越多的担忧。\n\n半导体制造过程能耗极高，台积电的生产设施耗电量巨大。随着人工智能技术快速扩张，以及随之而来的先进芯片需求增长，该公司的用电需求大幅提升，给台湾的能源基础设施造成了压力。\n\n台湾一直在推动能源来源多元化，降低对核电的依赖，核电在岛内始终是政治敏感议题。风力发电，尤其是海上风电场，已成为颇具发展前景的可再生能源。","source":"ars","created_at":"2026-05-07T00:19:25.313936+00:00","original_url":"https://arstechnica.com/gadgets/2026/05/tsmc-taps-wind-power-as-ai-chip-demand-soars-taiwan-feels-energy-crunch/","categories":{"title":"tech","sort_order":0}},{"id":"440c3d13-728f-4ede-8db9-2297817dee71","title":"Anthropic raises Claude Code usage limits, credits new deal with SpaceX → Anthropic提高Claude Code使用限额，称此举得益于其与太空探索技术公司（SpaceX）达成的新合作协议。\n\n注：因Anthropic暂无官方统一中文译名，业内通常直接保留原名使用，若需音译也可译为“安索匹克”。","title_en":"Anthropic raises Claude Code usage limits, credits new deal with SpaceX","title_zh":"Anthropic提高Claude Code使用限额，称此举得益于其与太空探索技术公司（SpaceX）达成的新合作协议。\n\n注：因Anthropic暂无官方统一中文译名，业内通常直接保留原名使用，若需音译也可译为“安索匹克”。","content_en":"Summary:\n\nAnthropic has announced increased usage limits for its Claude Code product, attributing this expansion to a newly established partnership with SpaceX. The announcement, made on May 6, 2026, signals a significant collaboration between the AI company and the space exploration firm. Claude Code is Anthropic's coding assistant tool that allows developers to leverage AI capabilities for software development tasks. The increased usage limits indicate that Anthropic is scaling up its infrastructure and capacity, likely to accommodate higher demand or specific requirements from its new SpaceX partnership. This deal represents one of several high-profile partnerships Anthropic has established with major technology companies, as the company continues to compete in the rapidly evolving AI assistant market. The collaboration with SpaceX suggests potential applications for AI-assisted coding in aerospace and satellite development, though specific details of how SpaceX plans to utilize","content_zh":"摘要：\nAnthropic宣布上调旗下Claude Code产品的使用限额，并称此次扩容是基于该公司与SpaceX最新建立的合作关系。这项公告于2026年5月6日发布，标志着这家人工智能企业与太空探索公司达成了重磅合作。Claude Code是Anthropic推出的代码助手工具，可让开发者借助人工智能能力完成各类软件开发任务。使用限额上调说明Anthropic正在扩容基础设施、提升服务承载能力，此举大概率是为了应对更高的用户需求，或是满足新合作伙伴SpaceX的特定要求。该交易是Anthropic与各大科技企业达成的多起高关注度合作之一，目前该公司正持续在快速迭代的AI助手市场中展开竞争。与SpaceX的合作意味着AI辅助编码有望在航空航天及卫星开发领域得到应用，不过SpaceX计划如何应用该工具的具体细节尚未公开。","source":"ars","created_at":"2026-05-07T00:17:14.444037+00:00","original_url":"https://arstechnica.com/ai/2026/05/anthropic-raises-claude-code-usage-limits-credits-new-deal-with-spacex/","categories":{"title":"tech","sort_order":0}},{"id":"8df867d5-fbf3-4412-9633-ba6306302c32","title":"SpaceX is starting to move on from the world's most successful rocket → SpaceX（太空探索技术公司）正开始逐步告别这款全球最成功的运载火箭。","title_en":"SpaceX is starting to move on from the world's most successful rocket","title_zh":"SpaceX（太空探索技术公司）正开始逐步告别这款全球最成功的运载火箭。","content_en":"SpaceX is beginning to shift its focus away from the Falcon 9, the workhorse rocket that has become the world’s most successful launch vehicle, as the company moves to capitalize on the capabilities of its next‑generation Starship. Over the past decade Falcon 9 has logged hundreds of missions, reliably delivering satellites, cargo and crew to orbit while pioneering first‑stage reusability that dramatically cut launch costs. Now, after achieving a high flight rate and accumulating a wealth of reuse data, SpaceX is redirecting engineering resources, production capacity and launch‑pad scheduling toward Starship, a fully reusable super‑heavy‑lift vehicle designed to serve both cis‑lunar and interplanetary missions. The transition reflects a strategic decision to move beyond the incremental improvements of Falcon 9 and to embrace a vehicle that can haul larger payloads at lower per‑kilogram cost and enable ambitious projects such as a commercial space station, lunar landing services for NAS","content_zh":"SpaceX开始将重点从猎鹰9号转移开来——这款主力火箭已成为全球最成功的运载火箭——该公司正着手利用其下一代星舰的能力。过去十年间，猎鹰9号已完成数百次任务，可靠地将卫星、货物和人员送入轨道，同时开创了第一级可回收技术，大幅降低了发射成本。如今，在实现高飞行频率并积累了大量回收数据后，SpaceX正将工程资源、生产能力和发射台排期转向星舰——一款完全可重复使用的超重型运载火箭，旨在执行地月空间及星际任务。此次转型反映了一个战略决策，即超越猎鹰9号的渐进式改进，拥抱一款能够以更低每公斤成本运输更大有效载荷的运载火箭，并使商业空间站、为NASA提供登月服务等雄心勃勃的项目成为可能。","source":"ars","created_at":"2026-05-07T00:14:52.905414+00:00","original_url":"https://arstechnica.com/space/2026/05/spacex-is-starting-to-move-on-from-the-worlds-most-successful-rocket/","categories":{"title":"tech","sort_order":0}},{"id":"8331985d-c99d-487b-bf98-c2ea97f33951","title":"Insurance startup Corgi hits $1.3B valuation 4 months after its Series A → 保险初创公司Corgi在完成A轮融资仅4个月后估值便达到13亿美元。","title_en":"Insurance startup Corgi hits $1.3B valuation 4 months after its Series A","title_zh":"保险初创公司Corgi在完成A轮融资仅4个月后估值便达到13亿美元。","content_en":"Summary: Insurance Startup Corgi Achieves $1.3 Billion Valuation Just Four Months After Series A\n\nCorgi, an insurance technology startup focused on business insurance solutions, has secured a significant funding milestone by raising a $160 million Series B round led by venture capital firm TCV. This latest investment has propelled the company's valuation to an impressive $1.3 billion, marking a remarkable growth trajectory that saw the startup achieve unicorn status just four months after completing its Series A funding round.\n\nThe company's rapid ascent in valuation reflects the strong investor confidence in Corgi's approach to modernizing the business insurance industry. Founded by co NicoLaqu (name appears truncated in source), Corgi has positioned itself as an innovative player in the InsurTech space, offering digital-first solutions that streamline the process of obtaining and managing commercial insurance policies for small and medium-sized businesses.\n\nThe substantial Series B","content_zh":"摘要：保险初创企业Corgi A轮融资仅四个月估值便达13亿美元\n专注于商业保险解决方案的保险科技初创企业Corgi完成了由风险投资公司TCV领投的1.6亿美元B轮融资，达成了重要融资里程碑。这笔最新投资将公司估值推高至亮眼的13亿美元，凸显出其出众的增长态势，这家初创企业在完成A轮融资仅四个月后就跻身独角兽行列。\nCorgi估值的快速攀升，反映出投资者对其推动商业保险行业现代化的发展路径的高度信心。Corgi由联合创始人NicoLaqu（来源资料中该姓名有所截断）创立，是保险科技领域的创新参与者，主打数字化优先的解决方案，可简化中小企业获取和管理商业保险保单的流程。\n此次大额B轮","source":"tc","created_at":"2026-05-07T00:13:00.596246+00:00","original_url":"https://techcrunch.com/2026/05/06/insurance-startup-corgi-hits-1-3b-valuation-4-months-after-its-series-a/","categories":{"title":"tech","sort_order":0}},{"id":"7cda82ad-40c0-47ef-8aa1-098c5e22a034","title":"Is xAI a neocloud now? → xAI现在是一家新云公司了吗？","title_en":"Is xAI a neocloud now?","title_zh":"xAI现在是一家新云公司了吗？","content_en":"Summary: Is xAI a Neocloud Now?\n\nIn May 2026, xAI and Anthropic announced a surprise partnership in which Anthropic purchased all the compute capacity at xAI's Colossus 1 data center, approximately 300 megawatts. This deal allowed Anthropic to immediately raise its usage limits and represents a massive financial win for xAI, likely worth billions of dollars. The partnership essentially transforms xAI from a consumer of compute into a provider, monetizing one of the company's most impressive achievements.\n\nWhile some observers might interpret this move as a strategic shot at OpenAI amid ongoing litigation, Elon Musk clarified on X that xAI had already transitioned training operations to its newer Colossus 2 facility and simply did not need both data centers running at full capacity.\n\nThe short-term logic is evident: xAI's flagship product Grok has experienced plummeting user engagement since image generation controversies earlier in the year. By partnering with Anthropic, xAI generate","content_zh":"摘要：xAI如今已是新型云服务商了吗？\n2026年5月，xAI与Anthropic官宣了一项出人意料的合作：Anthropic买断了xAI旗下巨像1号数据中心的全部算力，规模约300兆瓦。这笔交易让Anthropic能够即刻上调其服务使用上限，同时也为xAI带来了预计数十亿美元的巨额收入，是一场重大的财务胜利。此次合作本质上让xAI从算力消耗方转型为算力供给方，将该公司最引以为傲的成果之一成功变现。\n虽然部分观察人士可能会将这一举措解读为xAI在与OpenAI的 ongoing 诉讼纠纷中对后者打出的战略重拳，但埃隆·马斯克在X平台上澄清称，xAI早已将模型训练业务迁移到更新的巨像2号数据中心，根本不需要两个数据中心同时满负荷运转。\n这一举措的短期逻辑十分明确：今年早些时候的图片生成争议事件过后，xAI的旗舰产品Grok的用户活跃度大幅跳水。通过与Anthropic合作，xAI可","source":"tc","created_at":"2026-05-07T00:11:37.838581+00:00","original_url":"https://techcrunch.com/2026/05/06/is-xai-a-neocloud-now/","categories":{"title":"tech","sort_order":0}},{"id":"be667557-44cf-40db-bf70-d80da08fb95b","title":"Snap says its $400M deal with Perplexity &#8216;amicably ended&#8217; → Snap表示，其与Perplexity价值4亿美元的交易已“友好终止”。","title_en":"Snap says its $400M deal with Perplexity &#8216;amicably ended&#8217;","title_zh":"Snap表示，其与Perplexity价值4亿美元的交易已“友好终止”。","content_en":"Snap has confirmed that its $400 million partnership with AI search startup Perplexity has ended. The deal, which was announced last November, would have seen Perplexity's AI-powered search engine integrated directly into the Snapchat platform. According to statements from Snap, the termination of the agreement was mutual and amicable, concluding without any public disputes or disclosed reasons for the split. This marks a significant shift in Snap's AI strategy, as the company had previously positioned the Perplexity integration as a key feature for enhancing user engagement within its camera and messaging ecosystem. The cancellation leaves Perplexity to continue seeking distribution partnerships elsewhere, while Snap will need to reassess its approach to incorporating advanced AI search capabilities into its services.","content_zh":"Snap公司已证实，其与AI搜索初创企业Perplexity价值4亿美元的合作已终止。该交易于去年11月官宣，原本计划将Perplexity旗下的AI搜索引擎直接集成到Snapchat平台中。据Snap方面的声明，本次协议终止是双方共同做出的友好决定，全程未出现公开纠纷，也未披露双方拆分的原因。这一变动标志着Snap的AI战略出现重大转向，此前该公司曾将集成Perplexity服务定位为提升旗下相机、消息生态用户参与度的核心功能。本次合作取消后，Perplexity将继续在其他渠道寻求分发合作，而Snap则需要重新评估如何将先进AI搜索能力整合到自身服务当中。","source":"tc","created_at":"2026-05-07T00:09:33.137579+00:00","original_url":"https://techcrunch.com/2026/05/06/snap-says-its-400m-deal-with-perplexity-amicably-ended/","categories":{"title":"tech","sort_order":0}},{"id":"3d91c495-4483-40f7-9606-129212742dac","title":"Barry Diller trusts Sam Altman. But &#8216;trust is irrelevant&#8217; as AGI nears, he says. → 巴里·迪勒信任萨姆·阿尔特曼。但他表示，随着AGI临近，\"信任无关紧要\"。","title_en":"Barry Diller trusts Sam Altman. But &#8216;trust is irrelevant&#8217; as AGI nears, he says.","title_zh":"巴里·迪勒信任萨姆·阿尔特曼。但他表示，随着AGI临近，\"信任无关紧要\"。","content_en":"Barry Diller, the veteran media executive, publicly defended OpenAI CEO Sam Altman, saying he trusts him personally, but warned that as artificial general intelligence (AGI) approaches, trust alone is insufficient and essentially irrelevant to mitigating its risks. Speaking at the WSJ’s Future of Everything event, Diller argued that AGI is an unpredictable force that demands robust guardrails and governance mechanisms rather than reliance on individual trustworthiness. While he expressed confidence in Altman’s leadership, he stressed that the development of AGI is a broader societal challenge requiring institutional safeguards, oversight, and careful regulation to prevent unintended consequences. Diller’s remarks highlight the growing tension between rapid AI advancement and the need for responsible stewardship, underscoring that personal trust in a few leaders cannot be the sole defense against the systemic impacts of AGI.","content_zh":"巴里·迪勒，这位资深媒体高管，公开为OpenAI CEO萨姆·阿尔特曼辩护，称他个人信任阿尔特曼，但警告称，随着通用人工智能（AGI）的临近，仅靠信任是不够的，而且对于降低其风险来说几乎毫无意义。在《华尔街日报》的\"一切未来\"活动上，迪勒认为，AGI是一股不可预测的力量，需要强有力的护栏和治理机制，而不是依赖个人可信度。虽然他对阿尔特曼的领导力表示了信心，但他强调，AGI的发展是一个更广泛的社会挑战，需要制度性的保障措施、监督和谨慎的监管来防止意外后果。迪勒的言论突出了快速AI发展与需要负责任管理之间日益紧张的矛盾，强调仅靠对少数几位领导人的个人信任不能成为防御AGI系统性影响的唯一手段。","source":"tc","created_at":"2026-05-07T00:08:13.321313+00:00","original_url":"https://techcrunch.com/2026/05/06/barry-diller-trusts-sam-altman-but-trust-is-irrelevant-as-agi-nears-he-says/","categories":{"title":"tech","sort_order":0}},{"id":"56b8a22b-8b99-4947-bcd0-e0d42263e69c","title":"A 20-minute pitch wins Indian startup Pronto backing from Lachy Groom → 一场20分钟的路演为印度初创企业Pronto赢得了拉奇·格鲁姆的投资支持。","title_en":"A 20-minute pitch wins Indian startup Pronto backing from Lachy Groom","title_zh":"一场20分钟的路演为印度初创企业Pronto赢得了拉奇·格鲁姆的投资支持。","content_en":"The Indian startup Pronto has secured investment from renowned venture capitalist Lachy Groom after a concise 20-minute pitch, according to a TechCrunch report published on May 6, 2026. The rapid success of the pitch highlights the growing confidence in Pronto's business model and its potential within a rapidly expanding market. The investment comes at a time when Pronto is experiencing significant traction, scaling to 26,000 daily bookings. Industry analysts suggest the market Pronto operates in could reach a size of $18 billion. This backing from Groom, a well-known figure in the tech investment community, is expected to propel Pronto's growth trajectory and solidify its position in the competitive landscape.","content_zh":"据2026年5月6日TechCrunch发布的报道，印度初创企业Pronto在仅为时20分钟的简短推介后，便获得了知名风险投资人拉奇·格鲁姆的投资。本次推介的快速成功，凸显出市场对Pronto的商业模式及其在高速扩张赛道中的潜力信心持续提升。\n该笔投资落地之际，Pronto正处于业务强劲增长阶段，日预订量已攀升至2.6万单。行业分析师预计，Pronto所处的市场规模可达180亿美元。作为科技投资界的知名人物，格鲁姆的此次注资预计将推动Pronto的增长步伐，巩固其在竞争激烈的行业格局中的地位。","source":"tc","created_at":"2026-05-07T00:06:24.721282+00:00","original_url":"https://techcrunch.com/2026/05/06/a-20-minute-pitch-wins-indian-startup-pronto-backing-from-lachy-groom/","categories":{"title":"tech","sort_order":0}},{"id":"91fc394b-b0fa-46e1-ab2a-96335a835db2","title":"Vibe coding and agentic engineering are getting closer than I'd like → Vibe coding和agentic工程正变得比我预想的更加趋同。","title_en":"Vibe coding and agentic engineering are getting closer than I'd like","title_zh":"Vibe coding和agentic工程正变得比我预想的更加趋同。","content_en":"Summary\n\nIn this May 2026 blog post, Simon Willison discusses his recent appearance on Heavybit's High Leverage podcast with Joseph Ruscio, where he explored AI coding tools and arrived at what he describes as a \"disturbing realization.\" The piece reflects on how two distinct approaches to AI-assisted programming—\"vibe coding\" and \"agentic engineering\"—have begun to overlap in his own practice.\n\nWillison had previously defined vibe coding as a hands-off approach where programmers (or even non-programmers) use AI tools without examining the generated code, simply iterating based on whether the output works. He argued this approach is acceptable for personal tools but \"grossly irresponsible\" when building software for others, since bugs can harm users.\n\nAgentic engineering, by contrast, involves professional software engineers leveraging AI tools while drawing on extensive experience in security, maintainability, operations, and performance. The goal is to build higher-quality software","content_zh":"摘要\n\n在这篇2026年5月的博客文章中，Simon Willison讨论了他最近在Heavybit的High Leverage播客上与Joseph Ruscio的对话，节目中他探讨了AI编程工具，并得出了他所说的“令人不安的认知”。文章反思了他自己的实践中，AI辅助编程的两种不同方式——“氛围编程”和“智能体工程”——如何开始重叠。\n\nWillison之前将氛围编程定义为一种放手不管的方式，程序员（甚至非程序员）使用AI工具时不检查生成的代码，仅根据输出是否有效进行迭代。他认为这种方式用于个人工具是可以接受的，但在为他人构建软件时是“极其不负责任的”，因为bug可能会伤害用户。\n\n相比之下，智能体工程涉及专业软件工程师利用AI工具，同时运用他们在安全、可维护性、运维和性能方面的丰富经验。目标是构建更高质量的软件。","source":"hn","created_at":"2026-05-07T00:04:37.663306+00:00","original_url":"https://simonwillison.net/2026/May/6/vibe-coding-and-agentic-engineering/","categories":{"title":"tech","sort_order":0}},{"id":"b8677753-4288-40c1-8538-587a5e3b7d9a","title":"Higher usage limits for Claude and a compute deal with SpaceX → 克劳德（Claude）更高的使用限额，以及与太空探索技术公司（SpaceX）的算力合作协议","title_en":"Higher usage limits for Claude and a compute deal with SpaceX","title_zh":"克劳德（Claude）更高的使用限额，以及与太空探索技术公司（SpaceX）的算力合作协议","content_en":"Anthropic has announced a significant partnership with SpaceX that will substantially increase their compute capacity, enabling the company to raise usage limits for Claude Code and the Claude API effective immediately. The improvements include doubling Claude Code's five-hour rate limits for Pro, Max, Team, and seat-based Enterprise plans, removing the peak hours limit reduction for Pro and Max accounts, and considerably raising API rate limits for Claude Opus models. The SpaceX agreement gives Anthropic access to all compute capacity at the Colossus 1 data center, providing more than 300 megawatts of new capacity with over 220,000 NVIDIA GPUs available within the month. This new capacity will directly benefit Claude Pro and Max subscribers. This partnership joins Anthropic's other major compute deals, including an up to 5 gigawatt agreement with Amazon that includes nearly 1 gigawatt of new capacity by the end of 2026, a 5 gigawatt agreement with Google and Broadcom coming online in","content_zh":"Anthropic宣布与SpaceX达成重磅合作，将大幅提升自身算力，即刻起上调Claude Code与Claude API的使用限额。\n本次升级内容包括：Pro、Max、团队版及按席位计费的企业版方案的Claude Code五小时速率限制翻倍，取消Pro与Max账户的高峰时段限额下调规则，同时大幅提高Claude Opus模型的API速率限制。\n按照与SpaceX的协议，Anthropic可使用巨像1号（Colossus 1）数据中心的全部算力，一个月内即可新增超300兆瓦算力，配套超过22万张英伟达GPU。这些新增算力将直接惠及Claude Pro和Max订阅用户。\n除本次合作外，Anthropic还手握其他多项大型算力合作协议，包括与亚马逊达成的最高5吉瓦的合作（其中近1吉瓦的新增算力将于2026年底前落地），以及与谷歌、博通签订的5吉瓦算力协议正逐步上线。","source":"hn","created_at":"2026-05-07T00:01:59.004846+00:00","original_url":"https://www.anthropic.com/news/higher-limits-spacex","categories":{"title":"tech","sort_order":0}},{"id":"7e8c63a6-ce3b-451f-98e2-72a816fd9092","title":"Google shuts down Project Mariner → 谷歌关闭“水手计划”","title_en":"Google shuts down Project Mariner","title_zh":"谷歌关闭“水手计划”","content_en":"Google has officially shut down Project Mariner, the company's experimental AI-powered web browsing agent that was designed to autonomously navigate websites and complete tasks on behalf of users. According to the report published by The Verge on May 6, 2026, the Project Mariner experiment, which originated from Google's research initiatives, will not continue as a standalone project. However, the technology and capabilities developed through Project Mariner have been integrated into Google's existing AI products. Specifically, the functionality and features pioneered in Project Mariner will continue to exist within Gemini Agent and AI Mode, which are components of Google's Gemini artificial intelligence platform. This integration represents Google's strategy to consolidate its experimental AI research into more mature, commercially available products. The shutdown marks the end of Project Mariner as an independent initiative while ensuring that the research and development work behind","content_zh":"谷歌已正式关停“水手项目”（Project Mariner），这是该公司旗下实验性AI驱动网页浏览代理，设计初衷是自主浏览网站，代用户完成各项任务。据科技媒体The Verge2026年5月6日发布的报道，源自谷歌研究项目的水手项目实验将不再作为独立项目推进。不过水手项目期间开发的技术与能力已被整合进谷歌现有AI产品中，具体而言，该项目首创的功能特性将继续留存于谷歌Gemini人工智能平台的两大组件——Gemini代理（Gemini Agent）和AI模式（AI Mode）当中。此次整合体现了谷歌将实验性AI研究并入更成熟商用产品的战略，本次关停标志着水手项目作为独立项目的终结，同时也保障了其背后的研发工作\n（注：原文此处内容不完整）","source":"verge","created_at":"2026-05-06T21:26:31.022107+00:00","original_url":"https://www.theverge.com/tech/925559/google-project-mariner-shut-down","categories":{"title":"tech","sort_order":0}},{"id":"db7fb4dd-1e72-4eea-9480-cd22ee91f772","title":"Two Britons self-isolating in UK after leaving hantavirus cruise ship early → 两名英国人提前离开涉汉坦病毒游轮后，正在英国进行自我隔离。","title_en":"Two Britons self-isolating in UK after leaving hantavirus cruise ship early","title_zh":"两名英国人提前离开涉汉坦病毒游轮后，正在英国进行自我隔离。","content_en":"Two British nationals who left the MV Hondius cruise ship early are now self‑isolating at home in the United Kingdom after potential exposure to a hantavirus outbreak, the UK Health Security Agency (UKHSA) has reported. The pair disembarked at St Helena on 22–24 April, flew back to the UK via Johannesburg, and contacted health authorities after learning of cases aboard the vessel. They are not showing symptoms, but tracing of their contacts on the return journey is under way, and the agency stresses the risk to the general public remains very low. The cruise ship, which departed Argentina a month ago, has recorded three deaths linked to the virus; Spanish authorities have granted permission for it to dock in the Canary Islands despite local concerns. About 150 people remain on board under strict precautionary measures, including 19 passengers and four crew members who are British. One of the evacuees, a 56‑year‑old British man, is in a stable condition after being taken off the ship on","content_zh":"两名提前离开“汉迪乌斯”号邮轮的英国公民，据英国卫生安全局报告，目前正在英国家中进行自我隔离，此前他们可能接触到汉坦病毒疫情。这两人于4月22日至24日在圣赫勒拿岛下船，经约翰内斯堡飞回英国，在得知船上的病例后联系了卫生部门。他们目前没有出现症状，但回程途中接触者的追踪正在进行，该机构强调对公众的风险仍然很低。这艘一个月前从阿根廷出发的邮轮已记录了3例与该病毒相关的死亡；尽管当地担忧，西班牙当局已允许其在加那利群岛停靠。约150人仍在船上接受严格预防措施，其中包括19名乘客和4名船员是英国公民。其中一名被撤离者，一名56岁的英国男子，在被从船上转移后目前情况稳定。","source":"bbc","created_at":"2026-05-06T21:18:49.821646+00:00","original_url":"https://www.bbc.com/news/articles/c9wepl8we90o?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"828fde07-7ede-4bcf-a1c6-0e2f2eb7e85a","title":"How David Sacks crashed and burned in the White House → 戴维·萨克斯是如何在白宫遭遇惨败的","title_en":"How David Sacks crashed and burned in the White House","title_zh":"戴维·萨克斯是如何在白宫遭遇惨败的","content_en":"Summary\n\nDavid Sacks, a prominent tech entrepreneur and venture capitalist who served in an advisory role within the Trump administration, experienced a significant political setback when the administration dramatically reversed its stance on artificial intelligence oversight. According to The Verge's analysis, Sacks, who had built his reputation partly on advocating for minimal government intervention in the technology sector, found himself facing what he apparently considered his worst nightmare: an expansion of regulatory oversight on AI systems. The administration \"pulled a 180\" on its approach to AI governance, a reversal that effectively undermined Sacks' strategic position and publicly contradicted the deregulatory philosophy he had championed throughout his career. This turn of events, as the article's title suggests, proved detrimental to Sacks' influence within the White House, demonstrating the precarious nature of tech-industry representatives navigating political enviro","content_zh":"概要\n知名科技企业家、风险投资人大卫·萨克斯曾在特朗普政府中担任顾问职务，当政府大幅反转人工智能监管立场时，他遭遇了重大政治挫折。根据《The Verge》的分析，萨克斯的部分声誉建立在主张政府尽量少干预科技行业之上，此番他发现自己正面临着显然被他视作头号噩梦的局面：针对AI系统的监管范围扩大。本届政府在AI治理方式上“来了个180度大转弯”，这一反转实质上动摇了萨克斯的战略地位，也公开违背了他整个职业生涯始终倡导的去监管理念。正如该文标题所指出的，这一事态转变对萨克斯在白宫内的影响力造成了不利影响，也凸显出科技行业代表在政治环境中周旋时处境的脆弱性。","source":"verge","created_at":"2026-05-06T21:16:21.948424+00:00","original_url":"https://www.theverge.com/column/925487/david-sacks-trump-administration-ai-model-review","categories":{"title":"tech","sort_order":0}},{"id":"72a1f1d9-57a7-4fde-8b23-931fde7576a3","title":"Knitting bullshit → 胡编乱造","title_en":"Knitting bullshit","title_zh":"胡编乱造","content_en":"Summary\n\nIn this thought-provoking post from April 2026, Kate Davies Designs explores the concept of \"Knitting Bullshit\" by first establishing a philosophical framework based on Princeton philosopher Harry Frankfurt's seminal essay \"On Bullshit\" (1986; 2005). She clarifies that bullshit differs fundamentally from a lie—a liar maintains an underlying respect for truth by deliberately distorting it, whereas bullshit represents discourse from which truth and reality have been completely hollowed out and replaced by pure performance and simulation. Frankfurt notably characterized contemporary political discourse as \"farcically unalloyed bullshit.\" The author then narrows her focus to knitting-specific applications, drawing from Jamie Bartlett's podcast series \"Everything is Fake and Nobody Cares.\" The first episode features Anne McHealy, head of product at Inception Point AI, a podcasting company founded by Jeanine Wright, formerly COO at Wondery. McHealy reveals that Inception Point AI","content_zh":"### 摘要\n在这篇2026年4月发布的发人深省的帖子中，凯特·戴维斯设计工作室围绕“编织扯淡”这一概念展开探讨，首先以普林斯顿哲学家哈里·法兰克福1986年发表、2005年再版的开创性论文《论扯淡》为基础搭建了哲学框架。她阐明，扯淡和谎言存在本质区别：说谎者刻意扭曲事实，本质上仍然对真理抱有尊重，而扯淡的表述则完全掏空了真相与现实的内核，只剩下纯粹的表演和伪装。法兰克福曾有一个著名论断，将当代政治话语形容为“滑稽可笑的纯扯淡”。随后作者把讨论范围收窄到编织领域的具体应用，参考了杰米·巴特利特的播客系列《一切皆假，无人在意》。该系列第一期的嘉宾是Inception Point AI的产品主管安妮·麦克希利，这家播客公司由曾担任Wondery首席运营官的珍妮·赖特创立。麦克希利透露，Inception Point AI","source":"hn","created_at":"2026-05-06T21:14:35.686795+00:00","original_url":"https://katedaviesdesigns.com/2026/04/29/knitting-bullshit/","categories":{"title":"tech","sort_order":0}},{"id":"34ae79fd-d4cd-4f1d-b882-0c9e3f613a22","title":"Mira Murati tells the court that she couldn’t trust Sam Altman’s words → 米拉·穆拉蒂向法庭表示，她无法信任萨姆·奥尔特曼的话。","title_en":"Mira Murati tells the court that she couldn’t trust Sam Altman’s words","title_zh":"米拉·穆拉蒂向法庭表示，她无法信任萨姆·奥尔特曼的话。","content_en":"Summary\n\nAccording to this article from The Verge, Mira Murati, who previously served as CEO of OpenAI, provided testimony under oath during the ongoing court battle between Elon Musk and Sam Altman regarding the future of the AI company. In her testimony, Murati stated that she could not trust Altman's words, indicating that she believed he had lied to her. This court case appears to be a significant legal proceeding that has drawn attention to internal dynamics and communications within OpenAI's leadership. The live updates feature from The Verge is tracking this high-profile dispute as it unfolds, with the publication date of May 6, 2026, suggesting this is a recent development in the ongoing controversy surrounding the AI organization. The testimony from Murati, who briefly served as interim CEO after Altman's initial dismissal from the company in 2023, could potentially be damaging to Altman as the legal proceedings continue.","content_zh":"摘要\n\n根据特网（The Verge）的这篇报道，前OpenAI临时CEO米拉·穆拉蒂在埃隆·马斯克与萨姆·奥尔特曼之间关于这家AI公司未来的持续法律诉讼中提供了宣誓证词。在证词中，穆拉蒂表示她无法信任奥尔特曼的话，暗示她认为奥尔特曼对她撒了谎。这起案件似乎是一场重要的法律程序，引起了外界对OpenAI领导层内部动态和沟通的关注。特网的实时更新正在追踪这场备受瞩目的争议，发布于2026年5月6日的日期表明这是围绕这家AI组织持续争议的最新进展。来自穆拉蒂的证词——她曾在奥尔特曼2023年最初被解雇后短暂担任临时CEO——可能对奥尔特曼造成损害，随着法律程序的继续。","source":"verge","created_at":"2026-05-06T21:09:07.612102+00:00","original_url":"https://www.theverge.com/ai-artificial-intelligence/925338/openai-musk-v-altman-mira-murati","categories":{"title":"tech","sort_order":0}},{"id":"b9a400f1-ee7e-4786-8934-2972bac1210b","title":"What we’re hearing about the new homepage → 关于新主页，我们听到的反馈","title_en":"What we’re hearing about the new homepage","title_zh":"关于新主页，我们听到的反馈","content_en":"Summary:\n\nThe Verge has published a product update article titled \"What we're hearing about the new homepage,\" addressing user feedback about their recently redesigned homepage. Written by Danielle Steussy, a Product Manager at The Verge, the article responds to comments and concerns from readers about the homepage changes. Published on May 6, 2026, the piece acknowledges that users have had thoughts and opinions about the new homepage layout and design, and seeks to clarify where these user suggestions and criticisms are being addressed within the product development process. The article, which generated significant discussion with 43 comments, appears to be part of The Verge's transparent approach to communicating updates about their platform's evolution, allowing readers to understand how their feedback is influencing the site's development. As a product update post, the article falls under The Verge's dedicated section for communicating changes to their digital platform, with t","content_zh":"摘要：\nThe Verge发布了一篇题为《我们所获悉的新首页相关情况》的产品更新文章，回应用户对其近期改版的首页的反馈。该文由The Verge产品经理丹妮尔·斯特西撰写，针对读者对首页调整提出的意见与关切作出答复。文章发布于2026年5月6日，文中承认用户对新首页的布局和设计已有诸多想法与看法，同时说明了产品开发流程中正在针对这些用户建议和批评推进的优化工作。该文引发了大量讨论，共收到43条评论，这似乎是The Verge针对平台发展迭代采取透明化沟通策略的举措之一，便于读者了解自身反馈是如何影响网站开发进程的。作为产品更新帖，该文归属于The Verge专门用于公示其数字平台改动的专属板块，","source":"verge","created_at":"2026-05-06T21:07:53.201704+00:00","original_url":"https://www.theverge.com/verge-product-updates/923754/what-we-are-hearing-about-the-new-homepage","categories":{"title":"tech","sort_order":0}},{"id":"2e8b3662-4bd9-4560-9c92-247dc9e46357","title":"The latest Tile Pro is down to $25 — its best price of the year → 最新款Tile Pro降至25美元，为全年最低价。","title_en":"The latest Tile Pro is down to $25 — its best price of the year","title_zh":"最新款Tile Pro降至25美元，为全年最低价。","content_en":"The Verge reports that Tile's latest Pro tracker has dropped to $25, marking its lowest price of the year. This represents a significant discount on the Bluetooth item finder that works seamlessly with both Android and iOS devices. One key advantage the Tile Pro holds over Apple's competing AirTag is the inclusion of a built-in keyring hole, allowing users to easily attach it to keys, bags, or other personal items without needing additional accessories. The sale brings the premium tracker within reach for Mother's Day gift shopping or anyone looking to keep track of their valuables. Tile has positioned the Pro as a versatile tracking solution compatible with the broadest range of smartphones, making it an attractive alternative for users who don't want to be locked into Apple's ecosystem. This price reduction follows a pattern of periodic deals on Tile products, though $25 appears to be the most competitive pricing offered this year for the Pro model.","content_zh":"The Verge报道，Tile最新Pro追踪器已降至25美元，创下今年最低价。这款蓝牙物品查找器可与安卓和iOS设备无缝配合，此次降价幅度显著。Tile Pro相对于苹果竞品AirTag的一个关键优势是内置钥匙扣孔，用户可轻松将其挂在钥匙、包包或其他个人物品上，无需额外配件。此次促销让这款高端追踪器变得触手可及，适合母亲节礼物采购或任何希望追踪贵重物品的人。Tile将Pro定位为兼容最广泛智能手机的多功能追踪解决方案，成为不希望被苹果生态系统绑定的用户的诱人选择。此次降价延续了Tile产品周期性促销的模式，不过25美元似乎是今年Pro型号的最具竞争力定价。","source":"verge","created_at":"2026-05-06T21:06:02.313126+00:00","original_url":"https://www.theverge.com/gadgets/925294/tile-pro-mothers-day-gift-bluetooth-tracker-deal-sale","categories":{"title":"tech","sort_order":0}},{"id":"1ea8ec5e-8904-4cfa-8aea-01b510d06414","title":"Appearing productive in the workplace → 在职场中显得高效","title_en":"Appearing productive in the workplace","title_zh":"在职场中显得高效","content_en":"The article discusses how the widespread adoption of AI tools in the workplace has fundamentally changed what it means to be productive, often in problematic ways. The author references Parkinson's Law—that work expands to fill available time—and argues that AI has become a tool that expands to fill whatever a large language model can be persuaded to generate, effectively without limit. The author describes observing a colleague using AI to generate responses with telltale signs like em dashes and confident assertions about technologies the person clearly didn't understand. The piece identifies two distinct failure modes with generative AI: first, when novices produce work that resembles expert work faster than their judgment warrants, and second, when people generate artifacts in disciplines they were never formally trained in. The author emphasizes that while research has largely focused on the first problem, the second is arguably riskier. The article highlights concerning examples","content_zh":"这篇文章探讨了人工智能工具在工作场所的广泛采用如何从根本上改变了生产力的含义，且往往是以问题重重的方式。作者引用了帕金森定律——工作会扩展到填满所有可用的时间——并认为人工智能已成为一种工具，能够扩展到填满任何大型语言模型可以被说服生成的内容，实际上没有限制。作者描述了观察到一位同事使用人工智能生成回复，这些回复带有明显的迹象，比如破折号和对这个人明显不了解的技术作出的自信断言。这篇文章指出了生成式人工智能的两种截然不同的失败模式：第一，当新手以超出其判断能力的速度产出看起来像专家作品的工作时；第二，当人们在从未接受过正式训练的领域中生成作品时。作者强调，虽然研究主要集中于第一个问题，但第二个问题可以说风险更大。这篇文章突出了令人担忧的例子","source":"hn","created_at":"2026-05-06T21:03:45.87117+00:00","original_url":"https://nooneshappy.com/article/appearing-productive-in-the-workplace/","categories":{"title":"tech","sort_order":0}},{"id":"4316d4a8-03c8-4fb4-a942-500f930c8dc0","title":"The bottleneck was never the code → 瓶颈从来都不是代码","title_en":"The bottleneck was never the code","title_zh":"瓶颈从来都不是代码","content_en":"The author reflects on their recent experiment using coding agents like Codex to test structured-generation algorithms, noting that the agent produced a working first version within hours—a task that had been postponed for over a year. While acknowledging that coding agents have clearly transformed individual productivity in writing code, the author remains skeptical that these gains will translate into substantial acceleration for the software industry as a whole.\n\nThe central argument draws on classic software engineering literature—particularly Fred Brooks' \"The Mythical Man Month\" and Gerald Weinberg's \"The Psychology of Computer Programming\"—to highlight that impactful software has always been written through collaboration and negotiation among multiple humans. The author contends that the code itself is merely the \"residue\" of the harder work: humans agreeing on what a system should do. For fifty years, that residue was expensive enough to dominate attention; coding agents have r","content_zh":"作者反思了最近使用 Codex 等编码代理来测试结构化生成算法的实验，指出该代理在数小时内就生成了一个可工作的第一版本——这是一项被搁置了一年多的任务。虽然承认编码代理已经明显改变了个人编写代码的生产力，但作者仍然怀疑这些收益是否会转化为整个软件行业的实质性加速。\n\n核心论点借鉴了经典的软件工程文献——特别是弗雷德·布鲁克斯的《人月神话》和杰拉尔德·温伯格的《计算机编程心理学》——来强调，有影响力的软件始终是通过多个人之间的协作和协商编写而成的。作者认为，代码本身只是更困难工作的“残留物”：人类就系统应该做什么达成一致。五十年来，这种残留物昂贵到足以主导注意力；编码代理已经r","source":"hn","created_at":"2026-05-06T18:43:27.186494+00:00","original_url":"https://www.thetypicalset.com/blog/thoughts-on-coding-agents","categories":{"title":"tech","sort_order":0}},{"id":"db091183-8b03-48b6-bad8-9d23c924c229","title":"Up to 150 former WHSmith high street stores to close → 多达150家原WH史密斯高街门店即将关闭\n\n注：WH史密斯（WHSmith）是英国知名零售连锁品牌，“高街”为英国对城镇核心商业街的通用称呼，是零售行业相关报道中的常见译法。","title_en":"Up to 150 former WHSmith high street stores to close","title_zh":"多达150家原WH史密斯高街门店即将关闭\n\n注：WH史密斯（WHSmith）是英国知名零售连锁品牌，“高街”为英国对城镇核心商业街的通用称呼，是零售行业相关报道中的常见译法。","content_en":"Up to 150 of the 480 High Street stores formerly belonging to WHSmith are set to close as part of a major restructuring plan launched by Modella Capital, the private equity firm that purchased the chain's high street bookshops last year and rebranded them under the name TGJones. Hundreds of jobs are at risk as a result of this restructuring initiative. The plan was described as an \"essential part\" of the company's turnaround strategy, though the spokesperson stated the decision had \"not been taken lightly.\" The private equity firm attributed the challenging conditions to several factors, including the forced rebranding which negatively impacted public awareness of the brand, rising operating costs as a direct result of government policy, and recent geopolitical events affecting the retail sector. While no specific decisions have been made regarding job losses, Modella Capital stated it is aiming to preserve as many roles as possible, though the closures may result in some store closure","content_zh":"去年收购连锁品牌WH史密斯旗下高街书店业务的私募股权公司莫德拉资本推出了一项重大重组计划，原归属WH史密斯的480家高街门店中最多将有150家被关闭。莫德拉资本去年收购该连锁高街书店后，已将品牌更名为TG琼斯。\n此次重组举措或将导致数百个工作岗位面临风险。尽管发言人表示这一决定“绝非轻率作出”，但该计划仍被称作公司扭亏战略“至关重要的一环”。\n莫德拉资本指出，当前经营困境由多重因素引发：强制品牌重塑削弱了公众对该品牌的认知，政府政策直接导致运营成本上涨，近期地缘政治事件也对零售行业造成了冲击。\n目前尚未就裁员事宜作出具体决定，莫德拉资本称其目标是尽可能保留更多岗位，不过本次闭店安排仍将导致部分门店正式关停。","source":"bbc","created_at":"2026-05-06T18:38:05.357516+00:00","original_url":"https://www.bbc.com/news/articles/clypzvqzqd7o?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"18ecce7c-8adf-4fe0-84b8-533b6d6a192c","title":"Trump's hopes for an Iran peace deal come with caveats → 特朗普的伊朗和平协议期望附带条件","title_en":"Trump's hopes for an Iran peace deal come with caveats","title_zh":"特朗普的伊朗和平协议期望附带条件","content_en":"President Donald Trump announced a pause on \"Project Freedom,\" his plan to escort ships through the Strait of Hormuz, claiming progress toward a \"Complete and Final Agreement\" with Iran. The announcement soothed oil markets and raised hopes for a breakthrough in the ongoing conflict. However, expectations were quickly tempered when Trump himself signaled uncertainty about the deal's prospects. Iran announced it was reviewing a new proposal from Washington, and American media cited unnamed officials stating both sides were closing in on a one-page memorandum to end the war in the Gulf. A source close to mediators in Pakistan told Reuters the deal would be closed very soon. Yet just hours after Trump posted on Truth Social that he was suspending Project Freedom to finalize the agreement, he changed his tone dramatically. On Wednesday morning, the president described an Iran deal as a \"big assumption\" and warned that if no agreement was reached, bombing would resume at \"a much higher leve","content_zh":"特朗普总统宣布暂停“自由计划”，这是他护送船只通过霍尔木兹海峡的计划，并声称在与伊朗达成“全面最终协议”方面取得进展。这一宣布安抚了石油市场，让人们对这场持续冲突的突破性进展抱有希望。然而，预期很快被泼了冷水，因为特朗普本人对这项协议的前景表示不确定。伊朗宣布正在审议华盛顿提交的一项新提案，美国媒体援引匿名官员的话称，双方即将达成一份一页的谅解备忘录，以结束海湾战争。一位接近巴基斯坦调解人的消息来源告诉路透社，协议很快就会敲定。然而，就在特朗普在“真相社交”平台上发帖表示暂停“自由计划”以最终敲定协议的几个小时后，他的语气发生了戏剧性转变。在周三上午，这位总统将伊朗协议描述为一个“重大假设”，并警告说，如果无法达成协议，轰炸将以“更高水平”恢复。","source":"bbc","created_at":"2026-05-06T18:35:49.881869+00:00","original_url":"https://www.bbc.com/news/articles/cvgzp74rvj5o?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"091ee888-ff61-4c59-85f3-cd8410f5048e","title":"Anthropic's Claude Managed Agents can now \"dream,\" sort of → Anthropic旗下的Claude托管智能体如今也算能“做梦”了。","title_en":"Anthropic's Claude Managed Agents can now \"dream,\" sort of","title_zh":"Anthropic旗下的Claude托管智能体如今也算能“做梦”了。","content_en":"Anthropic has announced a significant update to its Claude Managed Agents, introducing a capability that allows these AI systems to \"dream\" internally, albeit in a limited or simulated form. This new feature enables the agents to run generative processes during idle periods, effectively simulating scenarios, exploring potential future states, or refining decision-making strategies without requiring active user input. The development, reported by Ars Technica on May 6, 2026, represents a move toward more autonomous and proactive AI behavior, moving beyond simple reactive responses. By allowing internal simulation, the agents can potentially improve efficiency and contextual awareness, mimicking aspects of human cognition related to imagination or subconscious processing. The term \"sort of\" in the title indicates that this is not consciousness or human-like dreaming, but rather a technical implementation of generative simulation designed to enhance agent performance and adaptability.","content_zh":"Anthropic宣布对其Claude托管智能体进行重大更新，推出一种允许这些AI系统在内部进行\"做梦\"的能力，尽管这是一种有限的或模拟的形式。这一新功能使智能体能够在空闲期间运行生成过程，有效地模拟场景、探索潜在的未来状态，或优化决策策略，而无需用户主动输入。据Ars Technica于2026年5月6日报道，这一开发代表了向更自主、更主动的AI行为的迈进，超越了简单的被动响应。通过允许内部模拟，智能体可能提高效率和情境感知，模仿与想象或潜意识处理相关的人类认知方面。标题中的\"sort of\"一词表明，这不是意识或类似人类的做梦，而是一种技术实现，旨在增强智能体性能和适应性的生成模拟。","source":"ars","created_at":"2026-05-06T18:28:06.648117+00:00","original_url":"https://arstechnica.com/ai/2026/05/anthropics-claude-can-now-dream-sort-of/","categories":{"title":"tech","sort_order":0}},{"id":"48e65d8d-3b4b-4e69-9d28-f96f1b5dd9b4","title":"How Elon Musk left OpenAI, according to Greg Brockman → 格雷格·布罗克曼讲述埃隆·马斯克如何离开OpenAI","title_en":"How Elon Musk left OpenAI, according to Greg Brockman","title_zh":"格雷格·布罗克曼讲述埃隆·马斯克如何离开OpenAI","content_en":"In late August 2017, key figures at OpenAI gathered to discuss creating a for-profit entity to commercialize technology and raise funds for AGI development. Elon Musk demanded full control of the company and had recently given each of his cofounders a Tesla Model 3, which CTO Greg Brockman viewed as an attempt to win support for Musk's vision versus Sam Altman's. When the group refused Musk's demand for control, he became angry and sat in silence for several minutes before stating, \"I decline.\" According to Brockman's account, Musk stood up, stormed around the table, grabbed a painting of a Tesla that had been commissioned as a gift, and asked, \"When will you be departing OpenAI?\" Brockman and research head Ilya Sutskever did not leave or commit to Musk's vision. Musk subsequently stopped his regular donations and left the board within six months, though he continued paying for shared office space with Neuralink until 2020. This pivotal period of disagreement among the original cofound","content_zh":"2017年8月下旬，OpenAI的关键人物聚在一起讨论创建一家营利性实体，以将技术商业化并为通用人工智能开发筹集资金。埃隆·马斯克要求完全控制公司，并最近给每位联合创始人送了一辆特斯拉Model 3，首席技术官格雷格·布罗克曼认为这是试图争取支持马斯克的愿景而非萨姆·奥尔特曼的愿景。当团队拒绝马斯克的控制要求时，他变得愤怒，沉默了几分钟，然后说：\"我拒绝。\"据布罗克曼描述，马斯克站起来，在桌子周围大步走动，拿起一幅被委托作为礼物的特斯拉画作，问道：\"你们什么时候离开OpenAI？\"布罗克曼和研究主管伊利亚·苏茨克弗没有离开，也没有承诺支持马斯克的愿景。马斯克随后停止了他的定期捐款，并在六个月内离开了董事会，尽管他继续支付与Neuralink共享办公室的费用直到2020年。这个创始团队原始成员之间分歧的关键时期","source":"tc","created_at":"2026-05-06T18:28:01.782096+00:00","original_url":"https://techcrunch.com/2026/05/06/how-elon-musk-left-openai-according-to-greg-brockman/","categories":{"title":"tech","sort_order":0}},{"id":"bc3a872f-07b5-4c9e-a14b-a5886dd91421","title":"FDA vaccine studies censored by Trump admin after finding benefits of shots → 美国食品药品监督管理局（FDA）的疫苗研究在发现疫苗的益处后，遭到特朗普政府审查封锁。","title_en":"FDA vaccine studies censored by Trump admin after finding benefits of shots","title_zh":"美国食品药品监督管理局（FDA）的疫苗研究在发现疫苗的益处后，遭到特朗普政府审查封锁。","content_en":"I need to point out that the actual article content was not included in what you provided. The markdown content you've shared contains only:\n\n1. Cookie consent notices and preferences\n2. Navigation elements from the Ars Technica website\n3. Privacy policy information\n\nThe actual article text that would describe the details of this supposed censorship of FDA vaccine studies is not present in the content you provided.\n\nTo write a proper detailed summary (at least 300 characters in plain prose), I would need the actual article content rather than just the website's cookie banners and navigation elements.\n\nIf you can provide the actual article text or body content, I would be happy to write a detailed English summary for you. Alternatively, if this is a hypothetical or testing scenario, I can discuss general principles about writing summaries or about the topic if you have specific questions.\n\nPlease provide the actual article content so I can assist you accurately.","content_zh":"我需要指出，您提供的内容中并没有包含实际的文章正文。您分享的markdown内容仅包含：\n\n1. Cookie 同意通知和偏好设置\n2. 来自 Ars Technica 网站的导航元素\n3. 隐私政策信息\n\n您提供的内容中并未包含描述所谓 FDA 疫苗研究审查事件详情的实际文章文本。\n\n要写一份适当的详细摘要（至少 300 个字符的纯文本），我需要实际的正文内容，而不仅仅是网站的 Cookie 横幅和导航元素。\n\n如果您能提供实际的文章文本或正文内容，我很乐意为您撰写详细的英文摘要。或者，如果这是一个假设性或测试场景，我可以讨论撰写摘要的一般原则，或者如果您有具体问题，也可以讨论相关话题。\n\n请提供实际的文章内容，以便我能够准确地帮助您。","source":"ars","created_at":"2026-05-06T18:25:58.474265+00:00","original_url":"https://arstechnica.com/health/2026/05/trump-admin-censors-more-studies-conflicting-with-rfk-jr-s-anti-vaccine-views/","categories":{"title":"tech","sort_order":0}},{"id":"b91da9f5-408c-41de-9b1d-63cb0877e8e6","title":"DOJ says ransomware gang tapped into Russian government databases → 美国司法部称，某勒索软件团伙侵入了俄罗斯政府的数据库。","title_en":"DOJ says ransomware gang tapped into Russian government databases","title_zh":"美国司法部称，某勒索软件团伙侵入了俄罗斯政府的数据库。","content_en":"The U.S. Department of Justice has accused a ransomware gang of infiltrating Russian government databases, leveraging access to foster corruption within the Russian government. According to prosecutors, the gang's operations enabled its leaders to evade taxes and avoid military service in Russia. The case highlights the intersection of cybercrime and state-sponsored activities, with the DOJ emphasizing how the gang exploited vulnerabilities in government systems. This development underscores the ongoing challenges in combating ransomware attacks that have global implications, especially when linked to state actors. The DOJ's findings suggest a deeper collaboration between criminal groups and government officials, complicating international efforts to address cyber threats.","content_zh":"美国司法部指控一个勒索软件团伙侵入俄罗斯政府数据库，利用所获访问权限助长俄政府内部腐败。据检方介绍，该团伙的运作使其头目得以在俄罗斯逃税、逃避兵役。这起案件凸显了网络犯罪与国家支持活动的交叉属性，司法部也着重说明了该团伙是如何利用政府系统漏洞开展活动的。这一事态凸显出，打击具有全球影响的勒索软件攻击仍面临持续性挑战，当这类攻击与国家行为体相关联时情况尤为严峻。美国司法部的调查结果表明，犯罪团伙与政府官员之间存在更深层次的勾结，令国际社会应对网络威胁的工作变得更为复杂。","source":"tc","created_at":"2026-05-06T18:24:31.632663+00:00","original_url":"https://techcrunch.com/2026/05/06/doj-says-ransomware-gang-tapped-into-russian-government-databases/","categories":{"title":"tech","sort_order":0}},{"id":"cfeb5c88-b5c9-479d-beca-46b06179b8ab","title":"The animated version of the iconic \"Hello, world\" image reveals striking new details → 标志性的“Hello, world”图片动画版揭示了令人惊叹的新细节","title_en":"The animated version of the iconic \"Hello, world\" image reveals striking new details","title_zh":"标志性的“Hello, world”图片动画版揭示了令人惊叹的新细节","content_en":"Summary:\n\nThis Ars Technica article from May 2026 discusses an animated version of the iconic \"Hello, world\" photograph associated with NASA's Artemis lunar missions. The original image became famous for its significance in space exploration imagery, and the newly released animated version offers viewers striking new details that were previously hidden in the static frame. According to the title, this animated iteration proves to be \"even better than the original,\" suggesting enhanced visual quality, additional information revealed through motion, or improved clarity of the lunar surface and spacecraft elements captured in the footage. The article appears to examine how modern animation and image processing techniques applied to historical space photography can uncover fresh insights and appreciation for iconic moments in space exploration history. This type of enhanced imagery represents how NASA and associated space agencies continue to find new value in archival mission data thr","content_zh":"这篇2026年5月发表于Ars Technica的文章讨论了一个与NASA阿尔忒弥斯登月任务相关、标志性的“你好，世界”照片的动画版本。这张原始图像因其在太空探索影像中的重要意义而闻名，新发布的动画版本为观众呈现了之前在静态画面中隐藏的惊人细节。根据标题，这个动画版本被证明“比原版更好”，这表明其具有更高的视觉质量、通过运动揭示的额外信息，或是月球表面和航天器元素画面的清晰度得到了提升。本文似乎在探讨如何将对历史太空摄影应用现代动画和图像处理技术，以发掘对太空探索史上标志性时刻的新见解和新的欣赏角度。这种增强图像技术代表了NASA及相关太空机构如何持续从档案任务数据中挖掘新价值的方式。","source":"ars","created_at":"2026-05-06T18:24:12.482189+00:00","original_url":"https://arstechnica.com/space/2026/05/the-animated-version-of-artemis-hello-world-is-even-better-than-the-original/","categories":{"title":"tech","sort_order":0}},{"id":"6897c9e9-4731-462a-9b36-1c4bad133985","title":"Google DeepMind partners with EVE Online for AI model testing → 谷歌DeepMind与《星战前夜》（EVE Online）合作开展AI模型测试","title_en":"Google DeepMind partners with EVE Online for AI model testing","title_zh":"谷歌DeepMind与《星战前夜》（EVE Online）合作开展AI模型测试","content_en":"Summary: Google DeepMind Partners with EVE Online for AI Model Testing\n\nGoogle DeepMind has announced a partnership with EVE Online, the popular massively multiplayer online space simulation game developed by CCP Games. The collaboration aims to leverage EVE Online's unique and complex virtual environment as a testing ground for advanced artificial intelligence model development. EVE Online is renowned for its intricate player-driven economy, sophisticated political systems, large-scale interstellar warfare, and emergent gameplay mechanics that closely mirror real-world economic and social dynamics. These characteristics make it an ideal sandbox for training and evaluating AI systems in scenarios that require strategic decision-making, resource management, and complex interactions. The partnership represents a significant intersection between cutting-edge AI research and gaming technology, following in the footsteps of previous AI gaming ventures like those involving StarCraft. The c","content_zh":"摘要：谷歌深度思维与《星战前夜》合作开展人工智能模型测试\n谷歌深度思维宣布已与CCP游戏公司开发的热门大型多人在线太空模拟游戏《星战前夜》（EVE Online）达成合作。本次合作旨在利用《星战前夜》独特且复杂的虚拟环境，作为先进人工智能模型研发的试验场。《星战前夜》以玩家驱动的复杂经济体系、成熟的游戏内政治系统、大规模星际战争，以及和现实世界经济、社会动态高度贴近的涌现式玩法机制著称，这些特性使其成为理想的沙盒场景，可用于在需要战略决策、资源管理、复杂交互的情境下训练和评估人工智能系统。此次合作是前沿人工智能研究与游戏技术的重要跨界融合，延续了此前针对《星际争霸》等游戏开展人工智能项目探索的路径。","source":"ars","created_at":"2026-05-06T18:22:28.670474+00:00","original_url":"https://arstechnica.com/gaming/2026/05/google-deepmind-partners-with-eve-online-for-ai-model-testing/","categories":{"title":"tech","sort_order":0}},{"id":"fdb5a97b-b503-431d-9487-172dcd6c4522","title":"Report: SpaceX IPO gives Musk unchecked power and forbids investor lawsuits → 报道：SpaceX IPO给予马斯克不受约束的权力，并且禁止投资者诉讼","title_en":"Report: SpaceX IPO gives Musk unchecked power and forbids investor lawsuits","title_zh":"报道：SpaceX IPO给予马斯克不受约束的权力，并且禁止投资者诉讼","content_en":"Summary: SpaceX IPO Gives Musk Unchecked Power and Forbids Investor Lawsuits\n\nAccording to a report published by Ars Technica on May 6, 2026, SpaceX's much-anticipated Initial Public Offering (IPO) contains provisions that grant company CEO Elon Musk unprecedented authority over the aerospace manufacturer while simultaneously restricting investors' ability to pursue legal action against the firm. The IPO structure reportedly shields Musk from potential shareholder lawsuits, raising concerns among corporate governance experts about accountability and investor protections in what would be one of the most significant public offerings in the aerospace and technology sectors. The report highlights how SpaceX has historically operated as a privately held company under Musk's direct leadership, and the transition to public markets appears to maintain that centralized control structure through specialized share classes and contractual provisions that limit judicial oversight. This developmen","content_zh":"### 摘要：SpaceX IPO赋予马斯克不受约束的权力，且禁止投资者起诉\n据Ars Technica2026年5月6日发布的报道，备受期待的SpaceX首次公开募股（IPO）所含条款，在赋予公司首席执行官埃隆·马斯克对这家航空航天制造商前所未有的控制权的同时，还限制了投资者对该公司提起法律诉讼的权利。\n据称该IPO架构可让马斯克免受潜在的股东诉讼，本次上市将是航空航天和科技领域最具分量的公开募股事件之一，其问责机制与投资者保护相关问题已经引发公司治理专家的担忧。报道指出，SpaceX作为私营企业期间一直由马斯克直接领导，而其转向公开市场的过程中，似乎也通过特殊股权类别、限制司法监督的合同条款保留了这种集中管控结构。这一发展","source":"ars","created_at":"2026-05-06T18:20:30.952047+00:00","original_url":"https://arstechnica.com/tech-policy/2026/05/report-spacex-ipo-gives-musk-unchecked-power-and-forbids-investor-lawsuits/","categories":{"title":"tech","sort_order":0}},{"id":"7a39b10f-5f61-4f22-93ed-4dd9e3d2fcd0","title":"Google updates AI search to include quotes from Reddit and other sources → 谷歌更新AI搜索功能，纳入Reddit及其他来源的引用内容","title_en":"Google updates AI search to include quotes from Reddit and other sources","title_zh":"谷歌更新AI搜索功能，纳入Reddit及其他来源的引用内容","content_en":"Google is updating its AI-powered search experience to incorporate quotes and content from Reddit and other online discussion forums, in a move designed to help users find answers to more specific and niche queries. The change reflects Google's ongoing efforts to enhance its AI-driven search capabilities by leveraging the collective knowledge and real-world experiences shared by users on community platforms. By surfacing content from sources like Reddit, Google aims to provide more diverse perspectives and practical advice that may not be readily available through traditional web content. However, this approach has drawn scrutiny, as the quality and reliability of information from forum discussions can vary significantly. Critics suggest that integrating user-generated content into AI-generated search results could lead to inconsistent or potentially misleading information, raising concerns about how Google will curate and present such material to maintain accuracy and relevance. This","content_zh":"谷歌正在更新其人工智能驱动的搜索体验，将Reddit及其他网络论坛的言论和内容纳入其中，此举旨在帮助用户找到更具体、更小众问题的答案。这一变化体现出谷歌正持续发力，通过利用社区平台上用户分享的集体知识和真实经验，强化其人工智能搜索功能。通过推送Reddit这类来源的内容，谷歌希望提供更多元的视角和实用建议，这些内容往往是传统网页内容中难以获取的。不过这一做法也受到了审视，因为论坛讨论内容的信息质量和可靠性可能参差不齐。批评人士指出，将用户生成内容整合到人工智能生成的搜索结果中，可能会导致信息不一致，甚至可能具有误导性，这也引发了外界对谷歌将如何筛选、呈现这类内容以保障其准确性和相关性的担忧。","source":"tc","created_at":"2026-05-06T18:18:28.812344+00:00","original_url":"https://techcrunch.com/2026/05/06/google-updates-ai-search-to-include-expert-advice-from-reddit-and-other-web-forums/","categories":{"title":"tech","sort_order":0}},{"id":"8b36638a-7d31-4e43-8770-517c40a55378","title":"Chrome on Android now supports approximate instead of precise location sharing → 安卓端Chrome浏览器现已支持共享近似位置，而非精准位置。","title_en":"Chrome on Android now supports approximate instead of precise location sharing","title_zh":"安卓端Chrome浏览器现已支持共享近似位置，而非精准位置。","content_en":"The user wants a detailed English summary, at least 300 characters, plain prose.\n\nThe title is \"Chrome on Android now supports approximate instead of precise location sharing\".\n\nWe need to summarize: The article probably about Chrome on Android now allows users to choose approximate location rather than precise location. This is a privacy feature giving users more control. The summary should be at least 300 characters (so roughly 3-5 sentences). Must be plain prose, no bullet points, just normal text. Should mention that it's a change to the location permission UI and how it works.\n\nThe content includes various HTML etc. There's a \"In Brief\" with date and time. There's mention \"Image Credits: Silas Stein/picture alliance (opens in a new wind\". Not sure.\n\nWe need to write a summary that captures the essence: Chrome for Android now supports the \"approximate location\" option when websites request location via the Geolocation API. Users can choose to share city-level or region-level locati","content_zh":"用户需要一份详细的英文摘要，字数至少300字符，采用平实散文体，本次摘要的标题为《安卓端Chrome浏览器现已支持共享模糊定位而非精准定位》。\n我们撰写摘要时需覆盖以下内容：这篇文章大致围绕安卓端Chrome浏览器新增的允许用户选择共享模糊定位而非精准定位的功能展开，该功能属于隐私保护类功能，能赋予用户更多个人信息控制权。摘要字数至少要达到300字符，大致对应3到5句话，必须采用平实的散文格式，不得使用项目符号，仅使用常规正文表述，同时需要提及本次更新是对位置权限用户界面做出的调整，还要说明该功能的运行逻辑。\n原文内容包含各类HTML代码等元素，设置了带有发布日期和时间的“要点速览”板块，还标注有“图片来源：塞拉斯·施泰因/图片联盟（在新窗口打开）”，其余相关信息暂不明确。\n我们最终撰写的摘要需要抓住核心本质：当网站通过地理定位API向用户请求位置权限时，安卓端Chrome浏览器现已提供“模糊定位”选项，用户可选择向网站共享市级或区域级的位置信息。","source":"tc","created_at":"2026-05-06T18:16:49.734949+00:00","original_url":"https://techcrunch.com/2026/05/06/chrome-on-android-now-supports-approximate-instead-of-precise-location-sharing/","categories":{"title":"tech","sort_order":0}},{"id":"bb4fd01a-559d-4269-8dc7-e362c94c8788","title":"DeepSeek could hit $45B valuation from its first investment round → DeepSeek的首轮融资可能使其估值达到450亿美元","title_en":"DeepSeek could hit $45B valuation from its first investment round","title_zh":"DeepSeek的首轮融资可能使其估值达到450亿美元","content_en":"The user wants a detailed English summary, at least 300 characters, plain prose, of the article from TechCrunch about DeepSeek possibly hitting $45B valuation from its first investment round. The article likely discusses DeepSeek, a Chinese AI lab that rose to prominence in early 2025 after launching a large language model trained at a fraction of the compute power and cost of U.S. models like OpenAI and Anthropic. The article is from May 6, 2026. The content provided in the prompt is mostly HTML markup and not the actual article text. However, from the given content, we can extract some details:\n\nTitle: DeepSeek could hit $45B valuation from its first investment round\nURL: https://techcrunch.com/2026/05/06/deepseek-could-hit-45b-valuation-from-its-first-investment-round/\nPublished Time: 2026-05-06T17:20:34+00:00\nMarkdown Content includes some snippets: \"The Chinese AI lab came to prominence in early 2025 after launching a large language model that trained on a fraction of the","content_zh":"据TechCrunch 2026年5月6日的报道，中国人工智能实验室DeepSeek正在进行首轮融资，估值可能达到450亿美元。DeepSeek在2025年初迅速崛起并引起广泛关注，当时该实验室发布了一款大语言模型，其训练所需的计算资源和成本仅为美国同类模型（如OpenAI和Anthropic开发的产品）的一小部分。这一突破性成就使DeepSeek一举成名，展示了即使在资源相对有限的情况下，中国团队也能开发出具有竞争力的AI产品。该公司即将完成的这轮融资规模庞大，反映出投资者对中国人工智能领域的高度兴趣和信心，尤其是在看到DeepSeek在模型效率方面展现出的显著优势后。随着这笔投资的完成，DeepSeek的估值将大幅提升，进一步巩固其在全球AI竞争格局中的地位。","source":"tc","created_at":"2026-05-06T18:13:56.598977+00:00","original_url":"https://techcrunch.com/2026/05/06/deepseek-could-hit-45b-valuation-from-its-first-investment-round/","categories":{"title":"tech","sort_order":0}},{"id":"d7f5b3ae-0f83-4375-b2f8-4704cc08b3f4","title":"SpaceX may spend up to $119 billion on &#8216;Terafab&#8217; chip factory in Texas → SpaceX可能斥资高达1190亿美元在德克萨斯州建设\"Terafab\"芯片工厂","title_en":"SpaceX may spend up to $119 billion on &#8216;Terafab&#8217; chip factory in Texas","title_zh":"SpaceX可能斥资高达1190亿美元在德克萨斯州建设\"Terafab\"芯片工厂","content_en":"SpaceX, the space company founded and led by Elon Musk that also houses his artificial intelligence venture xAI, is considering investing up to $119 billion to build a massive semiconductor manufacturing facility in Texas, according to a filing submitted to Grimes County. The initial phase of this ambitious project, internally referred to as \"Terafab,\" would require at least $55 billion in spending. This substantial investment would represent one of the largest manufacturing commitments in the semiconductor industry, reflecting the growing importance of domestic chip production and the increasing vertical integration ambitions of Musk's business empire. The proposed facility would likely focus on producing advanced chips that could serve both SpaceX's spacecraft and satellite operations as well as xAI's artificial intelligence development needs. If the full investment materializes, the Terafab project would position Texas as a major hub for next-generation semiconductor manufacturing,","content_zh":"SpaceX（太空探索技术公司）是埃隆·马斯克创立并领导的太空公司，同时也拥有他的人工智能企业xAI。据提交给格里姆斯县的申请文件，该公司正考虑投资高达1190亿美元在德克萨斯州建设一个大型半导体制造工厂。这个雄心勃勃的项目（内部称为\"Terafab\"）的初始阶段将需要至少550亿美元的支出。这一巨额投资将代表半导体行业最大的制造业承诺之一，反映出国内芯片生产日益增长的重要性，以及马斯克商业帝国日益增长的垂直整合野心。拟建设施可能会专注于生产先进芯片，这些芯片既可以服务于SpaceX的航天器和卫星运营，也可以满足xAI的人工智能开发需求。如果全部投资得以实现，Terafab项目将使德克萨斯州成为下一代半导体制造的主要中心。","source":"tc","created_at":"2026-05-06T18:11:27.171497+00:00","original_url":"https://techcrunch.com/2026/05/06/spacex-may-spend-up-to-119-billion-on-terafab-chip-factory-in-texas/","categories":{"title":"tech","sort_order":0}},{"id":"2d677c89-75bd-4bf2-8243-7add7acb6c26","title":"AI evaluation startup Braintrust confirms breach, tells every customer to rotate sensitive keys → AI评估初创公司Braintrust确认数据泄露，告知所有客户轮换敏感密钥","title_en":"AI evaluation startup Braintrust confirms breach, tells every customer to rotate sensitive keys","title_zh":"AI评估初创公司Braintrust确认数据泄露，告知所有客户轮换敏感密钥","content_en":"Braintrust, a San Francisco‑based startup that describes itself as an “operating system for engineers building AI software,” disclosed on May 6 2026 that hackers had broken into one of its Amazon Web Services (AWS) cloud environments. In an email to customers and a status‑page notice, the company said the intruders gained access to an internal system that could have exposed API keys, evaluation datasets and configuration files used by its clients to test and monitor AI models. The breach was spotted after abnormal activity was detected in the AWS environment; Braintrust immediately shut down the affected infrastructure, engaged a third‑party forensic firm and alerted law‑enforcement authorities. As a precaution, the startup is urging every customer to rotate any API keys, OAuth tokens, secret keys or other sensitive credentials stored on its platform and to audit access logs for signs of unauthorized use. Braintrust has promised to provide further details as its investigation continues","content_zh":"Braintrust是一家位于旧金山的初创公司，自称为“为工程师构建AI软件打造的操作系统”，于2026年5月6日披露，黑客入侵了其一个亚马逊网络服务(AWS)云环境。在一封给客户的电子邮件和状态页面通知中，该公司表示，入侵者访问了一个内部系统，该系统可能暴露了客户用于测试和监控AI模型的API密钥、评估数据集和配置文件。这次入侵是在AWS环境中检测到异常活动后发现的；Braintrust立即关闭了受影响的基础设施，聘请了一家第三方取证公司，并通知了执法部门。作为预防措施，这家初创公司敦促每位客户轮换在其平台上存储的任何API密钥、OAuth令牌、密钥或其他敏感凭证，并审查访问日志以发现未经授权使用的迹象。Braintrust承诺在其调查继续进行的过程中提供更多细节。","source":"tc","created_at":"2026-05-06T18:09:14.158321+00:00","original_url":"https://techcrunch.com/2026/05/06/ai-evaluation-startup-braintrust-confirms-breach-tells-every-customer-to-rotate-sensitive-keys/","categories":{"title":"tech","sort_order":0}},{"id":"66bceed2-c9eb-4c75-9f1d-385ed337d794","title":"CARA 2.0 – “I Built a Better Robot Dog” → CARA 2.0——“我造出了更好的机器狗”","title_en":"CARA 2.0 – “I Built a Better Robot Dog”","title_zh":"CARA 2.0——“我造出了更好的机器狗”","content_en":"CARA 2.0 is an upgraded quadrupedal robot designed and built by Aaed Musa as his senior design project. The project traces its origins to May 2024, when Musa uploaded a viral video about building a high-precision speed reducer using rope, specifically a capstan drive mechanism. This video established him as the \"capstan guy\" and remains his highest-viewed content. The following year, he created the original CARA, a quadrupedal robot incorporating capstan drives. CARA 2.0 represents the next evolution of this work, with Musa and his team setting ambitious specifications: a total cost under $1000, a weight under 20 pounds, and sufficient durability for both hobbyists and researchers. The heart of the project lies in developing a low-cost dynamic actuator using Quasi Direct Drive (QDD) technology, a concept popularized by Ben Katz during the development of the MIT Mini Cheetah. QDD actuators combine high-torque brushlessless motors with low gear ratio gearboxes and Field Oriented Control","content_zh":"CARA 2.0是阿耶德·穆萨为完成毕业设计设计打造的升级款四足机器人。该项目的起源可追溯至2024年5月，当时穆萨上传了一段介绍如何用绳索制作高精度减速器（具体为绞盘传动机构）的视频，该视频迅速走红，让他得了个“绞盘哥”的名号，至今仍是他播放量最高的作品。次年，他造出了初代CARA，这是一台融入了绞盘传动技术的四足机器人。\nCARA 2.0是这项研究的下一步迭代成果，穆萨和团队为它设定了颇具挑战性的参数目标：总成本低于1000美元，重量不到20磅，耐用性足以满足爱好者和研究人员的使用需求。该项目的核心是采用准直驱（QDD）技术研发低成本动态执行器，这一概念是本·卡茨在开发麻省理工学院迷你猎豹机器人期间推广开来的。准直驱执行器融合了高扭矩无刷电机、低减速比齿轮箱以及磁场定向控制技术。","source":"hn","created_at":"2026-05-06T18:06:49.138512+00:00","original_url":"https://www.aaedmusa.com/projects/cara2","categories":{"title":"tech","sort_order":0}},{"id":"a7933888-2e06-4aa5-a25b-bfa8349c8937","title":"Valve releases Steam Controller CAD files under Creative Commons license → 维尔福（Valve）依据知识共享许可协议发布Steam控制器的CAD文件","title_en":"Valve releases Steam Controller CAD files under Creative Commons license","title_zh":"维尔福（Valve）依据知识共享许可协议发布Steam控制器的CAD文件","content_en":"Summary: Valve Releases Steam Controller CAD Files Under Creative Commons License\n\nValve has made a full set of CAD (Computer-Aided Design) files available for the Steam Controller, allowing modders and hobbyists to create their own custom add-ons and accessories. The release includes detailed files for the external shell, referred to as \"surface topology,\" for both the Controller and its companion Puck device. These files are provided in multiple formats, including .STP, .STL, and comprehensive engineering diagrams that illustrate the device's design. The engineering diagrams are particularly important as they highlight specific areas of the controller that must remain unobstructed to maintain proper wireless signal strength and ensure the device functions correctly.\n\nThe primary purpose of this release is to empower the community to develop custom accessories such as protective skins, charging stands, grip extenders, and smartphone mounts. This move aligns with Valve's previous pra","content_zh":"摘要：Valve以知识共享许可协议发布Steam手柄CAD文件\nValve已公开Steam手柄的全套计算机辅助设计（CAD）文件，改装玩家和爱好者可借此制作自定义附加组件及周边配件。本次发布的内容包含Steam手柄及其配套Puck设备的外壳（即“表面拓扑结构”）的详细文件，提供多种格式，包括.STP、.STL文件以及展现设备设计的完整工程图。这些工程图的作用尤为关键，其中明确标注了手柄上必须保持无遮挡的特定区域，以此保障无线信号强度达标，确保设备正常运行。\n本次发布文件的核心目的是赋能社区开发自定义配件，例如保护套、充电底座、握把延长件、手机支架等。此举符合Valve此前的……","source":"hn","created_at":"2026-05-06T18:05:38.91924+00:00","original_url":"https://www.digitalfoundry.net/news/2026/05/valve-releases-steam-controller-cad-files-under-creative-commons-license","categories":{"title":"tech","sort_order":0}},{"id":"3835afd3-447b-47c1-aae8-a3262cf42d05","title":"Agents can now create Cloudflare accounts, buy domains, and deploy → 代理现在可以创建 Cloudflare 账户、购买域名并部署。","title_en":"Agents can now create Cloudflare accounts, buy domains, and deploy","title_zh":"代理现在可以创建 Cloudflare 账户、购买域名并部署。","content_en":"Cloudflare has announced a significant advancement in agent capabilities that now enables AI agents to create Cloudflare accounts, purchase domains, and deploy production applications entirely on behalf of users without requiring manual setup steps. Previously, deploying to production required humans to handle account creation, payment configuration, and API token generation—tasks that agents could not perform independently. This new capability addresses a critical gap by allowing agents to provision everything needed for deployment automatically.\n\nThe functionality works through a new protocol co-developed with Stripe as part of the Stripe Projects launch. Users begin by installing the Stripe CLI with the Stripe Projects plugin, logging into Stripe, and running the initialization command. From there, agents can build applications and deploy them to newly registered domains without any human intervention beyond initial permission grants.\n\nWhen a user is already logged into Stripe with","content_zh":"Cloudflare 宣布在代理能力方面取得重大进展，现在使 AI 代理能够代表用户创建 Cloudflare 账户、购买域名，并部署生产应用程序，无需手动设置步骤。此前，部署到生产环境需要人工处理账户创建、支付配置和 API 令牌生成——这些是代理无法独立执行的任务。这一新功能通过允许代理自动配置部署所需的一切来解决一个关键缺口。\n\n该功能通过与 Stripe 合作开发的新协议实现，作为 Stripe Projects 发布的一部分。用户首先安装带有 Stripe Projects 插件的 Stripe CLI，登录 Stripe，然后运行初始化命令。从那里开始，代理可以构建应用程序并将其部署到新注册的域名，除了初始权限授权外无需任何人工干预。当用户已经登录 Stripe 时","source":"hn","created_at":"2026-05-06T18:03:19.503967+00:00","original_url":"https://blog.cloudflare.com/agents-stripe-projects/","categories":{"title":"tech","sort_order":0}},{"id":"7ddf68b8-eae0-4a65-a04e-a643094ffe89","title":"Here are the fitness trackers I actually recommend → 以下是我真正推荐的健身追踪器","title_en":"Here are the fitness trackers I actually recommend","title_zh":"以下是我真正推荐的健身追踪器","content_en":"Here are the fitness trackers I actually recommend: The Verge article by Victoria Song, published on May 6, 2026, cuts through the noise of endless gadget specs to focus on what truly matters when choosing a fitness tracker—how well it fits into your daily life. Song, a senior reviewer of wearable tech at The Verge, emphasizes that the best device isn’t necessarily the one with the most advanced features but the one you’ll consistently wear and use. The article likely walks through her top picks for 2026, balancing performance, comfort, battery life, and ecosystem compatibility, while offering practical advice for readers to match their fitness goals and habits. By prioritizing honesty over hype, Song provides a trustworthy guide for anyone looking to invest in a fitness tracker that genuinely enhances their health journey.","content_zh":"以下是我实际推荐的几款健身追踪器：Victoria Song在The Verge上于2026年5月6日发表的文章，摒弃了无尽小工具参数的干扰，将重点放在选择健身追踪器时真正重要的事情上——它如何融入你的日常生活。Song是The Verge可穿戴设备的高级评测员，她强调，最佳设备不一定是功能最先进的，而是你会持续佩戴和使用的。文章可能会介绍她2026年的首选推荐，平衡性能、舒适度、电池续航和生态系统兼容性，同时为读者提供实用建议以匹配他们的健身目标和习惯。通过将诚实置于炒作之上，Song为任何想要投资健身追踪器的人提供了值得信赖的指南，帮助他们真正改善健康旅程。","source":"verge","created_at":"2026-05-06T15:51:46.689471+00:00","original_url":"https://www.theverge.com/gadgets/924338/best-fitness-trackers-2026","categories":{"title":"tech","sort_order":0}},{"id":"262e4795-d3c5-4a22-ba0d-c16247c13afb","title":"Xbox changes continue with new console boot animation → Xbox的更新调整仍在继续，现已推出全新主机开机动画。","title_en":"Xbox changes continue with new console boot animation","title_zh":"Xbox的更新调整仍在继续，现已推出全新主机开机动画。","content_en":"Summary\n\nMicrosoft continues to refresh its Xbox brand under new leadership, with the company introducing a new console boot animation as part of its ongoing efforts to improve the gaming experience. The tech giant's new Xbox CEO has been implementing various changes aimed at pleasing fans, with this latest modification representing another step in the platform's evolution. The updated boot animation marks a visual refresh for the console, aligning with Microsoft's broader strategy to modernize Xbox and enhance user engagement. This announcement comes as part of a series of updates the company has been rolling out, demonstrating Microsoft's commitment to evolving its gaming ecosystem while responding to community feedback.","content_zh":"概要\n在新领导层的带领下，微软正持续焕新Xbox品牌，作为优化游戏体验相关工作的一环，该公司推出了全新的主机开机动画。这家科技巨头的新任Xbox首席执行官一直在推行多项旨在取悦玩家的变革，此次最新调整是该平台发展演进的又一举措。更新后的开机动画是Xbox主机的一次视觉焕新，契合微软推动Xbox现代化、提升用户参与度的整体战略。本次公告属于微软正在逐步推送的一系列更新内容，体现出微软在响应社区反馈的同时，始终致力于发展自身游戏生态。","source":"verge","created_at":"2026-05-06T15:49:31.456471+00:00","original_url":"https://www.theverge.com/tech/925110/new-xbox-logo-boot-animation","categories":{"title":"tech","sort_order":0}},{"id":"cb5dba07-f248-4783-968c-c3f1b202a3fb"
