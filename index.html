          content_zh:

            "特德·特纳，这位富有远见的媒体企业家、CNN创始人以及24小时有线电视新闻概念的先驱，于2026年5月6日去世，享年87岁。特纳于1980年创办CNN，通过创建首个专业全新闻有线电视频道，永远改变了新闻的制作和传播方式。除CNN外，他还创建了特纳广播系统，收购了亚特兰大勇士棒球队，并创建了WTBS超级电视台，将体育和娱乐节目带给广大国内观众。后来他通过收购米高梅电影资料库扩展到电影领域，创立了联合国基金会以支持全球事业，并通过特纳濒危物种基金成为著名的环保主义者。特纳对持续新闻报道的大胆赌注改变了全球新闻业，为现代有线和卫星新闻奠定了基础，并巩固了他作为现代媒体最具影响力人物之一的声誉。他的去世标志着一个先驱者时代的终结，这位先驱者的理念重塑了世界了解信息的方式。",

          title_zh: "谷歌云欺诈防御，reCAPTCHA 的下一代演进",
          content_en:
            "Google Cloud has announced the launch of Fraud Defense, a comprehensive trust platform designed to address the emerging security challenges of the agentic web—where autonomous AI agents increasingly handle complex online transactions. Positioned as the next evolution of reCAPTCHA, Fraud Defense enables businesses to verify and distinguish between legitimate bots, human users, and AI agents, providing the intelligence needed to secure digital interactions and commerce.\n\nThe platform introduces several key capabilities. First, an agentic activity measurement dashboard helps organizations understand and analyze AI-driven traffic by integrating with industry standards such as Web Bot Auth and SPIFFE, while also connecting agent and human identities to assess risk. Second, the agentic policy engine provides granular control over traffic throughout the user journey, allowing businesses to allow or block agents based on conditions including risk scores, automation types, and agent identity. T",
          content_zh:
            "Google Cloud 宣布推出 Fraud Defense（欺诈防御），这是一个全面的信任平台，旨在应对代理网络（agentic web）新兴的安全挑战——在这个网络中，自主 AI 代理越来越多地处理复杂的在线交易。Fraud Defense 作为 reCAPTCHA 的下一代演进版本，使企业能够验证并区分合法机器人、人类用户和 AI 代理，提供保护数字互动和商务所需的智能。\n\n该平台推出了几项关键功能。首先，代理活动测量仪表板通过与 Web Bot Auth 和 SPIFFE 等行业标准集成，帮助组织理解和分析 AI 驱动的流量，同时连接代理和人类身份以评估风险。其次，代理策略引擎在整个用户旅程中对流量提供精细化控制，使企业能够根据风险评分、自动化类型和代理身份等条件允许或阻止代理。",

            "Summary\n\nA federal court has struck down an anti-discrimination rule issued by the Federal Communications Commission (FCC) that had been strongly opposed by major internet service providers. The ruling represents a significant victory for the telecommunications industry, which had challenged the regulation on various legal grounds. The FCC's rule was designed to prevent internet providers from discriminating against certain types of internet traffic or charging different rates for different types of online services and content. Industry groups argued that the regulation overstepped the commission's authority and would stifle investment in network infrastructure. The court's decision effectively invalidates the FCC's effort to impose stricter oversight of how internet providers manage traffic on their networks. This ruling marks a reversal of the agency's attempt to apply common carrier principles to broadband services, similar to those traditionally applied to telephone networks. The",

          content_zh:

          content_zh:

          title:
            'Barry Diller trusts Sam Altman. But &#8216;trust is irrelevant&#8217; as AGI nears, he says. → 巴里·迪勒信任萨姆·阿尔特曼。但他表示，随着AGI临近，"信任无关紧要"。',
          title_en:
            "Barry Diller trusts Sam Altman. But &#8216;trust is irrelevant&#8217; as AGI nears, he says.",
          title_zh:
            '巴里·迪勒信任萨姆·阿尔特曼。但他表示，随着AGI临近，"信任无关紧要"。',
          content_en:
            "Barry Diller, the veteran media executive, publicly defended OpenAI CEO Sam Altman, saying he trusts him personally, but warned that as artificial general intelligence (AGI) approaches, trust alone is insufficient and essentially irrelevant to mitigating its risks. Speaking at the WSJ’s Future of Everything event, Diller argued that AGI is an unpredictable force that demands robust guardrails and governance mechanisms rather than reliance on individual trustworthiness. While he expressed confidence in Altman’s leadership, he stressed that the development of AGI is a broader societal challenge requiring institutional safeguards, oversight, and careful regulation to prevent unintended consequences. Diller’s remarks highlight the growing tension between rapid AI advancement and the need for responsible stewardship, underscoring that personal trust in a few leaders cannot be the sole defense against the systemic impacts of AGI.",
          content_zh:
            '巴里·迪勒，这位资深媒体高管，公开为OpenAI CEO萨姆·阿尔特曼辩护，称他个人信任阿尔特曼，但警告称，随着通用人工智能（AGI）的临近，仅靠信任是不够的，而且对于降低其风险来说几乎毫无意义。在《华尔街日报》的"一切未来"活动上，迪勒认为，AGI是一股不可预测的力量，需要强有力的护栏和治理机制，而不是依赖个人可信度。虽然他对阿尔特曼的领导力表示了信心，但他强调，AGI的发展是一个更广泛的社会挑战，需要制度性的保障措施、监督和谨慎的监管来防止意外后果。迪勒的言论突出了快速AI发展与需要负责任管理之间日益紧张的矛盾，强调仅靠对少数几位领导人的个人信任不能成为防御AGI系统性影响的唯一手段。',

          content_en:
            "The Indian startup Pronto has secured investment from renowned venture capitalist Lachy Groom after a concise 20-minute pitch, according to a TechCrunch report published on May 6, 2026. The rapid success of the pitch highlights the growing confidence in Pronto's business model and its potential within a rapidly expanding market. The investment comes at a time when Pronto is experiencing significant traction, scaling to 26,000 daily bookings. Industry analysts suggest the market Pronto operates in could reach a size of $18 billion. This backing from Groom, a well-known figure in the tech investment community, is expected to propel Pronto's growth trajectory and solidify its position in the competitive landscape.",

          id: "91fc394b-b0fa-46e1-ab2a-96335a835db2",
          title:
            "Vibe coding and agentic engineering are getting closer than I'd like → Vibe coding和agentic工程正变得比我预想的更加趋同。",
          title_en:
            "Vibe coding and agentic engineering are getting closer than I'd like",
          title_zh: "Vibe coding和agentic工程正变得比我预想的更加趋同。",
          content_en:
            'Summary\n\nIn this May 2026 blog post, Simon Willison discusses his recent appearance on Heavybit\'s High Leverage podcast with Joseph Ruscio, where he explored AI coding tools and arrived at what he describes as a "disturbing realization." The piece reflects on how two distinct approaches to AI-assisted programming—"vibe coding" and "agentic engineering"—have begun to overlap in his own practice.\n\nWillison had previously defined vibe coding as a hands-off approach where programmers (or even non-programmers) use AI tools without examining the generated code, simply iterating based on whether the output works. He argued this approach is acceptable for personal tools but "grossly irresponsible" when building software for others, since bugs can harm users.\n\nAgentic engineering, by contrast, involves professional software engineers leveraging AI tools while drawing on extensive experience in security, maintainability, operations, and performance. The goal is to build higher-quality software',
          content_zh:
            "摘要\n\n在这篇2026年5月的博客文章中，Simon Willison讨论了他最近在Heavybit的High Leverage播客上与Joseph Ruscio的对话，节目中他探讨了AI编程工具，并得出了他所说的“令人不安的认知”。文章反思了他自己的实践中，AI辅助编程的两种不同方式——“氛围编程”和“智能体工程”——如何开始重叠。\n\nWillison之前将氛围编程定义为一种放手不管的方式，程序员（甚至非程序员）使用AI工具时不检查生成的代码，仅根据输出是否有效进行迭代。他认为这种方式用于个人工具是可以接受的，但在为他人构建软件时是“极其不负责任的”，因为bug可能会伤害用户。\n\n相比之下，智能体工程涉及专业软件工程师利用AI工具，同时运用他们在安全、可维护性、运维和性能方面的丰富经验。目标是构建更高质量的软件。",
          source: "hn",

          title_en:
            "Higher usage limits for Claude and a compute deal with SpaceX",
          title_zh:
            "克劳德（Claude）更高的使用限额，以及与太空探索技术公司（SpaceX）的算力合作协议",
          content_en:
            "Anthropic has announced a significant partnership with SpaceX that will substantially increase their compute capacity, enabling the company to raise usage limits for Claude Code and the Claude API effective immediately. The improvements include doubling Claude Code's five-hour rate limits for Pro, Max, Team, and seat-based Enterprise plans, removing the peak hours limit reduction for Pro and Max accounts, and considerably raising API rate limits for Claude Opus models. The SpaceX agreement gives Anthropic access to all compute capacity at the Colossus 1 data center, providing more than 300 megawatts of new capacity with over 220,000 NVIDIA GPUs available within the month. This new capacity will directly benefit Claude Pro and Max subscribers. This partnership joins Anthropic's other major compute deals, including an up to 5 gigawatt agreement with Amazon that includes nearly 1 gigawatt of new capacity by the end of 2026, a 5 gigawatt agreement with Google and Broadcom coming online in",
          content_zh:
            "Anthropic宣布与SpaceX达成重磅合作，将大幅提升自身算力，即刻起上调Claude Code与Claude API的使用限额。\n本次升级内容包括：Pro、Max、团队版及按席位计费的企业版方案的Claude Code五小时速率限制翻倍，取消Pro与Max账户的高峰时段限额下调规则，同时大幅提高Claude Opus模型的API速率限制。\n按照与SpaceX的协议，Anthropic可使用巨像1号（Colossus 1）数据中心的全部算力，一个月内即可新增超300兆瓦算力，配套超过22万张英伟达GPU。这些新增算力将直接惠及Claude Pro和Max订阅用户。\n除本次合作外，Anthropic还手握其他多项大型算力合作协议，包括与亚马逊达成的最高5吉瓦的合作（其中近1吉瓦的新增算力将于2026年底前落地），以及与谷歌、博通签订的5吉瓦算力协议正逐步上线。",

        {
          id: "7e8c63a6-ce3b-451f-98e2-72a816fd9092",
          title: "Google shuts down Project Mariner → 谷歌关闭“水手计划”",
          title_en: "Google shuts down Project Mariner",
          title_zh: "谷歌关闭“水手计划”",
          content_en:
            "Google has officially shut down Project Mariner, the company's experimental AI-powered web browsing agent that was designed to autonomously navigate websites and complete tasks on behalf of users. According to the report published by The Verge on May 6, 2026, the Project Mariner experiment, which originated from Google's research initiatives, will not continue as a standalone project. However, the technology and capabilities developed through Project Mariner have been integrated into Google's existing AI products. Specifically, the functionality and features pioneered in Project Mariner will continue to exist within Gemini Agent and AI Mode, which are components of Google's Gemini artificial intelligence platform. This integration represents Google's strategy to consolidate its experimental AI research into more mature, commercially available products. The shutdown marks the end of Project Mariner as an independent initiative while ensuring that the research and development work behind",
          content_zh:
            "谷歌已正式关停“水手项目”（Project Mariner），这是该公司旗下实验性AI驱动网页浏览代理，设计初衷是自主浏览网站，代用户完成各项任务。据科技媒体The Verge2026年5月6日发布的报道，源自谷歌研究项目的水手项目实验将不再作为独立项目推进。不过水手项目期间开发的技术与能力已被整合进谷歌现有AI产品中，具体而言，该项目首创的功能特性将继续留存于谷歌Gemini人工智能平台的两大组件——Gemini代理（Gemini Agent）和AI模式（AI Mode）当中。此次整合体现了谷歌将实验性AI研究并入更成熟商用产品的战略，本次关停标志着水手项目作为独立项目的终结，同时也保障了其背后的研发工作\n（注：原文此处内容不完整）",
          source: "verge",
          created_at: "2026-05-06T21:26:31.022107+00:00",
          original_url:
            "https://www.theverge.com/tech/925559/google-project-mariner-shut-down",
          categories: {
            id: "9126cc45-ac4c-42de-aca8-175d51351ab2",
            title: "tech",
            sort_order: 0,
          },
        },
      ];
    </script>
    <script>
      const SUPABASE_URL = 'https://fzxuotfihpbzozjoplim.supabase.co';
      const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6eHVvdGZpaHBiem96am9wbGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3OTM1MzMsImV4cCI6MjA5MTM2OTUzM30.pfhwZ7kv4CUy5PT_s62WzfIC3cHeXR2Z4YIXUjjqY1c';

      const app = document.getElementById('app');

      let titleLang = localStorage.getItem('titleLang') || 'zh';
      let contentLang = localStorage.getItem('contentLang') || 'zh';
      let currentTheme = localStorage.getItem('theme') || 'dark';
      let groupFilter = localStorage.getItem('groupFilter') || 'all';
      let categories = [];
      let displayedPosts = [];
      let currentOffset = 30;
      let hasMore = false;
      let isLoadingMore = false;

      function applyTheme() {
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('theme-label').textContent = currentTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
      }
      applyTheme();

      function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', currentTheme);
        applyTheme();
      }

      function setTitleLang(lang) {
        titleLang = lang;
        localStorage.setItem('titleLang', lang);
        currentOffset = 30;
        handleRoute();
      }

      function setContentLang(lang) {
        contentLang = lang;
        localStorage.setItem('contentLang', lang);
        handleRoute();
      }

      function setGroupFilter(grp) {
        groupFilter = grp;
        localStorage.setItem('groupFilter', grp);
        currentOffset = 30;
        handleRoute();
      }

      async function fetchCategories() {
        const response = await fetch(
          SUPABASE_URL + '/rest/v1/categories?select=id,title,sort_order&order=sort_order.asc',
          { headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY } }
        );
        if (!response.ok) throw new Error('Failed to fetch categories');
        return response.json();
      }

      function getPostIdFromHash() {
        const match = window.location.hash.match(new RegExp('^#/post/(.+)'));
        return match ? match[1] : null;
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      }

      function getDisplayTitle(post) {
        if (titleLang === 'en') return escapeHtml(post.title_en || post.title);
        if (titleLang === 'zh') return escapeHtml(post.title_zh || post.title_en || post.title);
        return escapeHtml(post.title);
      }

      function getDisplayContent(post) {
        const en = post.content_en || '';
        const zh = post.content_zh || '';
        if (contentLang === 'en') return en;
        if (contentLang === 'zh') return zh;
        if (en && zh) return zh + '\n---\n' + en;
        return zh || en;
      }

      function getDisplayExcerpt(post) {
        const en = post.content_en || '';
        const zh = post.content_zh || '';
        if (titleLang === 'en') return en.substring(0, 150);
        if (titleLang === 'zh') return zh.substring(0, 100);
        if (titleLang === 'all') {
          if (en && zh) return zh.substring(0, 80) + '\n\n📖 EN: ' + en.substring(0, 200);
          if (en) return en.substring(0, 280);
          if (zh) return zh.substring(0, 280);
        }
        return (zh || en).substring(0, 150);
      }

      function langToggleHtml(selected, onChange) {
        const langs = [{ code: 'zh', label: '中文' }, { code: 'en', label: 'EN' }, { code: 'all', label: 'All' }];
        return '<div class="lang-toggle">' +
          langs.map(l =>
            '<button class="' + (l.code === selected ? 'active' : '') + '" onclick="' + onChange + '(\'' + l.code + '\')">' + l.label + '</button>'
          ).join('') +
          '</div>';
      }

      function groupToggleHtml(selected, groups) {
        const filtered = groups.filter(g => g.title !== '科技');
        const items = [{ code: 'all', label: '全部' }, ...filtered.map(g => ({ code: g.title, label: g.title }))];
        return '<div class="lang-toggle">' +
          items.map(g =>
            '<button class="' + (g.code === selected ? 'active' : '') + '" onclick="setGroupFilter(\'' + g.code + '\')">' + g.label + '</button>'
          ).join('') +
          '</div>';
      }

      async function fetchPost(id) {
        // Try embedded data first
        const fromEmbed = window.__POSTS_DATA__ ? window.__POSTS_DATA__.find(p => p.id === id) : null;
        if (fromEmbed) return fromEmbed;
        // Fallback to network
        const response = await fetch(
          SUPABASE_URL + '/rest/v1/blog_posts?id=eq.' + id + '&select=*,categories(id,title)',
          { headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY } }
        );
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();
        return data[0] || null;
      }

      function getPostUrl(post) {
        if (post.original_url) return post.original_url;
        if (post.content) {
          const match = post.content.match(/https?:\/\/[^\s]+/);
          if (match) return match[0];
        }
        return null;
      }

      function goTo(path) { window.location.hash = path; }

      async function renderPost(id) {
        app.innerHTML = '<div class="loading">Loading...</div>';
        try {
          const post = await fetchPost(id);
          if (!post) {
            app.innerHTML = '<div class="post-detail"><div class="back-link" onclick="goTo(\'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</div><div class="error-msg">Post not found</div></div>';
            return;
          }
          const displayTitle = getDisplayTitle(post);
          const displayContent = getDisplayContent(post);
          const postUrl = getPostUrl(post);
          app.innerHTML = '<div class="post-detail"><div class="back-link" onclick="goTo(\'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</div>' + langToggleHtml(contentLang, 'setContentLang') + '<article><header class="post-header">' + (post.categories ? '<div class="post-category">' + escapeHtml(post.categories.title) + '</div>' : '') + '<h1 class="post-title">' + displayTitle + '</h1><div class="post-meta"><span>' + formatDate(post.created_at) + '</span></div></header><div class="post-body">' + (displayContent ? displayContent.split('\n').map(p => '<p>' + escapeHtml(p) + '</p>').join('') : '<p>No content available.</p>') + '</div>' + (postUrl ? '<a href="' + postUrl + '" target="_blank" class="post-url"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>Read Original</a>' : '') + '</article></div>';
        } catch (err) {
          app.innerHTML = '<div class="post-detail"><div class="back-link" onclick="goTo(\'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</div><div class="error-msg">Unable to load post</div></div>';
          console.error(err);
        }
      }

      function renderPosts(isLoadingMoreFlag) {
        if (displayedPosts.length === 0) {
          app.innerHTML = '<div class="site-header"><div class="site-meta">潮汐 Tides</div><h1 class="site-title">潮汐 <span>·</span> Tides</h1><p class="site-tagline">Stories &amp; Ideas · 故事与思想</p></div><div class="controls"><div class="toggles-row">' + groupToggleHtml(groupFilter, categories) + langToggleHtml(titleLang, 'setTitleLang') + '</div><button class="theme-toggle" onclick="toggleTheme()">Light Mode</button></div><div style="text-align:center;padding:80px 0;color:var(--text-tertiary);font-family:var(--font-mono);font-size:11px;">No posts yet</div>';
          return;
        }
        app.innerHTML = '<div class="site-header"><div class="site-meta">潮汐 Tides</div><h1 class="site-title">潮汐 <span>·</span> Tides</h1><p class="site-tagline">Stories &amp; Ideas · 故事与思想</p></div><div class="controls"><div class="toggles-row">' + groupToggleHtml(groupFilter, categories) + langToggleHtml(titleLang, 'setTitleLang') + '</div><button class="theme-toggle" onclick="toggleTheme()">Light Mode</button></div><ul class="posts-list">' + displayedPosts.map((post, i) => '<li class="post-item" style="animation-delay:' + (i * 0.07) + 's"><div class="post-link" onclick="goTo(\'/post/' + post.id + '\')"><div class="post-item-title">' + getDisplayTitle(post) + '</div><div class="post-item-meta">' + (post.categories ? '<span>' + escapeHtml(post.categories.title) + '</span>' : '') + (post.source ? '<span>' + escapeHtml(post.source.toUpperCase()) + '</span>' : '') + '<span class="dot"></span><span>' + formatDate(post.created_at) + '</span></div>' + (post.content_zh || post.content_en ? '<div class="post-item-excerpt">' + escapeHtml(getDisplayExcerpt(post).substring(0, 350)) + '</div>' : '') + '</div></li>').join('') + '</ul>' + (hasMore ? '<button class="more-btn' + (isLoadingMoreFlag ? ' loading' : '') + '" onclick="loadMore()" ' + (isLoadingMoreFlag ? 'disabled' : '') + '>' + (isLoadingMoreFlag ? 'Loading' : 'More') + '</button>' : '') + '</div>';
      }

      async function loadMore() {
        if (isLoadingMore || !hasMore) return;
        isLoadingMore = true;
        renderPosts(true);
        try {
          let url = SUPABASE_URL + '/rest/v1/blog_posts?select=*,categories(id,title,sort_order)&order=created_at.desc&limit=30&offset=' + currentOffset;
          if (groupFilter !== 'all') {
            url += '&categories.title=eq.' + encodeURIComponent(groupFilter);
          }
          const response = await fetch(url, { headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY } });
          const newPosts = await response.json();
          displayedPosts = [...displayedPosts, ...newPosts];
          hasMore = newPosts.length === 30;
          currentOffset += 30;
        } catch (err) { console.error(err); }
        isLoadingMore = false;
        renderPosts(false);
      }

      window.goTo = goTo;
      window.setTitleLang = setTitleLang;
      window.setContentLang = setContentLang;
      window.setGroupFilter = setGroupFilter;
      window.toggleTheme = toggleTheme;
      window.loadMore = loadMore;

      async function handleRoute() {
        const postId = getPostIdFromHash();
        if (postId) {
          await renderPost(postId);
        } else {
          try {
            if (categories.length === 0) {
              categories = await fetchCategories();
            }
            // Use embedded data only for "all" filter, otherwise fetch from API
            if (groupFilter !== 'all') {
              // Find category id by title, then filter by category_id
              const cat = categories.find(c => c.title === groupFilter);
              if (!cat) { displayedPosts = []; hasMore = false; renderPosts(); return; }
              const filterUrl = SUPABASE_URL + '/rest/v1/blog_posts?select=*,categories(id,title,sort_order)&category_id=eq.' + cat.id + '&order=created_at.desc&limit=30';
              const res = await fetch(filterUrl, { headers: { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY } });
              const data = await res.json();
              displayedPosts = data;
              hasMore = data.length === 30;
              currentOffset = 30;
            } else if (window.__POSTS_DATA__ && window.__POSTS_DATA__.length > 0) {
              // Use embedded data for "all"
              displayedPosts = window.__POSTS_DATA__.slice(0, 30);
              hasMore = window.__POSTS_DATA__.length === 30;
              currentOffset = 30;
            } else {
              displayedPosts = [];
              hasMore = false;
            }
            currentOffset = 30;
            renderPosts();
          } catch (err) {
            app.innerHTML = '<div class="site-header"><div class="site-meta">潮汐 Tides</div><h1 class="site-title">潮汐 <span>·</span> Tides</h1><p class="site-tagline">Stories &amp; Ideas · 故事与思想</p></div><div class="controls">' + langToggleHtml(titleLang, 'setTitleLang') + '<button class="theme-toggle" onclick="toggleTheme()">Light Mode</button></div><div class="error-msg">Unable to load posts. Please refresh.</div>';
          }
        }
      }

      window.addEventListener('hashchange', handleRoute);
      handleRoute();
    </script>
  </body>
</html>
