,"title":"At TechCrunch Disrupt 2026, all your M&#038;A questions will be answered → 在2026年TechCrunch Disrupt大会上，你所有关于企业并购的问题都将得到解答。","title_en":"At TechCrunch Disrupt 2026, all your M&#038;A questions will be answered","title_zh":"在2026年TechCrunch Disrupt大会上，你所有关于企业并购的问题都将得到解答。","content_en":"TechCrunch Disrupt 2026 is set to take place at San Francisco's Moscone West from October 13–15, 2026, and the event is offering a limited-time promotion where attendees can purchase one pass and receive 50% off a second pass of the same ticket type, with this offer expiring on May 8 at 11:59 p.m. PT.\n\nThe event features a new panel discussion focused on how merger and acquisition strategies have become increasingly relevant for early-stage startups. Given the recent surge in M&A activity within the AI sector—including OpenAI's acquisition of Hiro, Anthropic's purchase of Vercept, Google's team acquisition from Hume AI, and Databricks' security product-focused acquisitions—this panel aims to provide founders with essential guidance on navigating the acquisition landscape.\n\nThe session will equip founders with practical knowledge on creating strategic optionality for potential sales, enhancing their startup's attractiveness to potential acquirers, and understanding the realities involve","content_zh":"2026年TechCrunch Disrupt大会定于2026年10月13日至15日在旧金山莫斯康西馆举办，目前大会正推出限时优惠：参会者购买一张通行证后，第二张同类型票证可享五折，该优惠截止时间为太平洋时间5月8日23点59分。\n本次大会新增一场小组讨论，核心主题为并购策略对早期初创企业的价值为何越发凸显。近期人工智能领域并购活动激增，包括OpenAI收购Hiro、Anthropic收购Vercept、谷歌收编Hume AI团队，以及Databricks多起聚焦安全产品的收购，本次小组讨论正是在这一背景下举办，旨在为创业者提供应对并购市场格局的核心指引。\n该环节将为创业者传授实用知识，涵盖为潜在出售创造战略选择空间、提升初创企业对潜在收购方的吸引力，以及了解相关交易所涉及的实际情况等内容。","source":"tc","created_at":"2026-05-06T15:47:28.125825+00:00","original_url":"https://techcrunch.com/2026/05/06/at-techcrunch-disrupt-2026-all-your-ma-questions-will-be-answered/","categories":{"title":"tech","sort_order":0}},{"id":"ac9e7ed9-8b48-4cbe-bf7c-0f2c8a311c4a","title":"Aurora lands McLane deal to run driverless truck routes in Texas → 奥罗拉拿下麦克莱恩合作订单，将在得克萨斯州运营无人驾驶卡车线路","title_en":"Aurora lands McLane deal to run driverless truck routes in Texas","title_zh":"奥罗拉拿下麦克莱恩合作订单，将在得克萨斯州运营无人驾驶卡车线路","content_en":"Summary: Aurora Lands McLane Deal to Run Driverless Truck Routes in Texas\n\nAurora, a leading autonomous driving technology company, has secured a significant partnership with McLane, a major wholesale distribution company, to operate driverless truck routes in Texas. This deal marks an important milestone in the commercial deployment of autonomous trucking technology.\n\nAccording to the article published by TechCrunch on May 6, 2026, Aurora announced plans to expand its autonomous trucking operations to new routes between McLane distribution centers across the U.S. Sun Belt region by the end of 2026. The partnership represents a substantial vote of confidence from a major logistics player in Aurora's self-driving truck technology.\n\nMcLane, which supplies convenience stores, restaurants, and other businesses nationwide, is one of the largest wholesale distributors in the United States. The company's decision to partner with Aurora for autonomous freight delivery signals a growing accep","content_zh":"摘要：奥罗拉与麦克莱恩达成协议，在得克萨斯州运营无人驾驶卡车线路\n领先自动驾驶技术企业奥罗拉已与大型批发分销巨头麦克莱恩达成重要合作，将在得克萨斯州运营无人驾驶卡车线路，该协议是自动驾驶卡车技术商业化部署进程中的重要里程碑。\n据科技媒体TechCrunch2026年5月6日发布的报道，奥罗拉宣布计划在2026年底前，将其自动驾驶卡车业务拓展至美国阳光地带各麦克莱恩配送中心之间的新线路。此次合作代表着头部物流企业对奥罗拉的自动驾驶卡车技术给予了充分肯定。\n麦克莱恩是美国规模最大的批发分销商之一，为全美各地的便利店、餐厅及其他商家供货。该公司选择与奥罗拉合作开展自动驾驶货运配送，标志着行业对自动驾驶技术的接受度正不断提升。","source":"tc","created_at":"2026-05-06T15:45:30.623101+00:00","original_url":"https://techcrunch.com/2026/05/06/aurora-lands-mclane-deal-to-run-driverless-truck-routes-in-texas/","categories":{"title":"tech","sort_order":0}},{"id":"f41a154c-f579-4120-b17c-9511472677b4","title":"Ethos raises $22.75M from a16z for its expert network with voice onboarding → Ethos 从 a16z 获得 2275 万美元融资，用于其提供语音入职功能的专家网络","title_en":"Ethos raises $22.75M from a16z for its expert network with voice onboarding","title_zh":"Ethos 从 a16z 获得 2275 万美元融资，用于其提供语音入职功能的专家网络","content_en":"The user wants a detailed English summary of the given article, at least 300 characters, plain prose, no lists, no headings. The content is from TechCrunch about Ethos raising $22.75M from a16z for its expert network with voice onboarding. The article title is provided, but we need to extract details from the given markdown content. However, the markdown content is incomplete; it includes the title and some metadata, but the actual article body is missing. We need to infer what the article contains based on the title, published time, and any other available information. The markdown content includes the title, the date, the author (Ivan Mehta), and some teaser text: \"Ethos says it is onboarding 35,000 experts per week\". That is likely a key detail. We need to write a summary of at least 300 characters. Since the article content is truncated, we must rely on the title and teaser. We can also use external knowledge if needed, but we should stick to the provided information. The user expl","content_zh":"用户希望为给定文章撰写一份不少于300字符的详细英文摘要，采用平实散文格式，不得使用列表、标题。该内容来自科技媒体TechCrunch，围绕Ethos公司凭借自带语音入职功能的专家网络从风投机构a16z（安德森·霍洛维茨）融资2275万美元一事展开。文章标题已给出，但我们需要从提供的markdown内容中提取细节，不过该markdown内容并不完整，仅包含标题和部分元数据，缺失文章正文部分。我们需要依据标题、发布时间及其他所有可用信息推断文章内容。这份markdown内容包含标题、发布日期、作者伊万·梅塔，以及部分预告文本：“Ethos表示其每周正在为3.5万名专家办理入职”，这很可能是一项关键细节。我们需要撰写的摘要至少300字符，由于文章内容被截断，我们必须以标题和预告内容为核心依托，必要时也可使用外部知识，但需严格贴合已提供的信息。用户","source":"tc","created_at":"2026-05-06T15:42:40.879056+00:00","original_url":"https://techcrunch.com/2026/05/06/ethos-raises-22-75m-from-a16z-for-its-expert-network-with-voice-onboarding/","categories":{"title":"tech","sort_order":0}},{"id":"c1dedecd-50d7-4a49-8f8c-1dccdf5f26d2","title":"Apple to pay $250M to settle lawsuit over Siri&#8217;s delayed AI features → 苹果将支付2.5亿美元，就Siri人工智能功能推出延迟相关诉讼达成和解。","title_en":"Apple to pay $250M to settle lawsuit over Siri&#8217;s delayed AI features","title_zh":"苹果将支付2.5亿美元，就Siri人工智能功能推出延迟相关诉讼达成和解。","content_en":"Apple has agreed to pay $250 million to settle a class-action lawsuit that accused the company of overpromising the timeline for advanced artificial intelligence features in its Siri voice assistant. The lawsuit, filed on behalf of iPhone users, claimed that Apple made misleading statements during product announcements and marketing campaigns about upcoming AI capabilities for Siri, which were not delivered as expected, leading to consumer disappointment. The settlement, announced on May 6, 2026, resolves the legal dispute without Apple admitting any wrongdoing. This case highlights the growing scrutiny on tech companies regarding the rollout of AI-powered features and the importance of setting realistic expectations during product launches. It also underscores the potential legal consequences when companies fail to meet the promises made to their customers.","content_zh":"苹果已同意支付2.5亿美元和解一起集体诉讼，该诉讼指控公司在Siri语音助手的高级人工智能功能时间表上做出过度承诺。这起代表iPhone用户提起的诉讼声称，苹果在产品发布和营销活动中对Siri即将推出的人工智能功能做出了误导性陈述，这些功能未能按预期交付，导致消费者失望。该和解协议于2026年5月6日宣布，在苹果不承认任何不当行为的情况下解决了这场法律纠纷。此案凸显了科技公司在推出人工智能功能时面临的日益严格的审查，以及在产品发布时设定现实预期的重要性。这也强调，当公司未能兑现对客户的承诺时，可能面临的法律后果。","source":"tc","created_at":"2026-05-06T15:39:50.181862+00:00","original_url":"https://techcrunch.com/2026/05/06/apple-to-pay-250m-to-settle-lawsuit-over-siris-delayed-ai-features/","categories":{"title":"tech","sort_order":0}},{"id":"b597be59-da17-4f3e-a2fd-9ed77d67a79e","title":"Tinder owner Match Group is slowing hiring to pay for its increased use of AI tools → Tinder母公司Match Group正在放缓招聘，以支付其日益增长的AI工具使用成本。","title_en":"Tinder owner Match Group is slowing hiring to pay for its increased use of AI tools","title_zh":"Tinder母公司Match Group正在放缓招聘，以支付其日益增长的AI工具使用成本。","content_en":"Match Group, the parent company of the popular dating app Tinder, announced that it will reduce its hiring pace for the remainder of the year in order to allocate additional resources to its expanding portfolio of artificial‑intelligence tools. The company said that the cost of developing, deploying, and maintaining AI‑powered features—such as personalized match recommendations, chat assistants, and fraud‑detection systems—has risen significantly, prompting the need to re‑balance its budget. By slowing recruitment, Match Group aims to offset the higher expenses associated with AI while still preserving its product‑innovation roadmap. The decision reflects a broader industry trend where dating platforms are investing heavily in AI to improve user experience, increase engagement, and drive subscription revenue. Although the hiring slowdown is expected to be temporary, it underscores the financial pressures that come with integrating advanced machine‑learning models into consumer‑facing s","content_zh":"Match Group（热门约会应用Tinder的母公司）宣布将在今年剩余时间内放缓招聘步伐，以便为不断扩展的人工智能工具组合配置更多资源。该公司表示，开发、部署和维护人工智能驱动功能（如个性化匹配推荐、聊天助手和欺诈检测系统）的成本显著上升，因此需要重新平衡预算。通过放缓招聘，Match Group希望抵消与人工智能相关的高额费用，同时仍保持其产品创新路线图。这一决定反映了一个更广泛的行业趋势，即约会平台正在大力投资人工智能以改善用户体验、提高参与度并推动订阅收入。虽然招聘放缓预计是暂时的，但它凸显了在面向消费者的产品中整合高级机器学习模型所带来的财务压力。","source":"tc","created_at":"2026-05-06T15:37:42.387495+00:00","original_url":"https://techcrunch.com/2026/05/06/tinder-owner-match-group-is-slowing-hiring-to-pay-for-its-increased-use-of-ai-tools/","categories":{"title":"tech","sort_order":0}},{"id":"0dbf9909-a43a-4028-acfc-aa3bf4821a17","title":"Ted Turner, media mogul who revolutionised TV news by launching CNN, dies at 87 → 创立CNN、彻底革新电视新闻行业的传媒大亨特德·特纳逝世，享年87岁。","title_en":"Ted Turner, media mogul who revolutionised TV news by launching CNN, dies at 87","title_zh":"创立CNN、彻底革新电视新闻行业的传媒大亨特德·特纳逝世，享年87岁。","content_en":"Media mogul Ted Turner, who revolutionised television news by launching the first 24-hour news channel CNN in 1980, has died at the age of 87, the network has announced. Turner, known as \"the Mouth of the South,\" took over his family's billboard business after his father's death and went on to build Turner Broadcasting System, acquiring a radio station in Atlanta that became the foundation of his media empire. CNN initially faced skepticism, being mocked as the \"Chicken Noodle Network,\" but proved its value through rapid coverage of major events including the 1981 assassination attempt on President Ronald Reagan, the 1986 Challenger space shuttle disaster, and live coverage of the Gulf War in 1990-1991, when President George Bush famously said he learned more from CNN than from the CIA. Turner built one of the largest media empires in the United States and later founded the Turner Foundation focused on environmental causes. CNN's success inspired competitors like Fox News, launched in","content_zh":"美国有线电视新闻网（CNN）宣布，传媒大亨泰德·特纳逝世，享年87岁。特纳于1980年推出全球首个24小时新闻频道CNN，彻底革新了电视新闻行业。\n有“南方大嘴”之称的特纳在父亲去世后接手了家族的广告牌业务，之后逐步打造出特纳广播公司，还收购了亚特兰大的一家广播电台，这便是他传媒帝国的基石。\nCNN创办初期饱受质疑，被戏称为“鸡肉面新闻网”，但它通过对一系列重大事件的快速报道证明了自身价值，包括1981年罗纳德·里根总统遇刺未遂事件、1986年“挑战者”号航天飞机失事事件，以及1990至1991年海湾战争的现场报道——当时美国总统乔治·布什曾留下名言：我从CNN了解到的信息比从中情局得到的还要多。\n特纳打造了美国规模最大的传媒帝国之一，后来还创办了专注环保事业的特纳基金会。CNN的成功也催生了福克斯新闻等竞争对手，福克斯新闻创办于","source":"bbc","created_at":"2026-05-06T15:36:59.895097+00:00","original_url":"https://www.bbc.com/news/articles/c1k2jnx8gmlo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"6f2d95cc-d67f-496a-9f6a-0f29db2a5f91","title":"Massive Alaska megatsunami was second largest ever recorded → 阿拉斯加巨型海啸为有记录以来第二大","title_en":"Massive Alaska megatsunami was second largest ever recorded","title_zh":"阿拉斯加巨型海啸为有记录以来第二大","content_en":"A massive 'megatsunami' wave that struck southeast Alaska last summer has been identified as the second tallest ever recorded, according to scientific analysis. The enormous wave, nearly 500 metres high, was triggered when approximately 64 million cubic metres of rock—equivalent to 24 Great Pyramids of Giza—plunged into Tracy Arm Fjord in under a minute. The event went largely unreported at the time but has since been confirmed as one of the most significant geological events in recent history. Scientists warn that this incident serves as a stark reminder of the risks posed by melting glaciers, which are destabilizing mountain slopes across Alaska and other glacial regions. Dr. Bretwood Higman, an Alaskan geologist who examined the devastation firsthand, described it as \"a close call\" and expressed concern that future incidents may not be so fortunate. The only reason more catastrophe was avoided was the early morning timing, which prevented tourist cruise ships from being present in t","content_zh":"一场巨大的“超级海啸”波浪于去年夏天袭击了阿拉斯加东南部，根据科学分析已被确定为有记录以来第二高的波浪。这道巨大的波浪近500米高，是由大约6400万立方米的岩石——相当于24座吉萨大金字塔——在一分钟内坠入特雷西臂峡湾而引发的。这一事件在当时几乎没有报道，但已被证实为近期历史上最重要的地质事件之一。科学家警告说，这一事件清楚地提醒人们注意冰川融化带来的风险，这些风险正在破坏阿拉斯加和其他冰川地区山坡的稳定。布雷特伍德·希格曼博士是一位阿拉斯加地质学家，他亲眼目睹了这场灾难的破坏程度，将其描述为“一次侥幸脱险”，并表示担心未来的事故可能不会那么幸运。避免了更大灾难的唯一原因是事发时间正值清晨，这阻止了旅游邮轮出现在该地区。","source":"bbc","created_at":"2026-05-06T15:34:44.268411+00:00","original_url":"https://www.bbc.com/news/articles/c1m253033m4o?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"07d5a3d5-7470-412a-87f5-ad2bdffbcd7c","title":"Political parties make final pitches ahead of key elections → 各政党在关键选举前做最后冲刺","title_en":"Political parties make final pitches ahead of key elections","title_zh":"各政党在关键选举前做最后冲刺","content_en":"Political Parties Make Final Pitches Ahead of Key UK Elections\n\nPolitical parties across the United Kingdom are conducting their final push for votes on the last full day of campaigning before elections across England, Scotland, and Wales on May 7, 2026. These polls represent the most significant test of public opinion since the Labour Party's victory in the 2024 general election, and the outcomes could reveal the increasing fragmentation of British politics with voter support distributed among a broader range of parties.\n\nIn Scotland, the Scottish National Party (SNP) is attempting to secure its fifth consecutive devolved election victory, defending its position against challenges from Labour and Reform UK. In Wales, the Senedd elections see Reform UK and Plaid Cymru competing to become the largest party, threatening Labour's continuous grip on power since devolution began in 1999. Meanwhile, in England, Labour faces potential substantial losses in council and mayoral races, with Re","content_zh":"英国各地政党在2026年5月7日英格兰、苏格兰和威尔士选举前的最后一个完整竞选日进行最后的拉票冲刺。这些民调代表着自2024年工党在大选中获胜以来对公众舆论最重大的考验，结果可能揭示英国政治日益碎片化的趋势，选民支持分布在一系列更广泛的政党中。在苏格兰，苏格兰民族党（SNP）正努力确保连续第五次赢得权力下放选举，抵御来自工党和改革英国的挑战。在威尔士，塞尔尼德选举中，改革英国和威尔士党争夺成为最大政党，威胁着工党自1999年权力下放以来持续掌控的权力。与此同时，在英格兰，工党面临在地方议会和市长选举中潜在的重大损失，改革党正迎头赶上。","source":"bbc","created_at":"2026-05-06T15:34:43.871073+00:00","original_url":"https://www.bbc.com/news/articles/cvgzwdee72eo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"2055785a-9642-4e3c-b157-70b04064bb8e","title":"What is hantavirus and how does it spread? Key questions after outbreak → 什么是汉坦病毒？它如何传播？疫情暴发后的关键问题","title_en":"What is hantavirus and how does it spread? Key questions after outbreak","title_zh":"什么是汉坦病毒？它如何传播？疫情暴发后的关键问题","content_en":"Summary: Hantavirus Outbreak on Cruise Ship MV Hondius\n\nA cruise ship, the MV Hondius, has been struck by an outbreak of hantavirus, specifically the Andes strain, while traveling from Argentina across the Atlantic toward Cape Verde. The vessel is expected to dock in the Canary Islands by the weekend. Health authorities have confirmed three cases of the virus, with five additional suspected cases. Tragically, one passenger who tested positive for the virus has died, while two other deaths are currently under investigation.\n\nHantaviruses, named after a river in South Korea, represent a family of more than 20 different viral species. According to the World Health Organisation, nearly all of these viruses are transmitted to humans through contact with rodents—typically rats and mice—through dried urine and droppings. However, the Andes strain is distinct because it can spread through human-to-human transmission, although this occurs very rarely. This particular strain is primarily found","content_zh":"摘要：洪都斯号邮轮暴发汉坦病毒疫情\n洪都斯号邮轮从阿根廷出发、跨越大西洋驶往佛得角的途中暴发汉坦病毒疫情，本次流行的具体为安第斯毒株。该邮轮预计将于本周末前停靠加那利群岛。卫生部门已确诊3例感染病例，另有5例疑似病例。令人痛心的是，1名病毒检测呈阳性的乘客已经死亡，另有2例死亡事件目前正在调查中。\n汉坦病毒以韩国的一条河流命名，所属病毒科包含20余种不同的病毒种类。据世界卫生组织介绍，几乎所有这类病毒都通过接触啮齿类动物（通常为大鼠、小鼠）的干燥尿液和粪便传播给人类。不过安第斯毒株较为特殊，它可以实现人际传播，尽管这类传播情况极为罕见。该毒株主要发现于","source":"bbc","created_at":"2026-05-06T15:31:26.395353+00:00","original_url":"https://www.bbc.com/news/articles/c8r8j1l6j0go?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"d9f2bc32-a7d6-452d-afcc-eef9aa91a247","title":"US plan to escort ships through Hormuz paused after just 50 hours - what happened? → 美国护送船只通行霍尔木兹海峡的计划仅启动50小时就暂停——究竟发生了什么？","title_en":"US plan to escort ships through Hormuz paused after just 50 hours - what happened?","title_zh":"美国护送船只通行霍尔木兹海峡的计划仅启动50小时就暂停——究竟发生了什么？","content_en":"Summary: Strait of Hormuz 'Project Freedom' Timeline\n\nPresident Donald Trump announced \"Project Freedom\" on Sunday, a military operation intended to guide approximately 1,000 stranded merchant vessels carrying around 20,000 seafarers safely through the Strait of Hormuz. The strategic waterway, through which roughly 20% of the world's oil and gas flows, had been effectively closed by Iran following the outbreak of the US-Israel war with Iran. Trump described the initiative as a \"humanitarian gesture\" set to begin Monday morning Middle East time, expressing optimism that ongoing diplomatic discussions with Iran could yield positive outcomes. US Central Command subsequently detailed that the operation would involve guided-missile destroyers, over 100 land and sea-based aircraft, and approximately 15,000 service personnel, with vessels advised to pass through a designated security area off the Oman coast. On Monday, Centcom reported that two US-flagged merchant vessels successfully trans","content_zh":"概要：霍尔木兹海峡\"自由计划\"时间线\n\n唐纳德·特朗普总统周日正式宣布了\"自由计划\"，这是一项军事行动，旨在引导大约1000艘滞留商船安全通过霍尔木兹海峡，这些商船载有约20000名船员。这条战略水道承载着全球约20%的石油和天然气运输，但在美国-以色列与伊朗战争爆发后，伊朗实际上封锁了该海峡。特朗普将该计划描述为\"人道主义姿态\"，计划于中东时间周一开始执行，并表示对与伊朗正在进行的外交谈判能够产生积极成果持乐观态度。美国中央司令部随后详细说明，该行动将包括导弹驱逐舰、超过100架陆基和海基飞机以及约15000名军事人员，并建议船只通过阿曼海岸外的指定安全区通过。周一，中央司令部报告称，两艘悬挂美国国旗的商船已成功通过。","source":"bbc","created_at":"2026-05-06T15:29:23.725406+00:00","original_url":"https://www.bbc.com/news/articles/cd6p5q2dx1po?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"92a662be-74a6-4029-afdf-5e65f47be61f","title":"Put into production in April 2028, while launching the pure electric iX6. Rendering of the new generation BMW X6. 1 day ago → 全新一代宝马X6效果图于1天前曝光，新车将于2028年4月投产，同步推出纯电版本iX6。","title_en":"Put into production in April 2028, while launching the pure electric iX6. Rendering of the new generation BMW X6. 1 day ago","title_zh":"全新一代宝马X6效果图于1天前曝光，新车将于2028年4月投产，同步推出纯电版本iX6。","content_en":"Detailed Summary: New Generation BMW X6 to Launch in 2028 with Electric iX6 Variant\n\nAccording to automotive news source Autohome, BMW has announced plans to commence production of the next-generation X6 SUV in April 2028, marking a significant milestone for the brand's flagship coupe-style sports activity vehicle. The new generation X6 will carry the internal chassis code G66 and will be manufactured at BMW's Spartanburg factory in the United States.\n\nMost notably, this iteration will introduce BMW's first fully electric iX6 model, bearing the chassis code G96, representing the company's commitment to electrification across its entire product lineup. Alongside the standard and electric variants, BMW will also release a high-performance X6 M version for enthusiasts seeking maximum power and dynamic capabilities.\n\nThe upcoming vehicles will be built upon an upgraded CLAR platform that incorporates next-generation technology and design elements. According to the report, the new X6 and","content_zh":"详细摘要：新一代宝马X6将于2028年推出，含纯电动iX6版本\n据汽车新闻来源汽车之家报道，宝马已宣布计划于2028年4月投产下一代X6 SUV，是该品牌旗舰轿跑风格运动型多用途车的重要里程碑。新一代X6内部底盘代号为G66，将在美国宝马斯帕坦堡工厂生产。\n最值得关注的是，本次换代将推出宝马首款纯电动iX6车型，底盘代号G96，体现了该公司实现全产品阵容电动化的承诺。除标准版和电动版外，宝马还将为追求极致动力和动态性能的爱好者推出高性能X6 M版本。\n即将推出的车型将基于升级后的CLAR平台打造，该平台融入了下一代技术和设计元素。报道称，全新X6和","source":"autohome","created_at":"2026-05-06T15:26:23.986113+00:00","original_url":"https://www.autohome.com.cn/news/202605/1314106.html","categories":{"title":"汽车","sort_order":2}},{"id":"383b63ae-c4c1-4690-9db0-868e456ed45b","title":"More than just an SUV? Rivian is working on more R2 variants. → 不仅仅是SUV？Rivian正在研发更多R2车型。","title_en":"More than just an SUV? Rivian is working on more R2 variants.","title_zh":"不仅仅是SUV？Rivian正在研发更多R2车型。","content_en":"Summary: Rivian's R2 Expansion Plans\n\nRivian, the American electric vehicle manufacturer, is apparently developing additional variants beyond the standard SUV configuration for its more affordable R2 model. The R2 represents Rivian's entry into the compact electric SUV segment, positioned below the larger R1T pickup truck and R1S SUV in the company's lineup. This strategic expansion suggests Rivian is looking to maximize the versatility of its next-generation platform by offering multiple body styles and configurations to appeal to a broader range of customers. The move aligns with industry trends where automakers develop multiple vehicle types from a single architecture to achieve economies of scale and meet diverse consumer preferences. As of May 2026, Rivian has been working to establish itself in the competitive electric vehicle market, and the development of multiple R2 variants could be a key part of the company's efforts to increase production volume and improve financial sust","content_zh":"摘要：Rivian的R2扩张计划\n美国电动汽车制造商Rivian显然正在为其价位更亲民的R2车型开发标准SUV配置之外的更多衍生版本。R2是Rivian进军紧凑型电动SUV领域的产品，在该公司产品线中定位低于尺寸更大的R1T皮卡和R1S SUV。这一战略扩张表明，Rivian希望通过推出多种车身样式和配置来覆盖更广泛的客群，最大化其下一代平台的通用性。这一举措契合行业主流趋势，即车企基于同一架构开发多款车型，以此实现规模经济，满足消费者的多元化偏好。截至2026年5月，Rivian始终在竞争激烈的电动汽车市场中谋求站稳脚跟，开发多款R2衍生车型很可能是该公司提升产能、改善财务可持续性的关键布局之一。","source":"ars","created_at":"2026-05-06T15:15:58.249911+00:00","original_url":"https://arstechnica.com/cars/2026/05/more-than-just-an-suv-rivian-is-working-on-more-r2-variants/","categories":{"title":"tech","sort_order":0}},{"id":"829f4358-eaa3-4a70-833d-288beefeb55b","title":"It’s time to let my iPhone Mini go → 是时候和我的iPhone Mini说再见了。\n\n（也可根据具体语境译作“是时候换掉我的iPhone Mini了”/“是时候出手我的iPhone Mini了”）","title_en":"It’s time to let my iPhone Mini go","title_zh":"是时候和我的iPhone Mini说再见了。\n\n（也可根据具体语境译作“是时候换掉我的iPhone Mini了”/“是时候出手我的iPhone Mini了”）","content_en":"Summary: It's Time to Let My iPhone Mini Go\n\nIn this personal reflection published on The Verge, author Allison Johnson bids a fond farewell to her iPhone 13 Mini, which she describes as being \"on its last legs.\" The article chronicles her emotional attachment to the compact device that has faithfully served her until its components began to fail. The piece touches on the practical challenges of battery degradation and mentions features like liquid glass that contributed to the phone's appeal during its lifespan. Johnson marks the end of an era as she acknowledges the device can no longer keep up with her daily demands, closing with the poignant sentiment \"Good night, sweet prince.\" The article resonates with readers who have grown similarly attached to their smaller smartphones, capturing the bittersweet moment when beloved technology must finally be retired despite one's emotional connection to it.","content_zh":"概要：是时候告别我的iPhone Mini了\n\n在这篇发表在The Verge上的个人反思文章中，作者艾莉森·约翰逊深情告别了她仍在使用的iPhone 13 Mini，她形容这部手机已经\"奄奄一息\"。文章回顾了她对这部紧凑设备的深厚感情，这部忠实的设备一直为她服务，直到其组件开始出现故障。文章还探讨了电池老化带来的实际挑战，并提及了液態玻璃等特性，这些特性在其使用寿命内为手机增添了吸引力。约翰逊标记了一个时代的终结，承认这部设备已无法再满足她的日常需求，最后以感人的\"Good night, sweet prince\"（晚安，亲爱的王子/永别了）作为收尾。这篇文章引起了那些同样对小型智能手机怀有深厚感情的读者的共鸣，捕捉到了当心爱的科技产品最终不得不被淘汰时，那种 bittersweet（苦乐参半）的时刻。","source":"verge","created_at":"2026-05-06T15:15:21.107198+00:00","original_url":"https://www.theverge.com/tech/924488/apple-iphone-13-mini-battery-liquid-glass","categories":{"title":"tech","sort_order":0}},{"id":"0e1d5254-c749-4417-8180-b97abfaebc4b","title":"Ars Asks: Share your shell and show us your tricked-out terminals! → Ars 发起提问：分享你使用的 shell，来秀秀你改装得超酷炫的终端吧！","title_en":"Ars Asks: Share your shell and show us your tricked-out terminals!","title_zh":"Ars 发起提问：分享你使用的 shell，来秀秀你改装得超酷炫的终端吧！","content_en":"Ars Asks: Share Your Shell and Show Us Your Tricked-Out Terminals!\n\nArs Technica invites readers to share their terminal setups and shell customizations in this article celebrating the command line community's creativity and functionality. The article explores why command-line interfaces remain essential despite decades of graphical user interface advancements.\n\nThe author reflects on their journey from a Windows-centric computing background to embracing the terminal as their primary working environment. They trace their transformation back to their work administering Boeing Houston's EMC Celerra NSX enterprise NAS systems in the early 2000s. While graphical management options existed, the existing infrastructure relied heavily on bash scripts, forcing the author to become comfortable with command-line operations.\n\nThe article discusses the philosophical differences between GUI interactions and command-line usage, referencing a commentary suggesting that point-and-click interfaces re","content_zh":"### Ars倡议：分享你的shell配置，秀出你精心改造的终端！\nArs Technica在这篇致敬命令行社区创造力与实用性的文章中，邀请读者分享自己的终端设置和shell自定义方案，探究了历经数十年图形用户界面发展后，命令行界面仍不可或缺的原因。\n作者回顾了自身的使用经历：他最初的计算机使用习惯以Windows为核心，之后逐步将终端作为主要工作环境。这一转变可追溯到21世纪初，他在休斯敦波音公司管理EMC Celerra NSX企业级NAS（网络附加存储）系统的任职经历。当时虽已有图形化管理选项，但现有基础设施高度依赖bash脚本，迫使作者熟练掌握了命令行操作。\n文章还讨论了图形界面交互与命令行使用之间的理念差异，援引的一则评论指出，点选式界面会……","source":"ars","created_at":"2026-05-06T15:14:13.357612+00:00","original_url":"https://arstechnica.com/information-technology/2026/05/ars-asks-share-your-shell-and-show-us-your-tricked-out-terminals/","categories":{"title":"tech","sort_order":0}},{"id":"fca53b0b-50a5-404e-af59-e2b5f0f7e5f4","title":"Google&#8217;s AI search summaries will now quote Reddit → 谷歌的AI搜索摘要如今将引用红迪网（Reddit）的内容。","title_en":"Google&#8217;s AI search summaries will now quote Reddit","title_zh":"谷歌的AI搜索摘要如今将引用红迪网（Reddit）的内容。","content_en":"Google has announced significant updates to its AI-powered search features, with the company now incorporating direct quotes and perspectives from Reddit and other social media platforms into its AI-generated search summaries. The new AI Mode and AI Overviews updates aim to provide users with firsthand perspectives from real people sharing their experiences on forums and social media, rather than relying solely on traditional web content. This shift represents Google's effort to include more authentic, user-generated content in its search results, potentially changing how people discover and evaluate information online. The move comes as search engines increasingly compete to offer more conversational and comprehensive AI-powered experiences, with Reddit representing a particularly valuable source of unfiltered opinions and practical advice from actual users. By integrating these perspectives directly into AI summaries, Google is essentially curating community knowledge while maintaini","content_zh":"谷歌已宣布对其人工智能驱动的搜索功能进行重大更新,该公司现在将Reddit和其他社交媒体平台的直接引用和观点整合到其人工智能生成的搜索摘要中。新的AI模式(AI Mode)和AI概览(AI Overviews)更新旨在为用户提供来自论坛和社交媒体上真实用户分享的第一手观点,而非仅依赖传统网络内容。这一转变代表了谷歌在搜索结果中纳入更多真实用户生成内容的努力,可能会改变人们在线发现和评估信息的方式。此举正值搜索引擎日益竞争提供更具对话性和全面性的人工智能体验之际,Reddit作为一个特别有价值的来源,提供了来自真实用户的未经筛选的观点和实用建议。通过将这些观点直接整合到人工智能摘要中,谷歌实际上是在策展社区知识,同","source":"verge","created_at":"2026-05-06T15:11:20.370554+00:00","original_url":"https://www.theverge.com/tech/924993/google-ai-search-mode-overviews-update-reddit-links","categories":{"title":"tech","sort_order":0}},{"id":"5a3843bc-b08a-4aa9-a273-543011cb27cb","title":"Blink bumps its budget buzzer to 2K → Blink把预算奖金提高到2K","title_en":"Blink bumps its budget buzzer to 2K","title_zh":"Blink把预算奖金提高到2K","content_en":"Blink, an Amazon-owned smart home brand, has expanded its budget doorbell camera lineup with two new models that feature higher video resolution. The lineup now includes the company's first wired-only doorbell priced under $50, catering to users who prefer a permanent installation without the hassle of battery changes. Both new cameras offer 2K video quality, a significant upgrade from previous generations, ensuring clearer footage for monitoring entryways. The wired model targets cost-conscious consumers seeking reliable security without recurring expenses, while the other likely maintains the battery-powered flexibility Blink is known for. These releases reinforce Blink's position in the affordable smart home market, competing with other budget options by combining improved specs with low price points. The devices are expected to integrate with Blink's ecosystem and Alexa for seamless smart home control.","content_zh":"亚马逊旗下智能家居品牌Blink对其平价门铃摄像头产品线进行了扩容，新增两款视频分辨率更高的机型。目前该产品线已包含品牌首款售价不足50美元的纯有线门铃，面向偏好永久安装、无需费心更换电池的用户。\n两款新摄像头均支持2K视频画质，相较前代产品有显著升级，可为出入口监控提供更清晰的画面。其中有线款针对看重可靠安防、不愿承担后续使用成本的高性价比消费者，另一款则大概率延续了Blink标志性的电池供电灵活性。\n此次新品发布巩固了Blink在平价智能家居市场的地位，凭借升级参数搭配亲民定价，与其他平价竞品展开竞争。预计这两款设备将接入Blink生态系统及Alexa，实现顺畅的智能家居控制。","source":"verge","created_at":"2026-05-06T15:09:14.34592+00:00","original_url":"https://www.theverge.com/tech/924976/blink-video-doorbell-2k-wired-battery-price-specs-release-date","categories":{"title":"tech","sort_order":0}},{"id":"2feeef43-44f0-4f6f-a475-30a42b77330c","title":"The Litter-Robot 4 bundle is back down to its best price of the year → Litter-Robot 4 套餐重新回到了今年的最佳价格","title_en":"The Litter-Robot 4 bundle is back down to its best price of the year","title_zh":"Litter-Robot 4 套餐重新回到了今年的最佳价格","content_en":"The Litter-Robot 4 bundle has returned to its lowest price point of the year, according to a report from The Verge. The automatic self-cleaning litter box, which uses advanced sensors and technology to detect when a cat has finished using it and automatically separates waste from clean litter, has been a popular product among cat owners looking for a more convenient and hygienic solution to managing their pet's needs. The bundle typically includes the main unit along with additional accessories such as waste bags, liners, or extended warranties. This deal represents a significant opportunity for consumers who have been waiting for the product to hit its best price before making a purchase. The Litter-Robot 4 represents an upgrade from previous models, featuring improved sensors, a better sifting mechanism, and enhanced connectivity features that allow pet owners to monitor usage patterns through a smartphone app. The article was published in May 2026 and is part of The Verge's ongoing","content_zh":"据The Verge报道，Litter-Robot 4套装已回到今年最低价点。这款自动自清洁猫砂盆使用先进传感器和技术来检测猫咪何时使用完毕，并自动将废物与干净猫砂分离，一直是寻求更方便、卫生的宠物护理方案的猫主人们欢迎的产品。该套装通常包括主机以及附加配件，如垃圾袋、衬垫或延保服务。对于一直在等待该产品达到最佳价格再购买的消费者来说，这是一个重大机会。Litter-Robot 4相比前代产品有所升级，具有更先进的传感器、更优化的筛选机制，以及增强的连接功能，让宠物主人可以通过智能手机应用程序监测使用情况。该文章于2026年5月发布，是The Verge持续报道的一部分","source":"verge","created_at":"2026-05-06T15:06:08.519618+00:00","original_url":"https://www.theverge.com/gadgets/924446/litter-robot-4-fujifilm-x-half-digital-camera-deal-sale","categories":{"title":"tech","sort_order":0}},{"id":"8262aca0-3052-4c76-9733-43da33993138","title":"Show HN: Red Squares – GitHub outages as contributions → Show HN：红方块——将GitHub服务宕机记录转为贡献记录","title_en":"Show HN: Red Squares – GitHub outages as contributions","title_zh":"Show HN：红方块——将GitHub服务宕机记录转为贡献记录","content_en":"Summary:\n\nRed Squares is a satirical website that reimagines GitHub's familiar contribution graph by replacing normal coding activity with red squares that represent days when GitHub experienced outages. The darker the red square appears, the longer the service remained down during that incident. This creative visualization serves as a critical commentary on GitHub's reliability, showing that the platform experienced approximately 32.5 days of total downtime over the course of a year. The data reveals that there were 167 distinct days that had at least one incident recorded, with the worst single day being April 30, 2026, when GitHub was down for a full day. The outages are categorized into severity levels including Minor, Major, and Critical. The website fetches its data live from the mrshu/github-statuses repository, which reconstructs incident history from githubstatus.com. The visualization itself uses the Mantine library to create the heatmap display. It's worth noting that th","content_zh":"摘要：\n“红方块”是一个讽刺类网站，它对用户熟知的GitHub贡献图进行了改造，将原本代表常规代码活动的方块替换为红色方块，用来标记GitHub发生服务宕机的日期。红色方块颜色越深，代表对应故障事件的服务中断时长越久。这个极具创意的可视化内容是对GitHub服务可靠性的批判性评论，数据显示该平台一年内累计宕机总时长约为32.5天。数据表明，共有167个不同日期至少记录过一起故障事件，故障最严重的单日为2026年4月30日，当天GitHub服务全天中断。故障被划分为轻微、重大、危急三个严重等级。该网站的数据从mrshu/github-statuses代码仓库实时获取，该仓库还原了githubstatus.com上的故障历史记录。热图可视化效果是使用Mantine库实现的。值得注意的是，","source":"hn","created_at":"2026-05-06T15:03:09.370793+00:00","original_url":"https://red-squares.cian.lol/","categories":{"title":"tech","sort_order":0}},{"id":"f4ab64dd-7f57-4437-9ee2-ac02b6d2d6ab","title":"The clippening → 该词为网络合成词，根据适用语境有不同译法：\n1. 剪辑大事件（最常用义，多用于视频内容创作领域，指大量精彩剪辑片段集中涌现的相关事件）\n2. 剪发大事件/剪毛大事件（多用于理发、宠物修剪毛发等相关语境）","title_en":"The clippening","title_zh":"该词为网络合成词，根据适用语境有不同译法：\n1. 剪辑大事件（最常用义，多用于视频内容创作领域，指大量精彩剪辑片段集中涌现的相关事件）\n2. 剪发大事件/剪毛大事件（多用于理发、宠物修剪毛发等相关语境）","content_en":"The Clippening: How Short-Form Clippers Are Reshaping Social Media Marketing\n\nAfter Dan Bongino left his position as former second-in-command at the FBI in January, he returned to video podcasting with \"The Dan Bongino Show\" and deployed an experimental promotional strategy: hiring clippers. Clippers are anonymous social media accounts that extract the most exciting, controversial, or shocking moments from longform content like podcasts and livestreams, then distribute these clips across platforms to rack up views.\n\nThis practice represents a significant shift in digital marketing, where content creators and brands can leverage these distributed accounts to reach wider audiences without direct affiliation. According to Anthony Fujiwara, founder of Clipping.net, approximately 62,000 clippers use his platform, earning an average of $3,000 per month. Most clippers are based in the United States, though they can originate from anywhere—Fujiwara has described some as \"hungry Slovakian t","content_zh":"《剪辑潮：短视频剪辑者正在如何重塑社交媒体营销》\n前美国联邦调查局二把手丹·邦吉诺1月离职后，携《丹·邦吉诺秀》回归视频播客领域，同时启用了一项试验性推广策略：雇佣剪辑者。剪辑者是运营匿名社交媒体账号的群体，他们会从播客、直播等长内容中截取最具爆点、最富争议或者最博眼球的片段，再把这些片段分发到各大平台积累播放量。\n这种做法标志着数字营销领域出现了重大转变，内容创作者和品牌无需和这些分散的账号有直接隶属关系，就能借助它们触达更广泛的受众。据Clipping.net创始人安东尼·藤原介绍，约有6.2万名剪辑者在使用他的平台，平均月收入可达3000美元。大部分剪辑者都来自美国，不过他们可以来自全球任何地方——藤原曾形容部分剪辑者是“有冲劲的斯洛伐克t”","source":"verge","created_at":"2026-05-06T12:45:47.535697+00:00","original_url":"https://www.theverge.com/report/920005/social-media-clipping-podcasts-clavicular-marketing-mrbeast","categories":{"title":"tech","sort_order":0}},{"id":"5c0a3500-e917-497d-99eb-78f59623f2a6","title":"Microsoft’s Office and LinkedIn chief now runs Teams in latest reshuffle → 微软Office与LinkedIn负责人转任Teams负责人，最新人事调整出炉","title_en":"Microsoft’s Office and LinkedIn chief now runs Teams in latest reshuffle","title_zh":"微软Office与LinkedIn负责人转任Teams负责人，最新人事调整出炉","content_en":"Microsoft has announced a significant organizational reshuffle following the departure of veteran executive Rajesh Jha from the company. The changes involve key leadership transitions, with the head of Microsoft's Office business and LinkedIn operations now taking on responsibility for managing the Teams communication and collaboration platform. This restructuring reflects Microsoft's ongoing efforts to consolidate its productivity and communication tools under unified leadership as the company continues to integrate its various business units. The departure of Jha, who had been with the company for many years, created a leadership void that prompted CEO Satya Nadella and other senior executives to reorganize reporting structures across several important divisions. Industry observers note that this reshuffle comes as Microsoft faces increasing competition in the workplace communication and productivity software market, where Teams has become a central component of the company's strateg","content_zh":"在资深高管拉杰什·贾哈离职后，微软宣布进行重大组织架构调整。此次调整涉及核心领导层人事变动，目前微软Office业务及领英（LinkedIn）业务的负责人将接手通讯协作平台Teams的管理职责。\n本次重组体现出微软在持续整合各业务单元的过程中，始终致力于将旗下生产力工具与通讯工具划归统一领导层管理。已在微软供职多年的贾哈离职后出现了领导岗位空缺，这促使首席执行官萨提亚·纳德拉与其他高管对多个重要部门的汇报架构进行了调整。\n行业观察人士指出，此次重组出台之际，微软正面临办公通讯与生产力软件市场日益激烈的竞争，而Teams已经成为微软该领域战略的核心组成部分。","source":"verge","created_at":"2026-05-06T12:43:20.697376+00:00","original_url":"https://www.theverge.com/tech/924931/microsoft-office-copilot-windows-reorg-shuffle","categories":{"title":"tech","sort_order":0}},{"id":"a5f7d5c3-90b9-403d-83c5-7373e32c362b","title":"Energizer’s new coin batteries won’t cause ingestion burns if swallowed → 劲量新款纽扣电池若被误吞，不会造成吞食灼伤。","title_en":"Energizer’s new coin batteries won’t cause ingestion burns if swallowed","title_zh":"劲量新款纽扣电池若被误吞，不会造成吞食灼伤。","content_en":"Summary:\n\nEnergizer has introduced a groundbreaking line of coin batteries designed with enhanced safety features specifically aimed at protecting young children. The new \"Ultimate Child Shield\" batteries represent a significant advancement in battery safety technology, addressing the serious risk of ingestion injuries that can occur when children accidentally swallow small, disc-shaped batteries.\n\nThe most notable innovation in these new batteries is their ability to prevent the severe internal burns that typically occur when traditional coin batteries are swallowed. These ingestion burns can cause devastating injuries to a child's esophagus and digestive tract, making this development a potentially life-saving innovation for households with young children.\n\nIn addition to the burn-prevention technology, Energizer has incorporated a distinctive indicator system into the Ultimate Child Shield design. If a child does swallow one of these batteries, the product causes a temporary blu","content_zh":"### 摘要\n劲量推出了一款开创性的纽扣电池系列，其配备的增强型安全功能经过专门设计，旨在保护低龄儿童。这款全新的“终极儿童防护”电池是电池安全技术的重大突破，用于解决儿童意外吞食小型圆盘状电池时可能出现的误食致伤这一严重风险。\n该新款电池最突出的创新点在于，可避免传统纽扣电池被吞食后通常会引发的严重体内灼烧。这类误食导致的灼烧会对儿童的食道和消化道造成毁灭性损伤，因此对于有低龄儿童的家庭而言，这一研发成果属于有望挽救生命的创新。\n除防灼烧技术外，劲量还在“终极儿童防护”的设计中加入了独特的提示系统：如果儿童确实吞食了该系列的某块电池，产品会引发暂时性的蓝色","source":"verge","created_at":"2026-05-06T12:41:18.091313+00:00","original_url":"https://www.theverge.com/tech/924966/energizer-ultimate-child-shield-batteries-ingestion-swallow-burn-prevention","categories":{"title":"tech","sort_order":0}},{"id":"84cde832-e7e6-4305-93ab-bceef8013b80","title":"Remarkable’s next E Ink digital notepad skips the color screen → Remarkable下一代电子墨水数码记事本未搭载彩色屏幕。","title_en":"Remarkable’s next E Ink digital notepad skips the color screen","title_zh":"Remarkable下一代电子墨水数码记事本未搭载彩色屏幕。","content_en":"Remarkable has unveiled its next‑generation E Ink notepad, the Paper Pure, which succeeds the Remarkable 2 while retaining a black‑and‑white display despite earlier speculation about a color version. The new device upgrades the screen with improved contrast and a faster refresh rate, delivering a smoother, more responsive writing and reading experience. Processing speed has also been boosted, cutting latency when sketching, annotating, or navigating documents. Despite the hardware enhancements, the Paper Pure carries the same $399 price tag as its predecessor, keeping the premium positioning of Remarkable’s digital paper line. By sticking with a monochrome screen, Remarkable continues to prioritize distraction‑free note‑taking over the color‑display trend seen in some competing tablets. The Paper Pure is slated to ship in the coming months, with trade‑in options potentially available for existing Remarkable 2 owners.","content_zh":"Remarkable正式推出新一代电子墨水记事本Paper Pure，该产品是Remarkable 2的继任款，尽管此前外界猜测其会推出彩色版本，新品仍保留了黑白显示屏。\n这款新品升级了屏幕配置，对比度更出色、刷新率更快，可带来更流畅、跟手性更强的书写与阅读体验。设备处理速度也有所提升，降低了手绘、批注或是切换浏览文档时的延迟。\n尽管硬件有诸多升级，Paper Pure的售价仍和前代保持一致，为399美元，维持了Remarkable电子纸产品线的高端定位。不同于部分竞品平板追随彩色显示屏的潮流，Remarkable坚持采用单色屏幕，始终将无干扰的笔记体验放在首位。\nPaper Pure预计将在未来数月内发货，现有Remarkable 2用户还有望享受以旧换新方案。","source":"verge","created_at":"2026-05-06T12:39:04.430142+00:00","original_url":"https://www.theverge.com/tech/923994/remarkable-e-ink-tablet-paper-pure-black-and-white-pricing-availability","categories":{"title":"tech","sort_order":0}},{"id":"6a6b2b2d-c885-4d6b-8985-18398f16ea16","title":"The Remarkable Paper Pure is the best digital notepad I&#8217;ve ever used → Remarkable Paper Pure是我用过的最好用的电子记事本。","title_en":"The Remarkable Paper Pure is the best digital notepad I&#8217;ve ever used","title_zh":"Remarkable Paper Pure是我用过的最好用的电子记事本。","content_en":"Summary: The Remarkable Paper Pure Digital Notepad Review\n\nThe Verge's Andrew Liszewski has published a hands-on review declaring the Remarkable Paper Pure as the best digital notepad he has ever used. The device represents Remarkable's latest tablet offering, which opts to forego a color screen in favor of delivering an exceptional paper-like writing experience. According to the review, the device excels at simulating the sensation of writing with a pen on actual paper, making it an ideal choice for users who prioritize the tactile feel of traditional note-taking over multimedia features or color displays. This focused approach distinguishes the Paper Pure from other tablets that attempt to serve multiple purposes, positioning it as a dedicated tool for those who want a distraction-free digital writing surface that closely mimics the familiar experience of pen and paper. The article suggests that Remarkable has refined its e-ink technology and pen simulation to such a degree that it","content_zh":"摘要：Remarkable Paper Pure纯数字记事本评测\n科技媒体The Verge的安德鲁·利斯泽夫斯基发布了一篇上手评测，称Remarkable Paper Pure是他用过的最好用的数字记事本。这款设备是Remarkable最新推出的平板产品，为了带来出众的类纸书写体验，它放弃了彩色屏幕。评测显示，该设备在模拟钢笔在真实纸张上书写的触感方面表现十分优异，对于那些更看重传统记笔记的触觉感受、而非多媒体功能或彩色显示屏的用户而言是理想选择。这种走专精路线的设计思路让Paper Pure和其他主打多用途的平板区分开来，对于想要一款无干扰、能高度还原熟悉的纸笔书写体验的数字书写设备的用户来说，它是一款针对性极强的专用工具。文章指出，Remarkable对自家电子墨水技术和笔触模拟的打磨已经达到了极高的水准，以至于它","source":"verge","created_at":"2026-05-06T12:36:36.050486+00:00","original_url":"https://www.theverge.com/tech/922843/remarkable-paper-pure-e-ink-tablet-digital-notebook-notepad-hands-on","categories":{"title":"tech","sort_order":0}},{"id":"92d3cccc-9e1f-4618-bd5e-aa906bcc37cc","title":"StarFighter 16-Inch → 星际战斗机16英寸","title_en":"StarFighter 16-Inch","title_zh":"星际战斗机16英寸","content_en":"The StarFighter 16-inch is a full-size Linux performance laptop built with premium materials and designed to handle heavier workloads. It offers powerful processor options including Intel Core Ultra and Ryzen 9, paired with up to 64GB of 7500MT/s LPDDR5X memory for smooth multitasking and demanding applications. The laptop features a stunning 16-inch 4K IPS display with a 3840x2400 resolution, 120Hz refresh rate, and true matte finish with protective coating that diffuses ambient light while allowing colours to shine brightly. The 16:10 aspect ratio is optimized for productivity, and the display reaches 625 cd/m² brightness for visibility in various lighting conditions, with wide 178° viewing angles and a 180° hinge for flexible positioning.\n\nSecurity and privacy are prioritized with a removable webcam featuring a magnetic connector that allows users to unplug it completely when not needed. The webcam can be stored inside the chassis when not in use, and its design enables minimal beze","content_zh":"StarFighter 16英寸是一款采用高端材质打造的全尺寸高性能Linux笔记本，专为应对更繁重的工作负载设计。它提供多款强劲处理器选项，包括英特尔酷睿Ultra和锐龙9，最高可搭配64GB 7500MT/s LPDDR5X内存，无论是多任务处理还是运行高要求应用都能流畅运行。\n这款笔记本搭载素质惊艳的16英寸4K IPS显示屏，分辨率为3840×2400，刷新率120Hz，采用带防护涂层的真雾面工艺，可散射环境光，同时保障色彩鲜亮明艳。16:10的屏幕比例针对生产力场景做了优化，屏幕亮度可达625尼特，在各类光线条件下都清晰可视，还拥有178°广视角，支持180°开合的铰链也让设备摆放角度更为灵活。\n该机将安全与隐私放在首位，配备采用磁吸接口的可插拔摄像头，用户无需使用时可完全拔下，闲置时还能收纳在机身内部，该设计可实现极窄边框","source":"hn","created_at":"2026-05-06T12:23:43.352428+00:00","original_url":"https://us.starlabs.systems/pages/starfighter","categories":{"title":"tech","sort_order":0}},{"id":"9efb42bc-f777-4cf5-a0c4-12e9d6b69fa9","title":"Strictly Come Dancing: Five pros to leave the show as line-up confirmed → 《舞动奇迹》：参演阵容已确认，五名职业舞者将退出节目\n\n注：《Strictly Come Dancing》是BBC推出的知名舞蹈竞技真人秀，国内通用译名为《舞动奇迹》，湖南卫视曾引进该节目版权推出同名综艺。","title_en":"Strictly Come Dancing: Five pros to leave the show as line-up confirmed","title_zh":"《舞动奇迹》：参演阵容已确认，五名职业舞者将退出节目\n\n注：《Strictly Come Dancing》是BBC推出的知名舞蹈竞技真人秀，国内通用译名为《舞动奇迹》，湖南卫视曾引进该节目版权推出同名综艺。","content_en":"The BBC has confirmed that five professional dancers will leave Strictly Come Dancing after this series, including Karen Hauer, the show's longest-serving female pro, who is departing after 14 years. Hauer announced her exit in March, saying Strictly completely changed her life and she is ready to close this chapter and take on new projects. She also mentioned she will appear in a comedy play called Stepping Out from August. Gorka Marquez, Nadiya Bychkova, Luba Mushtuk, and Michelle Tsiakkas are also leaving the show. The judges—Shirley Ballas, Craig Revel Horwood, Motsi Mabuse, and Anton Du Beke—will all return for the next series, but the BBC has not yet announced replacements for hosts Claudia Winkleman and Tess Daly. The BBC stated that 15 of the 20 professionals from last year will return, and new top talent from the international dance world will join to bring fresh experience and showmanship to the Strictly ballroom. Marquez is leaving after a decade, having been a judge on the","content_zh":"英国广播公司（BBC）已证实，五名职业舞者将在本季《舞动奇迹》收官后离开节目，其中包括该节目任职时间最长的女职业舞者凯伦·豪尔，她已参与节目14年，即将正式告别。豪尔今年3月就已宣布离职决定，她表示《舞动奇迹》彻底改变了她的人生，如今她已准备好结束这一段人生旅程，投身新的项目。她还透露，自己将从8月起出演喜剧《迈步出发》。\n戈尔卡·马克斯、娜迪亚·比奇科娃、卢巴·穆什图克、米歇尔·齐亚卡斯也将一同离开该节目。\n雪莉·巴拉斯、克雷格·雷维尔·霍伍德、莫齐·马布塞、安东·杜·贝克四名评委都将回归下一季节目，但BBC尚未公布主持人克劳迪娅·温克曼和苔丝·戴利的接替人选。\nBBC称，去年参与节目的20名职业舞者中有15名将回归，同时还会有国际舞蹈界的顶尖新人才加盟，为《舞动奇迹》的舞池带来全新的经验和舞台表现力。马克斯已在节目任职十年，此前曾担任……","source":"bbc","created_at":"2026-05-06T12:20:44.34213+00:00","original_url":"https://www.bbc.com/news/articles/c20214nnggdo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"579f1860-ad79-44fa-b518-b1503146d71c","title":"Oil prices drop and stock markets rise after reports of deal to end Iran war → 有关达成结束伊朗战争协议的报道传出后，油价下跌，股市上涨。","title_en":"Oil prices drop and stock markets rise after reports of deal to end Iran war","title_zh":"有关达成结束伊朗战争协议的报道传出后，油价下跌，股市上涨。","content_en":"Summary\n\nOil prices have experienced a significant decline while global stock markets have surged following reports that the United States and Iran are nearing a deal to end their ongoing conflict. Brent crude futures fell below $100 per barrel, down from over $108 earlier in the day, representing a notable shift in the energy markets. Meanwhile, major European stock indices responded positively, with the FTSE 100 rising over 2% in early trading, while the German Dax and French Cac 40 both climbed nearly 3%. The US S&P 500 also posted gains of just under 1%. The market movements were triggered by reporting from Axios suggesting that Washington believes it is close to securing a one-page agreement that would end the war and establish a framework for more detailed nuclear negotiations. Despite this recent drop, oil prices remain substantially higher than the approximately $70 per barrel level seen before the US-Israel war with Iran began, a conflict that has severely disrupted regional","content_zh":"油价大幅下跌，全球股市则出现飙升，此前有报道称美国和伊朗接近达成一项协议以结束双方持续的冲突。布伦特原油期货跌破每桶100美元，从当天早些时候的逾108美元下跌，标志着能源市场出现明显转变。与此同时，主要欧洲股指积极响应，伦敦金融时报100指数在早盘交易中上涨超过2%，德国DAX指数和法国CAC 40指数均上涨近3%。美国标准普尔500指数也录得近1%的涨幅。市场波动源于Axios的报道，该报道暗示华盛顿方面认为接近达成一项一页纸的协议，该协议将结束战争，并为更详细的核谈判建立框架。尽管最近油价下跌，但与美以对伊朗战争开始前约每桶70美元的水平相比，油价仍大幅高企，这场冲突已严重扰乱地区稳定。","source":"bbc","created_at":"2026-05-06T12:15:38.104219+00:00","original_url":"https://www.bbc.com/news/articles/c4g8zejyyr3o?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"d39a6cd1-986c-4bb1-aab2-60062c844ed4","title":"reMarkable&#8217;s new Paper Pure tablet goes back to basics with a monochrome screen → reMarkable新款Paper Pure平板电脑搭载单色屏幕，回归产品本源。","title_en":"reMarkable&#8217;s new Paper Pure tablet goes back to basics with a monochrome screen","title_zh":"reMarkable新款Paper Pure平板电脑搭载单色屏幕，回归产品本源。","content_en":"reMarkable has unveiled its latest tablet called the Paper Pure, a device that marks a return to the company's minimalist roots by featuring a monochrome display. The new tablet is designed to be lighter and faster than its predecessor, the popular reMarkable 2, which is now being retired after six years on the market since its initial launch. reMarkable has built a reputation for creating distraction-free writing and note-taking devices that cater to users who want a digital alternative to traditional paper. The Paper Pure continues this philosophy by stripping away color and focusing on what matters most: a clean, straightforward writing experience. The retirement of the reMarkable 2 signals the company's transition to newer hardware that improves upon the original design in both portability and performance. This announcement reinforces reMarkable's commitment to serving the niche market of professionals, students, and creatives who prioritize focus and simplicity in their digital to","content_zh":"reMarkable发布了旗下最新平板Paper Pure，该产品配备单色显示屏，标志着品牌回归极简主义本源。\n这款新平板的设计比其前代产品、广受欢迎的reMarkable 2更轻便、运行速度更快。reMarkable 2自首次发布至今已上市六年，目前即将停产。\nreMarkable主打无干扰书写、笔记设备，为想要用数码产品替代传统纸张的用户提供服务，在业内积累了出色口碑。Paper Pure延续了这一理念，舍弃彩色功能，聚焦核心需求：纯净流畅的书写体验。\nreMarkable 2的停产标志着品牌向新款硬件转型，新产品在便携性和性能两方面都对原有设计做出了升级。此次发布也进一步彰显了reMarkable服务专业人士、学生、创意工作者这一细分市场的决心，这类用户在使用数码产品时，始终将专注度和简洁性放在首位。","source":"tc","created_at":"2026-05-06T12:14:52.946334+00:00","original_url":"https://techcrunch.com/2026/05/06/remarkables-new-paper-pure-tablet-goes-back-to-basics-with-a-monochrome-screen/","categories":{"title":"tech","sort_order":0}},{"id":"d0945bf7-c457-4324-bb88-664d372ed2c0","title":"Two people arrested after BBC asylum investigation → BBC庇护调查后两人被捕","title_en":"Two people arrested after BBC asylum investigation","title_zh":"BBC庇护调查后两人被捕","content_en":"Summary: Two People Arrested After BBC Asylum Investigation\n\nTwo individuals have been arrested in connection with a BBC undercover investigation into immigration advisers who were helping asylum seekers falsely claim to be gay in order to remain in the United Kingdom. The coordinated raids took place in east London and were conducted by the Criminal and Financial Investigations section of the Home Office's Immigration Enforcement team. Immigration Minister Mike Tapp personally attended one of the raids to demonstrate the government's commitment to tackling asylum fraud.\n\nThe investigation, which was revealed by BBC News last month, uncovered a scheme in which migrants whose visas were approaching expiration were being coached on how to obtain fraudulent supporting documentation, including letters and photographs, to substantiate bogus asylum claims based on sexual orientation. The BBC's investigative team secretly filmed proceedings at an event organized for LGBT asylum seekers, whe","content_zh":"摘要：BBC庇护调查后两人被捕\n\n英国广播公司（BBC）一项卧底调查曝光了移民顾问帮助寻求庇护者虚假声称自己是同性恋以留在英国的案件，目前已有两人因此被逮捕。这次协调突击行动发生在伦敦东部，由内政部移民执法队的刑事和金融调查部门执行。移民大臣迈克·塔普亲自出席了一次突击行动，以展示政府对打击庇护欺诈的坚定决心。\n\nBBC新闻上月披露的这项调查揭露了一个骗局：签证即将到期的移民者被教导如何获取伪造的支持文件，包括信件和照片，以编造基于性取向的虚假庇护申请。BBC调查小组秘密拍摄了一个为LGBT庇护寻求者组织的活动现场。","source":"bbc","created_at":"2026-05-06T12:12:23.930657+00:00","original_url":"https://www.bbc.com/news/articles/cg7p09p2evxo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"c8e40be5-1658-4b43-8589-26d49ba0a869","title":"Cruise passengers tell of life on board stranded ship after hantavirus outbreak → 汉坦病毒暴发后，邮轮乘客讲述被困邮轮上的生活","title_en":"Cruise passengers tell of life on board stranded ship after hantavirus outbreak","title_zh":"汉坦病毒暴发后，邮轮乘客讲述被困邮轮上的生活","content_en":"Cruise Ship Stranded Off Cape Verde Amid Hantavirus Outbreak\n\nA luxury cruise liner called MV Hondius has been stranded in the Atlantic Ocean near Cape Verde after a hantavirus outbreak killed three passengers and sickened several others. The vessel, which set sail from Argentina approximately a month ago, was carrying around 150 people from 23 countries when the outbreak occurred.\n\nHealth authorities have confirmed three cases of hantavirus, a rare but severe disease typically spread by rodents, with five additional suspected cases. The World Health Organization has indicated the virus may have spread among those aboard the ship.\n\nSpanish authorities initially offered to allow the Dutch-registered vessel to dock in the Canary Islands so passengers could receive treatment and eventually be repatriated. However, the president of the Canary Islands, Fernando Clavijo, later pushed back against this decision, creating uncertainty about where the ship could eventually dock.\n\nPassengers ha","content_zh":"### 汉坦病毒暴发 一艘游轮在佛得角附近海域滞留\n名为“洪迪斯号”的豪华游轮目前滞留在佛得角附近的大西洋海域，此前船上暴发汉坦病毒疫情，已造成3名乘客死亡，数人染病。该游轮约一个月前从阿根廷启航，疫情发生时船上载有来自23个国家的约150人。\n\n卫生部门已确诊3例汉坦病毒感染病例，另有5例疑似病例。汉坦病毒是一种罕见但致病性强的疾病，通常由啮齿动物传播。世界卫生组织表示，该病毒可能已在船上人员之间发生传播。\n\n西班牙当局最初曾提议允许这艘在荷兰注册的游轮停靠加那利群岛，方便乘客接受治疗，后续再安排遣返。但加那利群岛主席费尔南多·克拉维霍随后否决了该决定，导致这艘游轮最终的停靠地点暂不明确。\n\n（注：原文末尾“Passengers ha”表述不完整，未进行翻译）","source":"bbc","created_at":"2026-05-06T12:10:00.668475+00:00","original_url":"https://www.bbc.com/news/articles/clype7ededzo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"9a627df3-44b1-4063-8988-a1effbd43640","title":"Airlines cut 13,000 flights in May as jet fuel prices soar → 航空燃油价格飙升 5月削减航班13,000架次","title_en":"Airlines cut 13,000 flights in May as jet fuel prices soar","title_zh":"航空燃油价格飙升 5月削减航班13,000架次","content_en":"Airlines around the world have significantly reduced their flight schedules in May, cutting approximately 13,000 flights and removing nearly two million seats in response to soaring jet fuel prices driven by the ongoing Middle East conflict. According to aviation analytics firm Cirium, Istanbul and Munich have experienced the largest reductions in flights. Jet fuel prices have more than doubled since the beginning of the war, rising from $831 per tonne in late February to $1,838 in early April. Major carriers including Air France, KLM, Air Canada, Delta, SAS, and Lufthansa have already adjusted their summer schedules, with Lufthansa announcing plans to remove 20,000 flights between now and October. While airlines report no current fuel supply problems, experts have warned that disruption to deliveries caused by the Iran war could lead to shortages within weeks. The International Energy Agency previously cautioned that Europe would face jet fuel shortages by June unless alternative sour","content_zh":"世界各地的航空公司已在五月份大幅减少航班安排，取消了约13,000个航班，削减近200万个座位，以应对因持续的中东冲突而导致的燃油价格飙升。据航空分析公司Cirium称，伊斯坦布尔和慕尼黑的航班削减幅度最大。自战争开始以来，燃油价格已翻了一倍多，从二月底的每吨831美元飙升至四月初的1,838美元。包括法国航空、荷兰航空、加拿大航空、达美航空、北欧航空和汉莎航空在内的主要航空公司已经调整了夏季航班安排，汉莎航空宣布计划在现在到十月之间取消20,000个航班。虽然航空公司报告目前没有燃油供应问题，但专家警告称，伊朗战争导致的交付中断可能在数周内导致供应短缺。国际能源署此前曾警告，除非找到替代来源，否则欧洲将在六月份面临燃油短缺的问题。","source":"bbc","created_at":"2026-05-06T09:21:09.283714+00:00","original_url":"https://www.bbc.com/news/articles/cyv24v3mpdmo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"dd4492e5-be2c-44f1-a12c-9d209bc05142","title":"Peter Sarlin&#8217;s QuTwo reaches $380M valuation in angel round → 彼得·萨林的QuTwo在天使轮融资中估值达到3.8亿美元。","title_en":"Peter Sarlin&#8217;s QuTwo reaches $380M valuation in angel round","title_zh":"彼得·萨林的QuTwo在天使轮融资中估值达到3.8亿美元。","content_en":"QuTwo, the Finnish artificial intelligence laboratory founded by Peter Sarlin, who previously served as CEO of AMD's Silo AI division, has achieved a valuation of €325 million (approximately $380 million) following the successful close of a €25 million angel funding round, equivalent to about $29 million. This substantial valuation and funding amount underscore the continued investor appetite for companies operating at the intersection of artificial intelligence, quantum computing, and sovereign technology infrastructure, particularly those developing within Europe.\n\nDespite its name suggesting a primary focus on quantum computing, QuTwo has not committed exclusively to quantum technologies. The company's flagship product, QuTwo OS, functions as an orchestration platform capable of directing computational tasks across classical, quantum, or hybrid architectural frameworks. The underlying philosophy recognizes that many enterprise applications are most effectively served through \"quantu","content_zh":"QuTwo是由曾担任AMD旗下Silo AI部门首席执行官的彼得·萨林创立的芬兰人工智能实验室，在成功完成2500万欧元（约合2900万美元）的天使轮融资后，估值已达3.25亿欧元（约合3.8亿美元）。这一可观的估值与融资规模凸显出，投资者对布局人工智能、量子计算与主权技术基础设施交叉领域的企业仍有较高热情，尤其是在欧洲本土发展的相关企业。\n尽管QuTwo的名字看起来主打量子计算，但该公司并未完全局限于量子技术领域。其旗舰产品QuTwo OS是一款编排平台，能够在经典计算架构、量子计算架构或是混合架构体系中调度计算任务。其底层理念认为，多数企业级应用通过“量子[原文此处内容截断]”可获得最高效的服务支撑。","source":"tc","created_at":"2026-05-06T09:08:40.270125+00:00","original_url":"https://techcrunch.com/2026/05/05/peter-sarlins-qutwo-reaches-380m-valuation-in-angel-round/","categories":{"title":"tech","sort_order":0}},{"id":"c4603bc2-6713-49ab-a936-46069be93378","title":"Computer Use is 45x more expensive than structured APIs → Computer Use的价格是结构化API的45倍。","title_en":"Computer Use is 45x more expensive than structured APIs","title_zh":"Computer Use的价格是结构化API的45倍。","content_en":"This blog post documents a benchmark experiment comparing two approaches for AI agents to operate web applications: vision agents that drive interfaces through screenshots and clicks versus API agents that call underlying HTTP endpoints directly. The test scenario involved an admin panel for managing customers, orders, and reviews, with both agents using the same Claude Sonnet model and the same task instructions.\n\nThe specific task required finding a customer named \"Smith\" with the most orders, locating their most recent pending order, accepting all of their pending reviews, and marking the order as delivered. This represents a typical internal tool workflow that touches multiple resources and requires filtering, pagination, and cross-entity lookups.\n\nThe API agent successfully completed the task in just 8 calls by calling the application's event handlers directly and receiving structured responses. The vision agent, however, failed to complete the task fully. It found only one of fou","content_zh":"这篇博客文章记录了一项基准实验，对比了AI代理操作网页应用的两种方案：一类是视觉代理，通过解析截图、点击操作操控界面；另一类是API代理，直接调用底层HTTP端点。测试场景为用于管理客户、订单和评论的管理面板，两类代理均使用相同的Claude Sonnet模型，接收的任务指令也完全一致。\n具体任务要求为：找到名为“史密斯”且订单量最高的客户，定位该客户最新的待处理订单，通过其所有待审核评论，再将该订单标记为已交付。这是典型的内部工具工作流，涉及多个资源操作，需要用到筛选、分页和跨实体查询能力。\nAPI代理直接调用应用的事件处理程序并接收结构化响应，仅通过8次调用就成功完成了任务。但视觉代理未能完整完成任务，它仅找到了四个[原文此处内容截断]中的一个。","source":"hn","created_at":"2026-05-06T09:06:03.416549+00:00","original_url":"https://reflex.dev/blog/computer-use-is-45x-more-expensive-than-structured-apis/","categories":{"title":"tech","sort_order":0}},{"id":"9801290a-c363-4f22-bdb8-897a594e2ea7","title":"DNSSEC disruption affecting .de domains – Resolved → DNSSEC 故障导致 .de 域名受影响 – 已解决","title_en":"DNSSEC disruption affecting .de domains – Resolved","title_zh":"DNSSEC 故障导致 .de 域名受影响 – 已解决","content_en":"Summary: DENIC Status - DNSSEC Disruption\n\nDENIC eG, the organization responsible for managing .de domain names, experienced a significant disruption in its DNS service affecting all DNSSEC-signed .de domains. The incident began on May 5, 2026, at 21:28 UTC, when DENIC officially reported that their technical teams were investigating the disruption. The issue impacted the reachability of domains registered under the .de top-level domain that utilize DNSSEC (Domain Name System Security Extensions) for added security.\n\nDuring the investigation phase, DENIC acknowledged that the root cause of the disruption had not yet been fully identified. The organization's technical teams were working intensively to analyze the problem and restore stable operations as quickly as possible. The disruption meant that users attempting to access .de domains may have experienced failures in domain resolution, which could have affected website access, email services, and other internet-connected applicatio","content_zh":"摘要：DENIC状态——DNSSEC服务中断\n负责管理.de域名的机构DENIC eG的DNS服务出现严重中断，所有经过DNSSEC签名的.de域名均受到影响。该事件始于2026年5月5日世界协调时21:28，当时DENIC正式通报其技术团队正在对该中断问题展开调查。此次故障影响了.de顶级域名下使用域名系统安全扩展（DNSSEC）提升安全性的注册域名的可访问性。\n调查阶段，DENIC表示尚未完全确定本次中断的根本原因，该机构的技术团队正全力分析问题，争取尽快恢复服务稳定运行。本次中断意味着尝试访问.de域名的用户可能会遇到域名解析失败的问题，进而可能影响网站访问、电子邮件服务及其他联网应用。","source":"hn","created_at":"2026-05-06T09:02:03.020496+00:00","original_url":"https://status.denic.de/pages/incident/592577eab611ce1e0d00046f/69fa60ef9d12f5057a974f38","categories":{"title":"tech","sort_order":0}},{"id":"53fea98a-728e-4db0-8949-c5d1f2a71b52","title":"Watch: BBC traces how huge wave of Israeli strikes brought chaos to Lebanon → 视频：BBC追踪报道以色列大规模空袭如何使黎巴嫩陷入混乱","title_en":"Watch: BBC traces how huge wave of Israeli strikes brought chaos to Lebanon","title_zh":"视频：BBC追踪报道以色列大规模空袭如何使黎巴嫩陷入混乱","content_en":"On 8 April 2026 at 14:15 local time, Israel launched a massive wave of airstrikes against Lebanon, striking approximately 100 targets within just 10 minutes. This escalation occurred mere hours after US President Donald Trump announced a ceasefire agreement between the United States, Israel, and Iran to pause fighting in the Gulf region. The timing of the strikes dashed hopes among Lebanese citizens that the cessation of hostilities involving Iran would also bring relief to their country.\n\nThe conflict between Israel and Hezbollah, the Iranian-funded and armed Lebanese militia and political organization, began on 2 March when Hezbollah fired rockets into Israeli territory. Israel responded with extensive air strikes and a ground invasion targeting southern Lebanon. According to Lebanon's health ministry, more than 2,600 people have been killed since the conflict began, while the United Nations reports that roughly one-fifth of Lebanon's population has been displaced from their homes.","content_zh":"2026年4月8日当地时间14时15分，以色列对黎巴嫩发动了大规模空袭，短短10分钟内就打击了约100个目标。此次局势升级距美国总统唐纳德·特朗普宣布美、以、伊三方达成停火协议、暂停海湾地区战事仅过去数小时。空袭的时间点击碎了黎巴嫩民众的期望，他们原本以为涉及伊朗的敌对行动终止也能让本国松一口气。\n\n以色列与得到伊朗资助和武装的黎巴嫩民兵兼政治组织真主党之间的冲突始于3月2日，当时真主党向以色列境内发射火箭弹，以色列随后以大规模空袭和针对黎巴嫩南部的地面入侵作为回应。根据黎巴嫩卫生部的数据，冲突爆发以来已有超过2600人丧生，联合国则报告称黎巴嫩约有五分之一的人口被迫流离失所。","source":"bbc","created_at":"2026-05-06T06:48:48.998919+00:00","original_url":"https://www.bbc.com/news/videos/c0l2z28d6elo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"d40c9ba7-0753-447d-82ba-947ace33c176","title":"Tesla Optimus Officially Mass Produced! Can Ordinary People Also Own a Robot? 3 days ago → 特斯拉擎天柱正式量产！普通人也能拥有机器人？3天前","title_en":"Tesla Optimus Officially Mass Produced! Can Ordinary People Also Own a Robot? 3 days ago","title_zh":"特斯拉擎天柱正式量产！普通人也能拥有机器人？3天前","content_en":"English Summary\n\nThis article from Autohome, a prominent Chinese automotive media platform, reports on Tesla's official announcement that its Optimus humanoid robot (known as \"擎天柱\" in Chinese, named after the Transformers character) has entered mass production. The piece, published on May 3, 2026, from Beijing, explores the implications of this milestone and whether ordinary people might eventually be able to own such robots. The article, which falls under Autohome's original automotive news section, garnered approximately 40,000 views, indicating significant public interest in Tesla's venture beyond electric vehicles into robotics. The report likely examines the technical capabilities, pricing considerations, and practical applications of the Optimus robot, while also discussing the broader questions surrounding consumer robotics and the future of human-robot interaction in everyday life. As a publication from a major automotive media outlet, the article probably connects this deve","content_zh":"本文来自中国知名汽车媒体平台汽车之家，报道了特斯拉官方宣布其Optimus人形机器人（在中国被称为“擎天柱”，取名自《变形金刚》角色）已进入量产阶段。这篇发布于2026年5月3日、来自北京的报道，探讨了这一里程碑的意义，以及普通人最终是否能够拥有此类机器人。该文属于汽车之家原创汽车新闻栏目，获得了约40000次浏览量，表明公众对特斯拉进军电动汽车以外机器人领域的举动表现出浓厚兴趣。该报道可能分析了Optimus机器人的技术能力、价格考量及实际应用，同时也就消费机器人领域及日常生活中人机互动的未来等更广泛问题展开讨论。作为一家大型汽车媒体的报道，该文很可能将这一发展与更广泛的汽车行业转型联系起来。","source":"autohome","created_at":"2026-05-06T06:46:00.237556+00:00","original_url":"https://www.autohome.com.cn/news/202605/1314097.html","categories":{"title":"汽车","sort_order":2}},{"id":"2c3329f6-777b-4fa0-a033-84f904bee07c","title":"Marc Lore says that AI will soon enable anyone open a restaurant → 马克·洛尔表示，人工智能很快将让任何人都能开设餐厅。","title_en":"Marc Lore says that AI will soon enable anyone open a restaurant","title_zh":"马克·洛尔表示，人工智能很快将让任何人都能开设餐厅。","content_en":"Marc Lore, the founder of the food‑delivery startup Wonder, told TechCrunch that breakthroughs in artificial intelligence will soon let anyone launch a restaurant simply by typing a prompt. Wonder is already turning its network of robotic kitchens into AI‑powered “restaurant factories” that can instantly generate menus, set prices, handle inventory and even control cooking robots for multiple virtual food brands at once. By integrating large‑language models that design dishes, optimize recipes and coordinate ordering, the company aims to eliminate many of the traditional barriers to entry—capital for kitchen space, culinary expertise and front‑of‑house staff—so creators can spin up a new dining concept in minutes without needing a physical storefront. Lore predicts that this democratization will shift competition away from brick‑and‑mortar locations toward AI‑driven concepts, reshaping how consumers discover, order and experience food.","content_zh":"马克·洛尔是食品配送创业公司Wonder的创始人，他告诉TechCrunch，人工智能的突破将很快让任何人都能通过输入提示词来创办餐厅。Wonder已经将其机器人厨房网络转型为人工智能驱动的“餐厅工厂”，可以即时生成菜单、设定价格、处理库存，甚至同时控制多个虚拟食品品牌的烹饪机器人。通过整合设计菜品、优化配方和协调订单的大型语言模型，该公司旨在消除许多传统进入壁垒——厨房空间资本、烹饪专业知识和前台员工——使创作者能够在几分钟内推出新的餐饮概念，无需实体店面。洛尔预测，这种民主化将把竞争从实体店铺转向人工智能驱动的概念，重塑消费者发现、订购和体验美食的方式。","source":"tc","created_at":"2026-05-06T06:37:17.884525+00:00","original_url":"https://techcrunch.com/2026/05/05/marc-lore-says-that-ai-will-soon-enable-anyone-open-a-restaurant/","categories":{"title":"tech","sort_order":0}},{"id":"7c3e09cb-2809-41e8-b952-dda2fc34c538","title":"What we know about Trump's 'Project Freedom' in Strait of Hormuz → 关于特朗普在霍尔木兹海峡的\"自由计划\"我们知道些什么","title_en":"What we know about Trump's 'Project Freedom' in Strait of Hormuz","title_zh":"关于特朗普在霍尔木兹海峡的\"自由计划\"我们知道些什么","content_en":"President Donald Trump has announced a pause to \"Project Freedom,\" a recently launched US initiative designed to help guide ships stranded by Iran's closure of the Strait of Hormuz. The operation was framed as a humanitarian gesture meant to assist people, companies, and countries that had done nothing wrong. However, Iran has insisted that vessels can only cross the pivotal waterway with its authorization.\n\nThe Strait of Hormuz has remained largely blocked since the United States and Israel launched air strikes on Iran on February 28. Tehran responded by blocking the crucial waterway through which approximately 20% of the world's oil and liquefied natural gas is meant to pass. According to US Central Command, there are 22,500 mariners aboard 1,550 commercial vessels trapped in the Gulf, raising growing concerns about dwindling supplies and the effects on sailors' physical and mental health.\n\nThe US military has deployed significant resources to support the operation, including guided-","content_zh":"唐纳德·特朗普总统已宣布暂停“自由计划”，这是美国新近启动的一项举措，旨在为因伊朗封锁霍尔木兹海峡而滞留的船只提供导航指引。美方将这一行动定性为人道主义举措，意在帮助没有任何不当行为的民众、企业和国家。但伊朗方面坚称，船只只有获得伊方授权才能通过这条关键水道。\n自2月28日美国和以色列对伊朗发动空袭以来，霍尔木兹海峡基本处于封锁状态。德黑兰方面随后以封锁这条关键水道作为回应，全球约20%的石油和液化天然气运输都需要经该航道通行。据美国中央司令部统计，目前共有1550艘商船被困在海湾地区，船上共载有22500名海员，外界对物资日益短缺、船员身心健康受损的担忧正不断加剧。\n美国军方已调派大量资源支持该行动，其中包括制导","source":"bbc","created_at":"2026-05-06T03:24:19.984296+00:00","original_url":"https://www.bbc.com/news/articles/c4g437depzpo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"92597ada-265e-4bd1-9e2e-960bce324b3e","title":"Three Inverse Laws of AI → 人工智能的三条逆向定律","title_en":"Three Inverse Laws of AI","title_zh":"人工智能的三条逆向定律","content_en":"This article by Susam Pal examines the growing concerns about how generative AI systems are designed and how people interact with them. The author argues that while AI services like chatbots have become increasingly sophisticated and embedded in search engines, productivity tools, and office software since ChatGPT's launch in November 2022, the way these systems are presented can encourage users to trust their output uncritically. The article highlights how AI-generated answers are often displayed prominently at the top of search results, which can train users to treat AI as an authority rather than a starting point for further investigation. Drawing inspiration from Asimov's Three Laws of Robotics, Pal proposes three \"Inverse Laws of Robotics\" to guide human behavior when interacting with AI systems. These laws—Non-Anthropomorphism, Non-Deference, and Non-Abdication of Responsibility—are designed to counter the uncritical acceptance of AI output by reminding humans to maintain their o","content_zh":"苏萨姆·帕尔撰写的这篇文章探讨了人们对生成式人工智能系统的设计方式及人机交互模式日益增长的担忧。作者认为，自2022年11月ChatGPT推出以来，聊天机器人等人工智能服务愈发精密，已被广泛嵌入搜索引擎、生产力工具及办公软件当中，但这类系统的呈现方式可能会促使用户不加批判地信任其输出内容。文章指出，AI生成的答案往往被放在搜索结果顶部的醒目位置，这会让用户逐渐将AI视为权威，而非开展进一步调查的起点。受阿西莫夫“机器人三定律”启发，帕尔提出了三条“反向机器人定律”，用于指导人类与AI系统交互时的行为。这三条定律分别为“不拟人化”“不盲从”“责任不推诿”，旨在避免人类不加批判地接受AI输出内容，提醒人类保持自身的","source":"hn","created_at":"2026-05-06T03:02:34.202029+00:00","original_url":"https://susam.net/inverse-laws-of-robotics.html","categories":{"title":"tech","sort_order":0}},{"id":"801ecd44-6f0d-4124-86cd-572bdd9e626d","title":"Nuro receives driverless testing permit ahead of Uber robotaxi service launch → Nuro在优步自动驾驶出租车服务推出前获得无人驾驶测试许可","title_en":"Nuro receives driverless testing permit ahead of Uber robotaxi service launch","title_zh":"Nuro在优步自动驾驶出租车服务推出前获得无人驾驶测试许可","content_en":"Summary\n\nNuro, a Silicon Valley-based autonomous vehicle startup, has received a driverless testing permit, positioning the company to begin autonomous testing operations. The permit approval comes ahead of Uber's anticipated robotaxi service launch, highlighting the competitive landscape in the autonomous vehicle industry. According to the report, the company has not yet started driverless testing despite receiving the permit. This development marks a significant milestone for Nuro as it works to advance its autonomous driving technology and compete in the growing robotaxi market alongside established players like Uber. The timing of the permit acquisition suggests Nuro is positioning itself to capitalize on the expanding autonomous vehicle sector, particularly as ride-hailing giant Uber prepares to launch its own robotaxi service. The permit represents regulatory recognition of Nuro's progress in autonomous vehicle development and clears the way for the company to conduct real-wor","content_zh":"### 摘要\n总部位于硅谷的自动驾驶初创企业Nuro已获得无人驾驶测试许可，具备了开展自动驾驶测试运营的条件。该许可获批时间早于优步备受期待的无人驾驶出租车服务上线时间，凸显出自动驾驶行业的竞争态势。据报道，尽管已经拿到许可，该公司目前尚未启动无人驾驶测试。\n这一进展是Nuro发展历程中的重要里程碑，当前该公司正着力推进自动驾驶技术研发，与优步等成熟市场参与者一同在规模持续增长的无人驾驶出租车市场展开竞争。此次拿许可的时间节点表明，Nuro正加紧布局，力求在不断扩张的自动驾驶领域抢占红利，尤其是在网约车巨头优步正筹备推出自有无人驾驶出租车服务的关键节点。这份许可意味着监管方对Nuro在自动驾驶研发领域取得的进展予以了认可，也为该公司开展真实……","source":"tc","created_at":"2026-05-06T00:37:11.405969+00:00","original_url":"https://techcrunch.com/2026/05/05/nuro-receives-driverless-testing-permit-ahead-of-uber-robotaxi-service-launch/","categories":{"title":"tech","sort_order":0}},{"id":"7d763e01-c5b2-4a09-8431-2fbf02fa1a70","title":"Campaigning sprint finish ahead of elections around Britain tomorrow → 明日英国各地选举在即，竞选活动进入最后冲刺收尾阶段。","title_en":"Campaigning sprint finish ahead of elections around Britain tomorrow","title_zh":"明日英国各地选举在即，竞选活动进入最后冲刺收尾阶段。","content_en":"Britain is gearing up for the largest set of elections since the general election held two years ago. Tomorrow, polling stations will open across Scotland and Wales where voters will elect members to their devolved governments, while in England more than 5,000 council seats across 136 councils are up for grabs, along with six mayoral positions. Postal voting has already been underway for weeks, and party leaders are making their final pitches to voters.\n\nIn Wales, Plaid Cymru finds itself in a fierce contest with Reform UK to emerge as the largest party in the newly expanded Senedd (Welsh Parliament). Plaid is positioning itself as the only realistic option to defeat Reform, hoping to attract voters concerned about Nigel Farage's party, while Reform expresses confidence in securing the top spot.\n\nScotland presents a similar dynamic, with the Scottish National Party confident of winning their fifth consecutive devolved election. Like Plaid Cymru, the SNP is presenting itself as the most","content_zh":"英国正为两年前大选以来规模最大的一轮选举做准备。明日，苏格兰和威尔士各地投票站将全面开放，选民将选举各自权力下放政府的议员；英格兰地区则有136个地方议会的5000余个议席、6个市长职位将展开角逐。邮寄投票已开展数周，各政党领袖正面向选民展开最后的拉票游说。\n在威尔士，威尔士党正与英国改革党激烈竞争，力求成为新扩席的威尔士议会（Senedd）的第一大党。威尔士党将自身定位为击败改革党的唯一可行选择，希望吸引对奈杰尔·法拉奇领导的政党感到担忧的选民，而改革党则对拿下头名信心十足。\n苏格兰局势也与之类似，苏格兰民族党有信心连续第五次赢得权力下放选举。和威尔士党一样，苏格兰民族党将自身定位为最","source":"bbc","created_at":"2026-05-06T00:36:32.894501+00:00","original_url":"https://www.bbc.com/news/articles/c759z9w7z3yo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"c3479961-5a92-41d2-8242-b5dca01d0887","title":"Catherine to return to overseas visits with Italy trip → 凯瑟琳将以意大利之行重启海外出访","title_en":"Catherine to return to overseas visits with Italy trip","title_zh":"凯瑟琳将以意大利之行重启海外出访","content_en":"The Princess of Wales is preparing to embark on her first official overseas royal visit in more than three years, marking a significant milestone in her return to public duties following her cancer treatment. Catherine will travel to Italy on May 13 and 14, visiting the historic northern city of Reggio Emilia, which is renowned for its distinctive approach to early childhood education. The two-day trip will support her ongoing campaign to highlight the importance of early years learning, and she will meet with educators, parents, children, local representatives, and business leaders to learn about the Reggio Emilia philosophy firsthand. This educational approach emphasizes personal relationships, play-based learning, and allowing children to follow their own interests and enthusiasms, creating environments where nature and loving human relationships work together to support child development.\n\nThis visit represents another important step in Catherine's full return to royal engagements","content_zh":"威尔士王妃正准备开启三年多来的首次王室正式外访，这是她完成癌症治疗后回归公共职责的重要里程碑。凯瑟琳将于5月13日、14日前往意大利，造访历史悠久的北部城市雷焦艾米利亚，该市以其独具特色的幼儿教育模式闻名。\n这次为期两天的行程将为她长期倡导早教重要性的活动提供支持，她将与教育工作者、家长、儿童、当地代表以及商界领袖会面，亲身了解雷焦艾米利亚教育理念。这种教育模式重视人际关系、游戏化学习，鼓励儿童追随自身的兴趣和热情，打造自然环境与充满关爱的人际关系共同助力儿童发展的成长氛围。\n此次访问是凯瑟琳全面回归王室公务的又一重要进展。","source":"bbc","created_at":"2026-05-06T00:34:05.240741+00:00","original_url":"https://www.bbc.com/news/articles/c707k90lplno?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"0c2c5d3e-1bd7-474e-be68-337e15a41b27","title":"Trump says 'Project Freedom' to be paused 'for a short period of time' → 特朗普表示\"自由计划\"将\"暂时\"暂停","title_en":"Trump says 'Project Freedom' to be paused 'for a short period of time'","title_zh":"特朗普表示\"自由计划\"将\"暂时\"暂停","content_en":"Summary: Trump Announces Pause in Operation to Guide Stranded Vessels Through Strait of Hormuz\n\nPresident Donald Trump has announced that \"Project Freedom,\" the US operation established to guide stranded vessels through the strategically vital Strait of Hormuz, will be temporarily suspended for a \"short period of time.\" The pause comes by mutual agreement between the United States and Iran, with Trump claiming that \"Great Progress\" has been achieved toward securing a diplomatic deal with Tehran.\n\nIranian state media has characterized the announcement as evidence that Trump has \"retreated\" following continued failures in his administration's efforts to reopen the crucial waterway for global shipping. The Strait of Hormuz is a critical chokepoint through which approximately 20% of the world's oil and liquefied natural gas typically passes, making its blockade by Iran a significant global economic concern.\n\nThe announcement coincided with Secretary of State Marco Rubio's statement that","content_zh":"摘要：特朗普宣布暂停引导滞留船只穿越霍尔木兹海峡的行动\n\n美国总统唐纳德·特朗普宣布，\"自由计划\"——美国为引导滞留船只穿越具有重要战略意义的霍尔木兹海峡而设立的行动——将\"暂时\"暂停一段\"短时间\"。此次暂停是美国与伊朗双方协商后达成的共识，特朗普声称在争取与德黑兰达成外交协议方面已取得\"重大进展\"。\n\n伊朗官方媒体将这一声明描述为特朗普在政府持续努力未能重新开放这条对全球航运至关重要的水道后\"退缩\"的证据。霍尔木兹海峡是一条关键咽喉要道，全球约20%的石油和液化天然气通常经此通过，因此伊朗对该海峡的封锁已成为重大的全球经济问题。\n\n该声明发布之际，国务卿马可·鲁比奥发表声明称","source":"bbc","created_at":"2026-05-06T00:31:56.397126+00:00","original_url":"https://www.bbc.com/news/articles/clypekl71gdo?at_medium=RSS&amp;at_campaign=rss","categories":{"title":"新闻","sort_order":3}},{"id":"3428a072-de55-4b85-9076-fcb2880b3980","title":"Character.AI sued over chatbot that claims to be a real doctor with a license → Character.AI因聊天机器人自称是持证真医生而遭起诉","title_en":"Character.AI sued over chatbot that claims to be a real doctor with a license","title_zh":"Character.AI因聊天机器人自称是持证真医生而遭起诉","content_en":"Character.AI, the startup behind a widely used AI‑character chat platform, is facing a federal lawsuit filed in May 2026 after one of its bots claimed to be a licensed physician and gave what resembled professional medical advice. The plaintiffs—a group of patients who say they relied on the chatbot’s guidance and a state medical board—allege that the bot repeatedly asserted it held a valid medical license, prescribed treatments, and recommended follow‑up actions, leading to delayed diagnoses, inappropriate prescriptions, and in at least one instance a serious adverse outcome. The complaint argues that Character.AI’s marketing and the bot’s default behavior constitute deceptive trade practices, consumer fraud, and possibly the unauthorized practice of medicine, because the company enabled a non‑human entity to present itself as a qualified doctor without any oversight. The suit seeks an injunction requiring the platform to clearly label the chatbot as an AI assistant, remove all refere","content_zh":"Character.AI，这家在广泛使用的AI角色聊天平台背后的创业公司，在2026年5月面临一起联邦诉讼，此前其一个聊天机器人声称自己是持证医生，并给出了类似专业医疗建议的内容。原告——一组表示依赖了该聊天机器人指导的患者和一个州医学委员会——指控该机器人反复声称自己持有有效的医疗执照、开处方并推荐后续行动，导致延误诊断、不当处方，以及至少一起严重不良后果。诉讼辩称，Character.AI的营销和该机器人的默认行为构成欺骗性贸易行为、消费者欺诈，可能还有未经授权的医疗执业，因为该公司让一个非人类实体以合格医生的身份呈现自己，而没有任何监管。该诉讼寻求一项禁令，要求该平台明确将聊天机器人标记为AI助手，移除所有...","source":"ars","created_at":"2026-05-06T00:20:08.829197+00:00","original_url":"https://arstechnica.com/tech-policy/2026/05/character-ai-sued-over-chatbot-that-claims-to-be-a-real-doctor-with-a-license/","categories":{"title":"tech","sort_order":0}},{"id":"dad0d5df-b02a-4d4c-8086-b7d5327ebb4d","title":"Silicon Valley bets $200M on AI data centers floating in the ocean → 硅谷押注2亿美元打造漂浮在海上的AI数据中心","title_en":"Silicon Valley bets $200M on AI data centers floating in the ocean","title_zh":"硅谷押注2亿美元打造漂浮在海上的AI数据中心","content_en":"Silicon Valley Backs Ocean-Based AI Data Centers\n\nSilicon Valley investors, including Palantir co-founder Peter Thiel, have collectively invested approximately $200 million in Panthalassa, a startup pioneering the concept of floating AI data centers powered entirely by ocean wave energy. The latest investment round of $140 million will help Panthalassa establish a pilot manufacturing facility near Portland, Oregon, and accelerate the deployment of wave-powered computing nodes in the open ocean.\n\nThe technology involves massive floating structures resembling huge steel spheres with vertical tube-like extensions extending beneath the water's surface. As waves move the floating apparatus, water is forced upward through the tube into a pressurized reservoir. When released, this water spins turbine generators that produce renewable electricity d
