<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>潮汐 · Tides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Dark theme (default) - warm tones */
      --bg-primary: #0f0e0d;
      --bg-secondary: #1a1816;
      --bg-tertiary: #242220;
      --text-primary: #e8e2d8;
      --text-secondary: #9a9288;
      --text-tertiary: #5a5650;
      --accent: #d4a055;
      --accent-dim: rgba(212, 160, 85, 0.12);
      --border: #2a2724;
      --border-light: #383530;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-mono: 'Courier Prime', 'Courier New', monospace;

      --transition-fast: 0.15s ease;
      --transition-slow: 0.4s ease;
    }

    [data-theme="light"] {
      --bg-primary: #f5f0e8;
      --bg-secondary: #ebe5db;
      --bg-tertiary: #e0d9cc;
      --text-primary: #1e1a16;
      --text-secondary: #5c5650;
      --text-tertiary: #9a9590;
      --accent: #9b6238;
      --accent-dim: rgba(155, 98, 56, 0.1);
      --border: #d4cdc2;
      --border-light: #e0d9cc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-display);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      transition: background var(--transition-slow), color var(--transition-slow);
    }

    ::selection { background: var(--accent); color: var(--bg-primary); }
    a { color: inherit; text-decoration: none; }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 100px 32px 140px;
    }

    /* ---- Noise texture overlay ---- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.025;
      z-index: 9999;
    }

    /* ---- Header ---- */
    .site-header {
      margin-bottom: 80px;
      position: relative;
    }

    .site-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .site-meta::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: var(--border);
    }

    .site-title {
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .site-title span {
      color: var(--accent);
      font-style: italic;
    }

    .site-tagline {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
    }

    /* ---- Theme & Language Toggle Row ---- */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 56px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .lang-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .lang-toggle button {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      transition: all var(--transition-fast);
      letter-spacing: 0.05em;
    }

    .lang-toggle button:hover { color: var(--text-primary); background: var(--bg-secondary); }
    .lang-toggle button.active { background: var(--text-primary); color: var(--bg-primary); }
    .lang-toggle button + button { border-left: 1px solid var(--border); }

    .theme-toggle {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      transition: all var(--transition-fast);
    }

    .theme-toggle:hover { color: var(--text-primary); border-color: var(--text-tertiary); }

    /* ---- Post List ---- */
    .posts-list { list-style: none; }

    .post-item {
      border-bottom: 1px solid var(--border);
      opacity: 0;
      transform: translateY(12px);
      animation: slideUp 0.5s ease forwards;
    }

    .post-link {
      display: block;
      padding: 40px 0;
      cursor: pointer;
      transition: padding-left var(--transition-fast);
    }

    .post-link:hover { padding-left: 16px; }
    .post-link:hover .post-item-title { color: var(--accent); }

    .post-item-title {
      font-size: clamp(20px, 3.5vw, 26px);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
      transition: color var(--transition-fast);
    }

    .post-item-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .post-item-meta span { display: flex; align-items: center; gap: 5px; }
    .post-item-meta .dot { width: 3px; height: 3px; background: var(--border-light); border-radius: 50%; }

    .post-item-excerpt {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ---- Post Detail ---- */
    .post-detail { animation: fadeIn 0.5s ease; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      margin-bottom: 56px;
      cursor: pointer;
      transition: color var(--transition-fast);
      letter-spacing: 0.05em;
    }

    .back-link:hover { color: var(--accent); }
    .back-link svg { transition: transform var(--transition-fast); }
    .back-link:hover svg { transform: translateX(-4px); }

    .post-header { margin-bottom: 48px; }

    .post-category {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .post-title {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    .post-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .post-meta span { display: flex; align-items: center; gap: 6px; }

    .post-body {
      font-size: 18px;
      line-height: 1.85;
      color: var(--text-secondary);
    }

    .post-body p { margin-bottom: 28px; }
    .post-body p:last-child { margin-bottom: 0; }

    .content-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 48px 0;
    }

    .post-url {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 48px;
      padding: 14px 28px;
      background: var(--accent);
      color: var(--bg-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      border-radius: 3px;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }

    .post-url:hover { opacity: 0.85; transform: translateY(-1px); }

    /* ---- States ---- */
    .loading {
      text-align: center;
      padding: 100px 0;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 0.1em;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      margin-left: 10px;
      animation: blink 1.2s ease infinite;
    }

    .error-msg {
      text-align: center;
      padding: 60px 40px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* ---- Footer ---- */
    footer {
      margin-top: 100px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
      letter-spacing: 0.05em;
    }

    /* ---- Animations ---- */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* ---- Responsive ---- */
    @media (max-width: 600px) {
      .container { padding: 60px 20px 80px; }
      .post-link { padding: 28px 0; }
      .post-link:hover { padding-left: 0; }
      .controls { flex-direction: column; gap: 12px; align-items: flex-start; }
      .post-url { display: block; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="app"></div>
    <footer>
      <span>潮汐 Tides · Powered by Supabase</span>
      <span id="theme-label">Dark Mode</span>
    </footer>
  </div>

  <script>
    const SUPABASE_URL = 'https://fzxuotfihpbzozjoplim.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6eHVvdGZpaHBiem96am9wbGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3OTM1MzMsImV4cCI6MjA5MTM2OTUzM30.pfhwZ7kv4CUy5PT_s62WzfIC3cHeXR2Z4YIXUjjqY1c';

    const app = document.getElementById('app');

    // Preferences
    let titleLang = localStorage.getItem('titleLang') || 'zh';
    let contentLang = localStorage.getItem('contentLang') || 'zh';
    let currentTheme = localStorage.getItem('theme') || 'dark';

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', currentTheme);
      document.getElementById('theme-label').textContent = currentTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
    }
    applyTheme();

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', currentTheme);
      applyTheme();
    }

    function setTitleLang(lang) {
      titleLang = lang;
      localStorage.setItem('titleLang', lang);
      handleRoute();
    }

    function setContentLang(lang) {
      contentLang = lang;
      localStorage.setItem('contentLang', lang);
      handleRoute();
    }

    function getPostIdFromHash() {
      const match = window.location.hash.match(/^#\/post\/(.+)/);
      return match ? match[1] : null;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function getDisplayTitle(post) {
      if (titleLang === 'en') return escapeHtml(post.title_en || post.title);
      if (titleLang === 'zh') return escapeHtml(post.title_zh || post.title_en || post.title);
      return escapeHtml(post.title);
    }

    function getDisplayContent(post) {
      const en = post.content_en || '';
      const zh = post.content_zh || '';
      if (contentLang === 'en') return en;
      if (contentLang === 'zh') return zh;
      if (en && zh) return zh + '\n---\n' + en;
      return zh || en;
    }

    function langToggleHtml(selected, onChange) {
      const langs = [
        { code: 'zh', label: '中文' },
        { code: 'en', label: 'EN' },
        { code: 'all', label: 'All' }
      ];
      return '<div class="lang-toggle">' +
        langs.map(l =>
          `<button class="${l.code === selected ? 'active' : ''}" onclick="${onChange}('${l.code}')">${l.label}</button>`
        ).join('') +
        '</div>';
    }

    async function fetchPost(id) {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/blog_posts?id=eq.${id}&select=*,categories(title)`,
        { headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` } }
      );
      if (!response.ok) throw new Error('Failed to fetch');
      const data = await response.json();
      return data[0] || null;
    }

    async function fetchPosts() {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/blog_posts?select=*,categories(title)&order=created_at.desc`,
        { headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` } }
      );
      if (!response.ok) throw new Error('Failed to fetch');
      return response.json();
    }

    function getPostUrl(post) {
      if (post.original_url) return post.original_url;
      if (post.content) {
        const match = post.content.match(/https?:\/\/[^\s]+/);
        if (match) return match[0];
      }
      return null;
    }

    function goTo(path) {
      window.location.hash = path;
    }

    async function renderPost(id) {
      app.innerHTML = '<div class="loading">Loading...</div>';

      try {
        const post = await fetchPost(id);
        if (!post) {
          app.innerHTML = `
            <div class="post-detail">
              <div class="back-link" onclick="goTo('')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back
              </div>
              <div class="error-msg">Post not found</div>
            </div>
          `;
          return;
        }

        const displayTitle = getDisplayTitle(post);
        const displayContent = getDisplayContent(post);
        const postUrl = getPostUrl(post);

        app.innerHTML = `
          <div class="post-detail">
            <div class="back-link" onclick="goTo('')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Back
            </div>
            ${langToggleHtml(contentLang, 'setContentLang')}
            <article>
              <header class="post-header">
                ${post.categories ? `<div class="post-category">${escapeHtml(post.categories.title)}</div>` : ''}
                <h1 class="post-title">${displayTitle}</h1>
                <div class="post-meta">
                  <span>${formatDate(post.created_at)}</span>
                </div>
              </header>
              <div class="post-body">
                ${displayContent ? displayContent.split('\n').map(p => `<p>${escapeHtml(p)}</p>`).join('') : '<p>No content available.</p>'}
              </div>
              ${postUrl ? `<a href="${postUrl}" target="_blank" class="post-url">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
                Read Original
              </a>` : ''}
            </article>
          </div>
        `;
      } catch (err) {
        app.innerHTML = `
          <div class="post-detail">
            <div class="back-link" onclick="goTo('')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Back
            </div>
            <div class="error-msg">Unable to load post</div>
          </div>
        `;
        console.error(err);
      }
    }

    function renderPosts(posts) {
      if (posts.length === 0) {
        app.innerHTML = `
          <div class="site-header">
            <div class="site-meta">潮汐 Tides</div>
            <h1 class="site-title">潮汐 <span>·</span> Tides</h1>
            <p class="site-tagline">Stories &amp; Ideas · 故事与思想</p>
          </div>
          <div class="controls">
            ${langToggleHtml(titleLang, 'setTitleLang')}
            <button class="theme-toggle" onclick="toggleTheme()">Light Mode</button>
          </div>
          <div style="text-align:center;padding:80px 0;color:var(--text-tertiary);font-family:var(--font-mono);font-size:11px;">No posts yet</div>
        `;
        return;
      }

      app.innerHTML = `
        <div class="site-header">
          <div class="site-meta">潮汐 Tides</div>
          <h1 class="site-title">潮汐 <span>·</span> Tides</h1>
          <p class="site-tagline">Stories &amp; Ideas · 故事与思想</p>
        </div>
        <div class="controls">
          ${langToggleHtml(titleLang, 'setTitleLang')}
          <button class="theme-toggle" onclick="toggleTheme()">Light Mode</button>
        </div>
        <ul class="posts-list">
          ${posts.map((post, i) => `
            <li class="post-item" style="animation-delay:${i * 0.07}s">
              <div class="post-link" onclick="goTo('/post/${post.id}')">
                <div class="post-item-title">${getDisplayTitle(post)}</div>
                <div class="post-item-meta">
                  ${post.categories ? `<span>${escapeHtml(post.categories.title)}</span>` : ''}
                  <span class="dot"></span>
                  <span>${formatDate(post.created_at)}</span>
                </div>
                ${post.content_zh || post.content_en ? `<div class="post-item-excerpt">${escapeHtml((post.content_zh || post.content_en || '').substring(0, 120))}</div>` : ''}
              </div>
            </li>
          `).join('')}
        </ul>
      `;
    }

    async function handleRoute() {
      const postId = getPostIdFromHash();
      if (postId) {
        await renderPost(postId);
      } else {
        try {
          const posts = await fetchPosts();
          renderPosts(posts);
        } catch (err) {
          app.innerHTML = `
            <div class="site-header">
              <div class="site-meta">潮汐 Tides</div>
              <h1 class="site-title">潮汐 <span>·</span> Tides</h1>
              <p class="site-tagline">Stories &amp; Ideas · 故事与思想</p>
            </div>
            <div class="controls">
              ${langToggleHtml(titleLang, 'setTitleLang')}
              <button class="theme-toggle" onclick="toggleTheme()">Light Mode</button>
            </div>
            <div class="error-msg">Unable to load posts. Please refresh.</div>
          `;
        }
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.goTo = goTo;
    window.setTitleLang = setTitleLang;
    window.setContentLang = setContentLang;
    window.toggleTheme = toggleTheme;

    handleRoute();
  </script>
</body>
</html>
