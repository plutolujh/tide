        - paragraph [ref=e211]: 调查概要
        - paragraph [ref=e212]: 英国广播公司（BBC）通过秘密拍摄开展的一项调查，曝光了自封的婴幼儿睡眠专家向家长提供的危险婴儿睡眠建议。卧底记者发现，至少有一位知名从业者艾莉森·斯科特-赖特建议让新生儿俯卧入睡，这种做法会大幅提升婴儿猝死综合征（SIDS）的风险。英国国民医疗服务体系（NHS）强烈建议，婴儿出生后的第一年始终要采取仰卧睡姿。另一名自封专家建议在婴儿床内放置毛巾等松散物品，摇篮曲信托基金会警告称，这一行为同样会增加婴儿猝死综合征和意外死亡的风险。审阅了卧底拍摄素材的医疗专业人员表示，这些危险建议让他们感到“恶心”“惊骇”。本次调查凸显出，婴幼儿睡眠咨询目前基本属于无监管行业，出现这一现象的部分原因是新手父母可获取的产后支持十分有限。目前已有数十名家长主动出面提出相关担忧。
