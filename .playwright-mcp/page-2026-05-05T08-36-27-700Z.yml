        - paragraph [ref=e215]: A BBC investigation using secret filming has exposed dangerous baby-sleep advice being given to parents by self-described infant sleep experts. Undercover reporters discovered that at least one prominent figure, Alison Scott-Wright, advised placing a newborn to sleep on their front—a practice that significantly increases the risk of sudden infant death syndrome (SIDS). The NHS strongly recommends always placing babies on their back to sleep for the first year of life. Another self-defined expert recommended placing towels and loose items in cots, which The Lullaby Trust warns also raises the risk of SIDS and accidental death. Medical professionals who reviewed the undercover footage described feeling "sick" and "horrified" at the dangerous recommendations. The investigation highlights that infant-sleep consulting has become a largely unregulated industry, partly fueled by limited post-natal support available to new parents. Dozens of parents have come forward with concerns a
